<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಮಕ್ಕಳ ಡಿಜಿಟಲ್ ಶಾಲೆ</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Baloo Tamma 2', 'Nunito', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #F4F7F6;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Full Screen Container - Border completely removed */
        #app-container {
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            border: none;
            box-shadow: none;
        }

        /* Header Bar */
        .app-header {
            background: linear-gradient(180deg, #4FACFE 0%, #00F2FE 100%);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .user-info { display: flex; align-items: center; gap: 8px; }
        .user-avatar { width: 38px; height: 38px; background: #FFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid #FFD700; }
        .user-details h3 { font-size: 0.95rem; line-height: 1.1; }
        .user-details p { font-size: 0.75rem; opacity: 0.9; }

        /* Language Selector Bar */
        .lang-select-box {
            display: flex;
            gap: 5px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px;
            border-radius: 20px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .lang-btn.active {
            background: #FFD700;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Screen Display Area */
        .screen { flex: 1; padding: 15px; display: flex; flex-direction: column; overflow-y: auto; }

        /* Welcome Screen */
        #welcome-screen { justify-content: center; align-items: center; text-align: center; gap: 15px; background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%); }
        .robot-box { cursor: pointer; animation: bounce 2s infinite alternate ease-in-out; }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
        .robot-svg { width: 120px; height: 120px; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15)); }

        .speech-bubble {
            background: #FFF9C4;
            border: 3px solid #FBC02D;
            border-radius: 20px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 0 #FBC02D;
            max-width: 90%;
        }

        .input-group { width: 90%; max-width: 350px; display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .custom-input, .custom-select {
            width: 100%;
            padding: 12px 16px;
            border: 3px solid #4FACFE;
            border-radius: 18px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            font-weight: bold;
            color: #2C3E50;
            background: #F4F9FF;
        }

        .btn-start {
            background: linear-gradient(180deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 #1b7a54;
        }

        /* Dashboard Screen Area */
        .dashboard-title { text-align: center; color: #FF4081; font-size: 1.1rem; margin-bottom: 10px; font-weight: 800; }
        
        .writing-display-box {
            background: #E0F7FA;
            border: 2px dashed #00ACC1;
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 12px;
            text-align: center;
        }
        .writing-title { font-size: 0.85rem; color: #00838F; font-weight: bold; }
        .writing-text { font-size: 1.6rem; font-weight: 800; color: #D81B60; letter-spacing: 1px; margin: 2px 0; }
        .writing-breakdown { font-size: 0.95rem; color: #2E7D32; font-weight: bold; }

        /* Module Grid */
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .category-card {
            background: #FFF;
            border-radius: 18px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            border: 2px solid #EEE;
            cursor: pointer;
            min-height: 105px;
        }
        .card-kn { border-color: #FF9F43; background: #FFF9F0; }
        .card-jodi { border-color: #9b59b6; background: #F3E5F5; }
        .card-en { border-color: #54a0ff; background: #F0F7FF; }
        .card-hi { border-color: #ff6b6b; background: #FFF0F0; }
        .card-math { border-color: #10ac84; background: #EBFBF7; }
        .card-icon { font-size: 1.8rem; }
        .card-title { font-size: 0.9rem; font-weight: 800; color: #2D3436; }

        /* Lesson Screen View */
        .lesson-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .btn-back { background: #FF6B6B; color: white; border: none; padding: 6px 14px; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #c0392b; }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .item-card {
            aspect-ratio: 1;
            background: white;
            border: 2px solid #74b9ff;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 0 #0984e3;
            padding: 4px;
            text-align: center;
        }
        .item-char { font-size: 1.3rem; font-weight: 800; color: #2c3e50; word-break: break-all; }
        .item-sub { font-size: 0.7rem; color: #7f8c8d; font-weight: bold; }

        /* Pagination Bar */
        .pagination-bar { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
        .btn-page { background: #2196F3; color: white; border: none; padding: 8px 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-page:disabled { background: #BDC3C7; cursor: not-allowed; }
        .page-info { font-weight: bold; color: #2C3E50; font-size: 0.9rem; }

        /* Assistant Bottom Bar */
        .assistant-bar {
            background: #FFF8E1;
            border-top: 2px solid #FFE082;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }
        .chat-top { display: flex; align-items: center; gap: 8px; }
        .mini-robot { width: 30px; height: 30px; flex-shrink: 0; }
        .robot-msg { font-size: 0.85rem; font-weight: bold; color: #5D4037; flex: 1; }
        
        .chat-input-box { display: flex; gap: 6px; width: 100%; align-items: center; }
        .chat-input { flex: 1; padding: 10px 12px; border: 2px solid #FFB74D; border-radius: 12px; font-size: 0.9rem; outline: none; }
        .btn-mic { 
            background: #E91E63; 
            color: white; 
            border: none; 
            padding: 10px 12px; 
            border-radius: 12px; 
            font-size: 1.1rem; 
            cursor: pointer; 
            box-shadow: 0 3px 0 #C2185B;
            flex-shrink: 0;
        }
        .btn-mic.listening { background: #4CAF50; animation: pulse 1s infinite alternate; }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }

        .btn-go { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 10px 14px; 
            border-radius: 12px; 
            font-size: 0.95rem; 
            font-weight: 800; 
            cursor: pointer; 
            box-shadow: 0 3px 0 #2E7D32; 
            flex-shrink: 0; 
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">

    <!-- Header & Language Switcher -->
    <div id="app-header" class="app-header hidden">
        <div class="user-info">
            <div class="user-avatar">🤖</div>
            <div class="user-details">
                <h3 id="display-name">ಅರ್ಜುನ್</h3>
                <p id="display-class">ತರಗತಿ: ೧</p>
            </div>
        </div>
        
        <!-- ಭಾಷಾ ಆಯ್ಕೆ ಬಟನ್‌ಗಳು -->
        <div class="lang-select-box">
            <button class="lang-btn active" id="lang-kn" onclick="setLanguage('kn-IN', 'kn')">ಕನ್ನಡ</button>
            <button class="lang-btn" id="lang-en" onclick="setLanguage('en-US', 'en')">EN</button>
            <button class="lang-btn" id="lang-hi" onclick="setLanguage('hi-IN', 'hi')">हिंदी</button>
        </div>
    </div>

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen" class="screen">
        <div class="speech-bubble" id="welcome-bubble">
            ನಮಸ್ಕಾರ! 👋 ನಿಮ್ಮ ಹೆಸರನ್ನು ಬರೆದು ಕಲಿಕೆ ಆರಂಭಿಸಿ!
        </div>
        
        <div class="robot-box" onclick="playWelcomeAudio()">
            <svg class="robot-svg" viewBox="0 0 200 200">
                <rect x="50" y="60" width="100" height="90" rx="20" fill="#4FACFE" stroke="#00C6FF" stroke-width="5"/>
                <circle cx="80" cy="95" r="15" fill="#FFF"/><circle cx="120" cy="95" r="15" fill="#FFF"/>
                <circle cx="80" cy="95" r="7" fill="#2C3E50"/><circle cx="120" cy="95" r="7" fill="#2C3E50"/>
                <path d="M 80 125 Q 100 145 120 125" stroke="#FFF" stroke-width="6" fill="none" stroke-linecap="round"/>
                <rect x="90" y="25" width="20" height="35" fill="#FFD700"/>
                <circle cx="100" cy="20" r="12" fill="#FF4757"/>
            </svg>
        </div>

        <div class="input-group">
            <input type="text" id="student-name" class="custom-input" placeholder="ನಿಮ್ಮ ಹೆಸರು ಬರೆಯಿರಿ..." value="ಅರ್ಜುನ್">
            
            <select id="student-class" class="custom-select">
                <option value="1">೧ ನೇ ತರಗತಿ (Class 1)</option>
                <option value="2">೨ ನೇ ತರಗತಿ (Class 2)</option>
                <option value="3">೩ ನೇ ತರಗತಿ (Class 3)</option>
                <option value="4">೪ ನೇ ತರಗತಿ (Class 4)</option>
                <option value="5">೫ ನೇ ತರಗತಿ (Class 5)</option>
            </select>
            
            <button class="btn-start" onclick="startApp()">ಕಲಿಕೆ ಆರಂಭಿಸಿ 🚀</button>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="screen hidden">
        <div class="dashboard-title">ಏನು ಕಲಿಯಲು ಬಯಸುತ್ತೀಯಾ? 👇</div>
        
        <!-- ಮೇಲ್ಭಾಗದ ಉತ್ತರ ಬೋರ್ಡ್ -->
        <div id="writing-board" class="writing-display-box">
            <div class="writing-title" id="write-title">💡 ಪ್ರದರ್ಶನ ಬೋರ್ಡ್:</div>
            <div class="writing-text" id="write-word">ಅನಿಲ್</div>
            <div class="writing-breakdown" id="write-breakdown">ಅ + ನಿ + ಲ್ = ಅನಿಲ್</div>
        </div>

        <!-- 5 ಮುಖ್ಯ ಮಾಡ್ಯೂಲ್‌ಗಳು -->
        <div class="category-grid">
            <div class="category-card card-kn" onclick="openModule('kannada')">
                <div class="card-icon">ಅ</div>
                <div class="card-title">ಕನ್ನಡ ಅಕ್ಷರಗಳು & ಶಬ್ದಗಳು</div>
            </div>

            <div class="category-card card-jodi" onclick="openModule('jodakshara')">
                <div class="card-icon">🧩</div>
                <div class="card-title">ಅಕ್ಷರ ಜೋಡಣೆ (1-20)</div>
            </div>

            <div class="category-card card-en" onclick="openModule('english')">
                <div class="card-icon">A</div>
                <div class="card-title">English ABC & Words</div>
            </div>

            <div class="category-card card-hi" onclick="openModule('hindi')">
                <div class="card-icon">अ</div>
                <div class="card-title">हिंदी वर्णमाला व शब्द</div>
            </div>

            <div class="category-card card-math" onclick="openModule('maths')">
                <div class="card-icon">🔢</div>
                <div class="card-title">ಸಂಖ್ಯೆಗಳು (Numbers)</div>
            </div>
        </div>
    </div>

    <!-- LEARNING SCREEN -->
    <div id="learning-screen" class="screen hidden">
        <div class="lesson-header">
            <button class="btn-back" onclick="goDashboard()">⬅️ ಹಿಂದೆ</button>
            <h3 id="module-title" style="color:#2C3E50;">ಕಲಿಕೆ</h3>
        </div>
        
        <div id="cards-container" class="cards-grid"></div>

        <div class="pagination-bar">
            <button id="btn-prev" class="btn-page" onclick="changePage(-1)">⬅️ ಹಿಂದಿನ</button>
            <span id="page-number" class="page-info">ಪುಟ ೧</span>
            <button id="btn-next" class="btn-page" onclick="changePage(1)">ಮುಂದಿನ ➡</button>
        </div>
    </div>

    <!-- Assistant & Mic Bottom Bar -->
    <div id="assistant-bar" class="assistant-bar hidden">
        <div class="chat-top">
            <svg class="mini-robot" viewBox="0 0 200 200">
                <rect x="50" y="60" width="100" height="90" rx="20" fill="#4FACFE"/>
                <circle cx="80" cy="95" r="10" fill="#FFF"/><circle cx="120" cy="95" r="10" fill="#FFF"/>
                <path d="M 85 125 Q 100 135 115 125" stroke="#FFF" stroke-width="5" fill="none"/>
            </svg>
            <div class="robot-msg" id="robot-speech">ಪ್ರಶ್ನೆ ಕೇಳು ಮಗು!</div>
        </div>
        <div class="chat-input-box">
            <input type="text" id="chat-text" class="chat-input" placeholder="ಇಲ್ಲಿ ಪ್ರಶ್ನೆ ಬರೆಯಿರಿ..." onkeypress="handleKeyPress(event)">
            <button id="mic-btn" class="btn-mic" onclick="startVoiceRecognition()">🎤</button>
            <button class="btn-go" onclick="sendChat()">GO ➔</button>
        </div>
    </div>

</div>

<script>
    let studentName = "";
    let studentClass = "";
    let currentLang = "kn-IN"; // Default Kannada
    let langCode = "kn";

    let currentModule = "";
    let currentPage = 1;
    const itemsPerPage = 12;

    /* ನೂರಾರು ಶಬ್ದಗಳ ಹಾಗೂ ಅಕ್ಷರಗಳ ಡೇಟಾಬೇಸ್ */
    const kannadaData = [
        { char: 'ಅ', name: 'ಅರಸ' }, { char: 'ಆ', name: 'ಆನೆ' }, { char: 'ಇ', name: 'ಇಲಿ' }, { char: 'ಈ', name: 'ಈಶ' },
        { char: 'ಉ', name: 'ಉಟ' }, { char: 'ಊ', name: 'ಊಟ' }, { char: 'ಋ', name: 'ಋಷಿ' }, { char: 'ಎ', name: 'ಎಲೆ' },
        { char: 'ಏ', name: 'ಏಣಿ' }, { char: 'ಐ', name: 'ಐದನೇ' }, { char: 'ಒ', name: 'ಒಂಟೆ' }, { char: 'ಓ', name: 'ಓಡು' },
        { char: 'ಔ', name: 'ಔಷಧ' }, { char: 'ಅಂ', name: 'ಅಂಬಾರಿ' }, { char: 'ಅಃ', name: 'ಅಃ' },
        { char: 'ಕ', name: 'ಕಮಲ' }, { char: 'ಖ', name: 'ಖಡ್ಗ' }, { char: 'ಗ', name: 'ಗಜ' }, { char: 'ಘ', name: 'ಘಟ' },
        { char: 'ಚ', name: 'ಚಮಚ' }, { char: 'ಛ', name: 'ಛತ್ರಿ' }, { char: 'ಜ', name: 'ಜನ' }, { char: 'ಝ', name: 'ಝರಿ' },
        { char: 'ಟ', name: 'ಟಪಾಲು' }, { char: 'ಠ', name: 'ಠಾಣೆ' }, { char: 'ಡ', name: 'ಡಬ್ಬಿ' }, { char: 'ಢ', name: 'ಢಿಕ್ಕಿ' },
        { char: 'ತ', name: 'ತಬಲ' }, { char: 'ಥ', name: 'ಥರ' }, { char: 'ದ', name: 'ದಸರಾ' }, { char: 'ಧ', name: 'ಧನ' },
        { char: 'ನ', name: 'ನವಿಲು' }, { char: 'ಪ', name: 'ಪಟ' }, { char: 'ಫ', name: 'ಫಲ' }, { char: 'ಬ', name: 'ಬಸ್ಸು' },
        { char: 'ಭ', name: 'ಭಾರತ' }, { char: 'ಮ', name: 'ಮನೆ' }, { char: 'ಯ', name: 'ಯಂತ್ರ' }, { char: 'ರ', name: 'ರಥ' }
    ];

    const jodaksharaData = [
        { char: 'ಅನಿಲ್', breakdown: 'ಅ + ನಿ + ಲ್ = ಅನಿಲ್' },
        { char: 'ಮರ', breakdown: 'ಮ + ರ = ಮರ' },
        { char: 'ಮನೆ', breakdown: 'ಮ + ನೆ = ಮನೆ' },
        { char: 'ಶಾಲೆ', breakdown: 'ಶಾ + ലെ = ಶಾಲೆ' },
        { char: 'ಪಾಠ', breakdown: 'ಪಾ + ಠ = ಪಾಠ' },
        { char: 'ಪುಸ್ತಕ', breakdown: 'ಪು + ಸ್ತ + ಕ = ಪುಸ್ತಕ' },
        { char: 'ಅರಮನೆ', breakdown: 'ಅ + ರ + ಮ + ನೆ = ಅರಮನೆ' },
        { char: 'ಅಕ್ಕ', breakdown: 'ಅ + ಕ್ಕ = ಅಕ್ಕ' },
        { char: 'ಅಮ್ಮ', breakdown: 'ಅ + ಮ್ಮ = ಅಮ್ಮ' },
        { char: 'ಆಂಟಿ', breakdown: 'ಆಂ + ಟಿ = ಆಂಟಿ' },
        { char: 'ಬುಕ್', breakdown: 'ಬು + ಕ್ = ಬುಕ್' },
        { char: 'ಹ್ಯಾಪಿ', breakdown: 'ಹ್ಯಾ + ಪಿ = ಹ್ಯಾಪಿ' }
    ];

    const englishData = [
        { char: 'A', name: 'Apple' }, { char: 'B', name: 'Ball' }, { char: 'C', name: 'Cat' }, { char: 'D', name: 'Dog' },
        { char: 'a', name: 'apple' }, { char: 'b', name: 'ball' }, { char: 'c', name: 'cat' }, { char: 'd', name: 'dog' },
        { char: 'CAT', name: 'Cat' }, { char: 'BOY', name: 'Boy' }, { char: 'PEN', name: 'Pen' }, { char: 'BOOK', name: 'Book' }
    ];

    const hindiData = [
        { char: 'अ', name: 'अनार' }, { char: 'आ', name: 'आम' }, { char: 'इ', name: 'इमली' }, { char: 'ई', name: 'ईख' },
        { char: 'उ', name: 'उल्लू' }, { char: 'ऊ', name: 'ऊन' }, { char: 'ऋ', name: 'ऋषि' }, { char: 'ए', name: 'एड़ी' },
        { char: 'क', name: 'कमल' }, { char: 'ख', name: 'खरगोश' }, { char: 'ग', name: 'गमला' }, { char: 'घ', name: 'घर' }
    ];

    const mathData = [
        { char: '1', name: 'One / ಒಂದು' }, { char: '2', name: 'Two / ಎರಡು' }, { char: '3', name: 'Three / ಮೂರು' },
        { char: '4', name: 'Four / ನಾಲ್ಕು' }, { char: '5', name: 'Five / ಐದು' }, { char: '6', name: 'Six / ಆರು' }
    ];

    /* ಭಾಷಾ ಆಯ್ಕೆ ಬದಲಾವಣೆ */
    function setLanguage(lang, code) {
        currentLang = lang;
        langCode = code;

        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`lang-${code}`).classList.add('active');

        if(code === 'kn') setRobotMessage("ಕನ್ನಡ ಭಾಷೆ ಆಯ್ಕೆಯಾಗಿದೆ!");
        else if(code === 'en') setRobotMessage("English language selected!");
        else if(code === 'hi') setRobotMessage("हिंदी भाषा चुनी गई है!");
    }

    function playWelcomeAudio() {
        speakText("ನಮಸ್ಕಾರ! ನಿಮ್ಮ ಹೆಸರನ್ನು ಹಾಕಿ ಮತ್ತು ತರಗತಿಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ!");
    }

    function speakText(text) {
        try {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = currentLang;
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        } catch (e) { console.log(e); }
    }

    function setRobotMessage(msg) {
        document.getElementById('robot-speech').innerText = msg;
        speakText(msg);
    }

    function startApp() {
        const nameInput = document.getElementById('student-name').value.trim();
        studentClass = document.getElementById('student-class').value;
        studentName = nameInput ? nameInput : "ಅರ್ಜುನ್";

        document.getElementById('display-name').innerText = studentName;
        document.getElementById('display-class').innerText = "ತರಗತಿ: " + studentClass;

        document.getElementById('welcome-screen').classList.add('hidden');
        document.getElementById('app-header').classList.remove('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
        document.getElementById('assistant-bar').classList.remove('hidden');

        setRobotMessage(`ಸ್ವಾಗತ ${studentName}!`);
    }

    function goDashboard() {
        document.getElementById('learning-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
    }

    function openModule(moduleType) {
        currentModule = moduleType;
        currentPage = 1;
        document.getElementById('dashboard-screen').classList.add('hidden');
        document.getElementById('learning-screen').classList.remove('hidden');
        renderPaginatedContent();
    }

    function renderPaginatedContent() {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';
        document.getElementById('page-number').innerText = `ಪುಟ ${currentPage}`;
        document.getElementById('btn-prev').disabled = (currentPage === 1);

        let data = [];
        if (currentModule === 'kannada') data = kannadaData;
        else if (currentModule === 'jodakshara') data = jodaksharaData;
        else if (currentModule === 'english') data = englishData;
        else if (currentModule === 'hindi') data = hindiData;
        else if (currentModule === 'maths') data = mathData;

        let startIndex = (currentPage - 1) * itemsPerPage;
        let pageData = data.slice(startIndex, startIndex + itemsPerPage);

        document.getElementById('btn-next').disabled = (startIndex + itemsPerPage >= data.length);

        pageData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `<div class="item-char">${item.char}</div><div class="item-sub">${item.name || ''}</div>`;
            card.onclick = () => {
                showInWritingBoard(item.char, item.breakdown || item.name || item.char);
                setRobotMessage(`${item.char}`);
            };
            container.appendChild(card);
        });
    }

    function changePage(dir) {
        currentPage += dir;
        renderPaginatedContent();
    }

    function showInWritingBoard(title, breakdown) {
        document.getElementById('write-word').innerText = title;
        document.getElementById('write-breakdown').innerText = breakdown || title;
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendChat(); }

    function sendChat() {
        const input = document.getElementById('chat-text');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        processChildQuery(text);
    }

    /* ಪ್ರಶ್ನೆ ಪ್ರಕ್ರಿಯೆ ಹಾಗೂ ಸರಿಯಾದ ಉತ್ತರ ಪ್ರದರ್ಶನ */
    function processChildQuery(text) {
        let cleanText = text.trim();
        let letters = cleanText.split('').join(' + ');
        showInWritingBoard(cleanText, letters);

        if (cleanText.includes("ನೀನು ಯಾರು") || cleanText.includes("Who are you")) {
            setRobotMessage(`ನಾನು ನಿಮ್ಮ ಕಲಿ ರೋಬೋಟ್ ${studentName}!`);
        } else if (cleanText.includes("ಹೆಸರು") || cleanText.includes("Name")) {
            setRobotMessage(`ನಿನ್ನ ಹೆಸರು ${studentName}!`);
        } else {
            setRobotMessage(`ಸರಿಯಾದ ಉತ್ತರ: ${cleanText}`);
        }
    }

    /* ಧ್ವನಿ ಗ್ರಹಿಕೆ (Voice Recognition) */
    function startVoiceRecognition() {
        const micBtn = document.getElementById('mic-btn');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            setRobotMessage("ಮೈಕ್ ಲಭ್ಯವಿಲ್ಲ. ಪಠ್ಯ ಬರೆದು GO ಒತ್ತಿ.");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = currentLang;

        micBtn.classList.add('listening');
        setRobotMessage("ಮಾತನಾಡಿ...");

        recognition.start();

        recognition.onresult = function(event) {
            micBtn.classList.remove('listening');
            const transcript = event.results[0][0].transcript;
            document.getElementById('chat-text').value = transcript;
            processChildQuery(transcript);
        };

        recognition.onerror = function() {
            micBtn.classList.remove('listening');
            setRobotMessage("ಧ್ವನಿ ಕೇಳಿಸಲಿಲ್ಲ. ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ.");
        };

        recognition.onend = function() {
            micBtn.classList.remove('listening');
        };
    }
</script>
</body>
</html>
