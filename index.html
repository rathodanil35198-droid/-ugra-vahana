<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ನಮ್ಮ ಸಂಸಾರ ಸ್ಮಾರ್ಟ್ ಅಸಿಸ್ಟೆಂಟ್</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffd700;
        }
        .card {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ddd;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: none;
            background: #fff;
            color: #333;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }
        button:hover {
            background: #ff6b81;
        }
        .whatsapp-btn {
            background: #2ed573;
        }
        .whatsapp-btn:hover {
            background: #26af5f;
        }
        .call-btn {
            background: #1e90ff;
        }
        .call-btn:hover {
            background: #3742fa;
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #7bed9f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🧠 ಸ್ಮಾರ್ಟ್ ಅಸಿಸ್ಟೆಂಟ್</h2>

        <!-- ವಾಯ್ಸ್ ಕಮಾಂಡ್ ಸೆಕ್ಷನ್ -->
        <div class="card">
            <label>ಧ್ವನಿ ಮೂಲಕ ನಿಯಂತ್ರಿಸಿ (Voice Command)</label>
            <button onclick="startVoiceRecognition()">🎤 ಮಾತನಾಡಿ (Speak)</button>
        </div>

        <!-- ಊಟ ಮತ್ತು ಔಷಧಿ ರಿಮೈಂಡರ್ ಸೆಕ್ಷನ್ -->
        <div class="card">
            <label>ನೆನಪಿನ ಅಲಾರ್ಮ್ ಸೆಟ್ ಮಾಡಿ (Reminder)</label>
            <input type="time" id="reminderTime">
            <select id="reminderType">
                <option value="ಊಟದ ಸಮಯವಾಯಿತು ಬನ್ನಿ!">ಊಟದ ಸಮಯ (Meal Time)</option>
                <option value="ಔಷಧಿ ತೆಗೆದುಕೊಳ್ಳುವ ಸಮಯವಾಯಿತು!">ಔಷಧಿ ಸಮಯ (Medicine Time)</option>
                <option value="ಮಕ್ಕಳೇ ಓದಲು ಕೂಡಿ!">ಸ್ಟಡಿ ಸಮಯ (Study Time)</option>
            </select>
            <button onclick="setReminder()">ಅಲಾರ್ಮ್ ಆನ್ ಮಾಡಿ</button>
        </div>

        <!-- ಆಟೋಮ್ಯಾಟಿಕ್ ವಾಟ್ಸಾಪ್ ಮತ್ತು ಕಾಲ್ ಸೆಕ್ಷನ್ -->
        <div class="card">
            <label>ಮೊಬೈಲ್ ನಂಬರ್ ನಮೂದಿಸಿ</label>
            <input type="text" id="phoneNumber" placeholder="ಉದಾ: 9844000000 (91 ಬಳಸಿ)">
            <input type="text" id="messageText" placeholder="ಕಳುಹಿಸಬೇಕಾದ ಸಂದೇಶ">
            
            <button class="whatsapp-btn" onclick="sendWhatsApp()">💬 ವಾಟ್ಸಾಪ್ ಮೆಸೇಜ್ ಕಳುಹಿಸಿ</button>
            <button class="call-btn" onclick="makeCall()">📞 ನೇರ ಕಾಲ್ ಮಾಡಿ</button>
        </div>

        <div id="status">ಸಿದ್ಧವಾಗಿದೆ...</div>
    </div>

    <script>
        // 1. ಧ್ವನಿ ಗ್ರಹಿಸುವ ಫಂಕ್ಷನ್ (Speech Recognition)
        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("ನಿಮ್ಮ ಬ್ರೌಸರ್ ವಾಯ್ಸ್ ಕಮಾಂಡ್ ಸಪೋರ್ಟ್ ಮಾಡುವುದಿಲ್ಲ.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'kn-IN'; // ಕನ್ನಡ ಭಾಷೆ
            recognition.start();

            document.getElementById("status").innerText = "ಕೇಳಿಸಿಕೊಳ್ಳಲಾಗುತ್ತಿದೆ...";

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                document.getElementById("status").innerText = "ನೀವು ಹೇಳಿದ್ದು: " + speechToText;
                
                // ಧ್ವನಿಯಲ್ಲಿ ಬಂದ ಮಾತಿಗೆ ತಕ್ಕಂತೆ ಆಕ್ಷನ್ ಮಾಡುವುದು
                if (speechToText.includes("ಕಾಲ್ ಮಾಡು") || speechToText.includes("ಕರೆ ಮಾಡು")) {
                    speakText("ಸರಿ, ಕಾಲ್ ಮಾಡಲಾಗುತ್ತಿದೆ");
                    // ಇಲ್ಲಿ ನಂಬರ್ ಇದ್ದರೆ ನೇರವಾಗಿ ಕಾಲ್ ಮಾಡಬಹುದು
                } else {
                    speakText("ನೀವು ಹೇಳಿದ ವಿಷಯ: " + speechToText);
                }
            };

            recognition.onerror = function() {
                document.getElementById("status").innerText = "ಧ್ವನಿ ಗುರುತಿಸುವಿಕೆಯಲ್ಲಿ ದೋಷ.";
            };
        }

        // 2. ಮೊಬೈಲ್ ಮಾತನಾಡುವ ಫಂಕ್ಷನ್ (Text-to-Speech)
        function speakText(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'kn-IN';
            window.speechSynthesis.speak(utterance);
        }

        // 3. ರಿಮೈಂಡರ್ ಅಲಾರ್ಮ್ ಸೆಟ್ ಮಾಡುವುದು
        let alarmTimeout;
        function setReminder() {
            const timeInput = document.getElementById("reminderTime").value;
            const message = document.getElementById("reminderType").value;

            if (!timeInput) {
                alert("ದಯವಿಟ್ಟು ಸರಿಯಾದ ಸಮಯ ಆಯ್ಕೆ ಮಾಡಿ.");
                return;
            }

            const now = new Date();
            const [hours, minutes] = timeInput.split(":");
            const targetTime = new Date();
            targetTime.setHours(hours, minutes, 0, 0);

            let timeDifference = targetTime.getTime() - now.getTime();
            if (timeDifference < 0) {
                timeDifference += 24 * 60 * 60 * 1000; // ನಾಳೆಗೆ ಸೆಟ್ ಮಾಡುವುದು
            }

            document.getElementById("status").innerText = "ಅಲಾರ್ಮ್ ಸೆಟ್ ಮಾಡಲಾಗಿದೆ: " + timeInput;

            setTimeout(() => {
                speakText(message);
                alert(message);
            }, timeDifference);
        }

        // 4. ಆಟೋಮ್ಯಾಟಿಕ್ ವಾಟ್ಸಾಪ್ ಮೆಸೇಜ್ ಕಳುಹಿಸುವುದು
        function sendWhatsApp() {
            let phone = document.getElementById("phoneNumber").value;
            let message = document.getElementById("messageText").value;

            if (!phone) {
                alert("ದಯವಿಟ್ಟು ಮೊಬೈಲ್ ನಂಬರ್ ಹಾಕಿ.");
                return;
            }

            // ವಾಟ್ಸಾಪ್ ಲಿಂಕ್ ಜನರೇಟ್ ಮಾಡುವುದು
            let url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        // 5. ನೇರ ಕಾಲ್ ಮಾಡುವುದು (Direct Call)
        function makeCall() {
            let phone = document.getElementById("phoneNumber").value;
            if (!phone) {
                alert("ದಯವಿಟ್ಟು ಮೊಬೈಲ್ ನಂಬರ್ ಹಾಕಿ.");
                return;
            }
            window.location.href = `tel:${phone}`;
        }
    </script>

</body>
</html>
