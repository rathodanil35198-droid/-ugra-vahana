<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಕನ್ನಡ ಪದ ಜೋಡಣೆ ಗೇಮ್</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .game-card { background: #ffffff; color: #333; width: 90%; max-width: 400px; border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative; }
        
        .header { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; margin-bottom: 20px; color: #1e3c72; }
        .score-box { background: #f0f3f8; padding: 6px 12px; border-radius: 10px; }

        .answer-box { display: flex; justify-content: center; gap: 10px; min-height: 60px; border: 2px dashed #2a5298; border-radius: 12px; align-items: center; margin-bottom: 25px; background: #fafafa; }
        
        .letter-btn { background: #ff9800; color: white; font-size: 1.5rem; font-weight: bold; width: 55px; height: 55px; border-radius: 12px; border: none; cursor: pointer; box-shadow: 0 4px 0 #e68a00; transition: transform 0.1s; }
        .letter-btn:active { transform: translateY(4px); box-shadow: none; }
        
        .options-container { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }

        .action-btns { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; }
        .btn-check { background: #4caf50; color: white; }
        .btn-clear { background: #f44336; color: white; }

        /* Out / Ad Modal Screen */
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); border-radius: 20px; flex-direction: column; justify-content: center; align-items: center; padding: 20px; color: white; }
        .modal-content { background: white; color: #333; padding: 20px; border-radius: 15px; width: 100%; text-align: center; }
        .ad-space { background: #e0e0e0; height: 150px; border: 2px dashed #999; margin: 15px 0; display: flex; justify-content: center; align-items: center; color: #666; font-size: 0.9rem; font-weight: bold; }
        .btn-continue { background: #2196f3; color: white; padding: 12px 25px; border: none; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="header">
            <div class="score-box">ಲೆವೆಲ್: <span id="level-num">1</span></div>
            <div class="score-box">ಅಂಕಗಳು: <span id="score">0</span></div>
        </div>

        <h3 id="hint-text" style="margin-bottom: 15px; color: #555;">ಅಕ್ಷರಗಳನ್ನು ಸೇರಿಸಿ ಸರಿಯಾದ ಪದ ಮಾಡಿ:</h3>

        <!-- ಆಯ್ಕೆ ಮಾಡಿದ ಅಕ್ಷರಗಳು ಬೀಳುವ ಜಾಗ -->
        <div class="answer-box" id="answer-box"></div>

        <!-- ಕೆಳಗೆ ಸಿಗುವ ಅಕ್ಷರಗಳು -->
        <div class="options-container" id="options-box"></div>

        <div class="action-btns">
            <button class="btn btn-clear" onclick="clearAnswer()">ಕ್ಲಿಯರ್</button>
            <button class="btn btn-check" onclick="checkAnswer()">ಸರಿ ನೋಡೊ</button>
        </div>

        <!-- Out Screen & Ad Popup -->
        <div class="modal" id="ad-modal">
            <div class="modal-content">
                <h2 style="color: #f44336;">ನೀವು ಔಟ್ ಆಗಿದ್ದೀರಿ! ❌</h2>
                <p style="margin-top: 5px; font-weight: bold;">ಮುಂದಿನ ಲೆವೆಲ್‌ಗೆ ಹೋಗಲು OK ಒತ್ತಿ</p>
                
                <!-- Google AdMob / Advertisment Placeholder -->
                <div class="ad-space">
                    📢 [ಇಲ್ಲಿ ಗೂಗಲ್ ಜಾಹೀರಾತು ಪ್ಲೇ ಆಗುತ್ತದೆ]
                </div>

                <button class="btn-continue" onclick="closeModalNext()">OK / ಮುಂದೆ ಹೋಗಿ</button>
            </div>
        </div>
    </div>

    <script>
        // ಲೆವೆಲ್‌ಗಳ ಡೇಟಾಬೇಸ್ (ಇಲ್ಲಿ ನೀವು 1000 ಲೆವೆಲ್‌ಗಳನ್ನು ಸೇರಿಸಬಹುದು)
        const levels = [
            { level: 1, letters: ["ಠ", "ಪಾ"], answer: "ಪಾಠ" },
            { level: 2, letters: ["ರ", "ಮ"], answer: "ಮರ" },
            { level: 3, letters: ["ಕ", "ಪು", "ಸ್ತ"], answer: "ಪುಸ್ತಕ" },
            { level: 4, letters: ["ಯ", "ಲೇ", "ಶಾ"], answer: "ಶಾಲೆಯ" },
            { level: 5, letters: ["ರ", "ಭಾ", "ತ", "ರ"], answer: "ಭಾರತರ" }
        ];

        let currentLevel = 0;
        let selectedLetters = [];
        let score = 0;

        function loadLevel() {
            const levelData = levels[currentLevel];
            document.getElementById('level-num').innerText = levelData.level;
            document.getElementById('answer-box').innerHTML = '';
            document.getElementById('options-box').innerHTML = '';
            selectedLetters = [];

            // ಅಕ್ಷರ ಬಟನ್‌ಗಳನ್ನು ಕ್ರಿಯೇಟ್ ಮಾಡುವುದು
            levelData.letters.forEach((letter) => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.innerText = letter;
                btn.onclick = () => selectLetter(letter, btn);
                document.getElementById('options-box').appendChild(btn);
            });
        }

        function selectLetter(letter, btnElement) {
            selectedLetters.push(letter);
            
            // ಬೋರ್ಡ್‌ಗೆ ಅಕ್ಷರ ಸೇರಿಸುವುದು
            const selectedBtn = document.createElement('button');
            selectedBtn.className = 'letter-btn';
            selectedBtn.innerText = letter;
            document.getElementById('answer-box').appendChild(selectedBtn);

            btnElement.style.visibility = 'hidden'; // ಒತ್ತಿದ ಬಟನ್ ಹೈಡ್ ಮಾಡುವುದು
        }

        function clearAnswer() {
            loadLevel(); // ಮತ್ತೆ ರಿಸೆಟ್ ಮಾಡುವುದು
        }

        function checkAnswer() {
            const userWord = selectedLetters.join('');
            const correctAnswer = levels[currentLevel].answer;

            if (userWord === correctAnswer) {
                alert("ಅದ್ಭುತ! ಸರಿಯಾದ ಉತ್ತರ! 🎉");
                score += 10;
                document.getElementById('score').innerText = score;
                currentLevel++;

                if (currentLevel < levels.length) {
                    loadLevel();
                } else {
                    alert("ಅಭಿನಂದನೆಗಳು! ನೀವು ಎಲ್ಲಾ ಲೆವೆಲ್‌ಗಳನ್ನು ಮುಗಿಸಿದ್ದೀರಿ! 🏆");
                }
            } else {
                // ತಪ್ಪು ಉತ್ತರ ಬಂದರೆ - OUT Modal & Ad ಬರುತ್ತದೆ
                document.getElementById('ad-modal').style.display = 'flex';
            }
        }

        function closeModalNext() {
            document.getElementById('ad-modal').style.display = 'none';
            loadLevel(); // ಆಟವನ್ನು ಮುಂದುವರಿಸುವುದು
        }

        // ಗೇಮ್ ಸ್ಟಾರ್ಟ್ ಮಾಡುವುದು
        loadLevel();
    </script>

</body>
</html>
