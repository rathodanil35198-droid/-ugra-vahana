<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ತಾಲೂಕು ಮಾರ್ಕೆಟ್ - Shahapur Live App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- ಮುಖ್ಯ ಹೆಡರ್ -->
    <header class="bg-indigo-700 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-lg font-bold">🛒 ಶಹಾಪುರ ತಾಲೂಕು ಮಾರ್ಕೆಟ್</h1>
        <div id="user-info" class="text-sm hidden">
            <span id="logged-user-name" class="mr-2 font-semibold"></span>
            <button onclick="logout()" class="bg-red-500 px-2 py-1 rounded text-xs">ಲಾಗ್‌ಔಟ್</button>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-md">

        <!-- ೧. ಲಾಗಿನ್ / ಸೈನ್ ಅಪ್ ಸ್ಕ್ರೀನ್ (ಎಲ್ಲರಿಗೂ ಪ್ರತ್ಯೇಕವಾಗಿ ಲಾಗಿನ್ ಆಗಲು) -->
        <div id="auth-screen" class="bg-white p-6 rounded-lg shadow-md space-y-4">
            <h2 class="text-xl font-bold text-gray-800 text-center">ಲಾಗಿನ್ / ಖಾತೆ ನೋಂದಣಿ</h2>
            <div>
                <label class="block text-sm font-medium text-gray-700">ನಿಮ್ಮ ಹೆಸರು</label>
                <input type="text" id="auth-name" placeholder="ಹೆಸರು ನಮೂದಿಸಿ" class="w-full p-2 border rounded mt-1">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">ಮೊಬೈಲ್ ನಂಬರ್</label>
                <input type="tel" id="auth-phone" placeholder="10 ಅಂಕಿಯ ಮೊಬೈಲ್ ನಂಬರ್" class="w-full p-2 border rounded mt-1">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">ನಿಮ್ಮ ಪಾತ್ರ (Role Select)</label>
                <select id="auth-role" class="w-full p-2 border rounded mt-1">
                    <option value="customer">🛒 ಗ್ರಾಹಕರು (Customer)</option>
                    <option value="vendor">🏪 ಅಂಗಡಿಯವರು (Shop Vendor)</option>
                    <option value="delivery">🛵 ಡೆಲಿವರಿ ಬಾಯ್ (Delivery Partner)</option>
                </select>
            </div>
            <button onclick="login()" class="w-full bg-indigo-600 text-white py-2 rounded font-bold hover:bg-indigo-700">ಮುಂದುವರಿಸಿ (Login)</button>
        </div>

        <!-- ೨. ಗ್ರಾಹಕರ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ -->
        <div id="dashboard-customer" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-lg shadow">
                <h3 class="font-bold text-lg text-gray-800 mb-3">🛍️ ಲಭ್ಯವಿರುವ ಅಂಗಡಿಗಳು & ವಸ್ತುಗಳು</h3>
                <div id="customer-product-list" class="space-y-3"></div>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
                <h3 class="font-bold text-gray-800 mb-2">🛒 ನಿಮ್ಮ ಕಾರ್ಟ್ (Cart)</h3>
                <div id="customer-cart" class="text-sm text-gray-600 mb-2">ಕಾರ್ಟ್ ಖಾಲಿಯಿದೆ.</div>
                <button onclick="placeOrder()" class="w-full bg-green-600 text-white py-2 rounded font-bold">ಆರ್ಡರ್ ಖಚಿತಪಡಿಸಿ (Place Order)</button>
            </div>
        </div>

        <!-- ೩. ಅಂಗಡಿಯವರ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ -->
        <div id="dashboard-vendor" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-lg shadow">
                <h3 class="font-bold text-lg text-gray-800 mb-2">➕ ಹೊಸ ವಸ್ತುವಿನ ಫೋಟೋ & ವಿವರ ಹಾಕಿ</h3>
                <input type="text" id="v-p-name" placeholder="ವಸ್ತುವಿನ ಹೆಸರು (ಉದಾ: ದಿನಸಿ/ಬಟ್ಟೆ)" class="w-full p-2 border rounded mb-2">
                <input type="number" id="v-p-price" placeholder="ಬೆಲೆ (₹)" class="w-full p-2 border rounded mb-2">
                <button onclick="addVendorProduct()" class="w-full bg-indigo-600 text-white py-2 rounded font-bold">ಪ್ರಾಡಕ್ಟ್ ಲಿಸ್ಟ್‌ಗೆ ಸೇರಿಸಿ</button>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
                <h3 class="font-bold text-gray-800 mb-2">📦 ಬಂದಿರುವ ಆರ್ಡರ್‌ಗಳು</h3>
                <div id="vendor-orders-list" class="text-sm text-gray-600">ಯಾವುದೇ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.</div>
            </div>
        </div>

        <!-- ೪. ಡೆಲಿವರಿ ಬಾಯ್ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ -->
        <div id="dashboard-delivery" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-lg shadow">
                <h3 class="font-bold text-lg text-gray-800 mb-2">🛵 ಡೆಲಿವರಿ ಮಾಡಬೇಕಾದ ಆರ್ಡರ್‌ಗಳು</h3>
                <div id="delivery-orders-list" class="text-sm text-gray-600">ಯಾವುದೇ ಡೆಲಿವರಿ ಬಾಕಿ ಇಲ್ಲ.</div>
            </div>
        </div>

    </main>

    <script>
        // ಡೇಟಾ ಸ್ಟೋರೇಜ್
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        let products = JSON.parse(localStorage.getItem('market_products')) || [
            { id: 1, name: 'ಸೋನಾ ಮಸೂರಿ ಅಕ್ಕಿ (10kg)', price: 550, vendor: 'ರಘು ಜನರಲ್ ಸ್ಟೋರ್ಸ್' }
        ];
        let cart = [];
        let orders = JSON.parse(localStorage.getItem('market_orders')) || [];

        function checkLoginState() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard-customer').classList.add('hidden');
            document.getElementById('dashboard-vendor').classList.add('hidden');
            document.getElementById('dashboard-delivery').classList.add('hidden');
            document.getElementById('user-info').classList.add('hidden');

            if (!currentUser) {
                document.getElementById('auth-screen').classList.remove('hidden');
            } else {
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('logged-user-name').innerText = `${currentUser.name} (${currentUser.role === 'customer' ? 'ಗ್ರಾಹಕ' : currentUser.role === 'vendor' ? 'ಅಂಗಡಿ' : 'ಡೆಲಿವರಿ'})`;
                
                if (currentUser.role === 'customer') {
                    document.getElementById('dashboard-customer').classList.remove('hidden');
                    renderCustomerProducts();
                } else if (currentUser.role === 'vendor') {
                    document.getElementById('dashboard-vendor').classList.remove('hidden');
                    renderVendorOrders();
                } else if (currentUser.role === 'delivery') {
                    document.getElementById('dashboard-delivery').classList.remove('hidden');
                    renderDeliveryOrders();
                }
            }
        }

        function login() {
            let name = document.getElementById('auth-name').value;
            let phone = document.getElementById('auth-phone').value;
            let role = document.getElementById('auth-role').value;

            if (!name || !phone || phone.length < 10) {
                alert('ದಯವಿಟ್ಟು ಸರಿಯಾದ ಹೆಸರು ಮತ್ತು 10 ಅಂಕಿಯ ಮೊಬೈಲ್ ನಂಬರ್ ಹಾಕಿ!');
                return;
            }

            currentUser = { name, phone, role };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            checkLoginState();
        }

        function logout() {
            localStorage.removeItem('currentUser');
            currentUser = null;
            checkLoginState();
        }

        // ಗ್ರಾಹಕರಿಗೆ ಪ್ರಾಡಕ್ಟ್ ತೋರಿಸುವುದು
        function renderCustomerProducts() {
            let listDiv = document.getElementById('customer-product-list');
            if (products.length === 0) {
                listDiv.innerHTML = "<p>ಯಾವುದೇ ವಸ್ತುಗಳು ಲಭ್ಯವಿಲ್ಲ.</p>";
                return;
            }
            listDiv.innerHTML = products.map(p => `
                <div class="border p-3 rounded flex justify-between items-center bg-gray-50">
                    <div>
                        <h4 class="font-bold text-gray-800">${p.name}</h4>
                        <p class="text-xs text-gray-500">ಅಂಗಡಿ: ${p.vendor}</p>
                        <p class="text-green-600 font-bold mt-1">₹${p.price}</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="bg-indigo-600 text-white px-3 py-1 rounded text-sm">ಸೇರಿಸಿ</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            let prod = products.find(p => p.id === id);
            cart.push(prod);
            renderCart();
        }

        function renderCart() {
            let cartDiv = document.getElementById('customer-cart');
            if (cart.length === 0) {
                cartDiv.innerHTML = "ಕಾರ್ಟ್ ಖಾಲಿಯಿದೆ.";
                return;
            }
            let total = 0;
            let html = "";
            cart.forEach(item => {
                total += item.price;
                html += `<div class="flex justify-between border-b py-1"><span>${item.name}</span> <span>₹${item.price}</span></div>`;
            });
            html += `<div class="font-bold mt-2 flex justify-between text-indigo-700"><span>ಒಟ್ಟು ಮೊತ್ತ:</span> <span>₹${total}</span></div>`;
            cartDiv.innerHTML = html;
        }

        function placeOrder() {
            if (cart.length === 0) {
                alert('ಕಾರ್ಟ್ ಖಾಲಿಯಿದೆ!');
                return;
            }
            let newOrder = {
                id: Date.now(),
                customerName: currentUser.name,
                phone: currentUser.phone,
                items: [...cart],
                status: 'Pending (ಪ್ಯಾಕಿಂಗ್ ನಡೆಯುತ್ತಿದೆ)'
            };
            orders.push(newOrder);
            localStorage.setItem('market_orders', JSON.stringify(orders));
            cart = [];
            renderCart();
            alert('ನಿಮ್ಮ ಆರ್ಡರ್ ಯಶಸ್ವಿಯಾಗಿ ಸಲ್ಲಿಕೆಯಾಗಿದೆ!');
        }

        // ಅಂಗಡಿಯವನು ವಸ್ತು ಸೇರಿಸುವುದು
        function addVendorProduct() {
            let name = document.getElementById('v-p-name').value;
            let price = document.getElementById('v-p-price').value;
            if (!name || !price) {
                alert('ಹೆಸರು ಮತ್ತು ಬೆಲೆ ಬರೆಯಿರಿ!');
                return;
            }
            products.push({ id: Date.now(), name, price: Number(price), vendor: currentUser.name });
            localStorage.setItem('market_products', JSON.stringify(products));
            document.getElementById('v-p-name').value = '';
            document.getElementById('v-p-price').value = '';
            alert('ಹೊಸ ವಸ್ತು ಯಶಸ್ವಿಯಾಗಿ ಆಪ್‌ಗೆ ಸೇರಿದೆ!');
        }

        function renderVendorOrders() {
            let vDiv = document.getElementById('vendor-orders-list');
            let savedOrders = JSON.parse(localStorage.getItem('market_orders')) || [];
            if (savedOrders.length === 0) {
                vDiv.innerHTML = "ಯಾವುದೇ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.";
                return;
            }
            vDiv.innerHTML = savedOrders.map(o => `
                <div class="border p-2 rounded bg-gray-50 mb-2">
                    <p><b>ಗ್ರಾಹಕರು:</b> ${o.customerName} (${o.phone})</p>
                    <p><b>ಸ್ಥಿತಿ:</b> <span class="text-orange-600">${o.status}</span></p>
                    ${o.status.includes('Pending') ? `<button onclick="markReady(${o.id})" class="mt-2 bg-blue-600 text-white px-3 py-1 rounded text-xs">ಪ್ಯಾಕ್ ಆಯಿತು (Ready)</button>` : ''}
                </div>
            `).join('');
        }

        function markReady(id) {
            let o = orders.find(x => x.id === id);
            if (o) {
                o.status = 'Ready for Delivery (ಡೆಲಿವರಿಗೆ ಸಿದ್ಧ)';
                localStorage.setItem('market_orders', JSON.stringify(orders));
                renderVendorOrders();
                alert('ಆರ್ಡರ್ ಡೆಲಿವರಿಗೆ ಸಿದ್ಧವಾಗಿದೆ ಎಂದು ಅಪ್‌ಡೇಟ್ ಮಾಡಲಾಗಿದೆ!');
            }
        }

        function renderDeliveryOrders() {
            let dDiv = document.getElementById('delivery-orders-list');
            let savedOrders = JSON.parse(localStorage.getItem('market_orders')) || [];
            if (savedOrders.length === 0) {
                dDiv.innerHTML = "ಯಾವುದೇ ಡೆಲಿವರಿ ಬಾಕಿ ಇಲ್ಲ.";
                return;
            }
            dDiv.innerHTML = savedOrders.map(o => `
                <div class="border p-2 rounded bg-gray-50 mb-2">
                    <p><b>ಗ್ರಾಹಕರು:</b> ${o.customerName}</p>
                    <p><b>ಸ್ಥಿತಿ:</b> ${o.status}</p>
                    <button onclick="markDelivered(${o.id})" class="mt-2 bg-green-600 text-white px-3 py-1 rounded text-xs">ತಲುಪಿಸಲಾಗಿದೆ (Delivered)</button>
                </div>
            `).join('');
        }

        function markDelivered(id) {
            orders = orders.filter(x => x.id !== id);
            localStorage.setItem('market_orders', JSON.stringify(orders));
            renderDeliveryOrders();
            alert('ಆರ್ಡರ್ ಯಶಸ್ವಿಯಾಗಿ ತಲುಪಿಸಲಾಗಿದೆ!');
        }

        // ಆಪ್ ರನ್ ಆದಾಗ ಲಾಗಿನ್ ಸ್ಟೇಟ್ ಚೆಕ್ ಮಾಡಿ
        checkLoginState();
    </script>
</body>
</html>
