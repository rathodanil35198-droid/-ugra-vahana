<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaClone - Web App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* ಆಪ್ ಮೇನ್ ಕಂಟೇನರ್ (Mobile Screen Size) */
    .insta-app {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 850px;
      background: #ffffff;
      border: 1px solid #dbdbdb;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* 1. ಹೆಡರ್ (Top Header) */
    .top-header {
      height: 50px;
      border-bottom: 1px solid #efefef;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      background: #fff;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      font-family: 'Georgia', serif;
      font-style: italic;
    }

    .header-icons {
      display: flex;
      gap: 18px;
      font-size: 20px;
      cursor: pointer;
    }

    /* ಆಪ್ ಸ್ಕ್ರಾಲ್ ಏರಿಯಾ */
    .main-content {
      flex: 1;
      overflow-y: auto;
    }

    /* 2. ಸ್ಟೋರಿಗಳ ವಿಭಾಗ (Instagram Stories Section) */
    .stories-container {
      display: flex;
      gap: 15px;
      padding: 12px;
      border-bottom: 1px solid #efefef;
      overflow-x: auto;
      background: #fff;
    }

    .stories-container::-webkit-scrollbar {
      display: none;
    }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .story-ring {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      padding: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .story-img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #fff;
      object-fit: cover;
    }

    .story-username {
      font-size: 11px;
      margin-top: 4px;
      color: #262626;
      width: 60px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 3. ಪೋಸ್ಟ್ ಕಾರ್ಡ್ (Post Card) */
    .post-card {
      border-bottom: 1px solid #efefef;
      background: #fff;
      margin-bottom: 10px;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-pic {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .username {
      font-size: 13px;
      font-weight: 600;
    }

    .post-img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      display: block;
    }

    /* ಪೋಸ್ಟ್ ಆಕ್ಷನ್ ಬಟನ್‌ಗಳು */
    .post-actions {
      display: flex;
      justify-content: space-between;
      padding: 10px 12px 5px 12px;
      font-size: 22px;
    }

    .action-group {
      display: flex;
      gap: 15px;
    }

    .icon-btn {
      cursor: pointer;
      user-select: none;
    }

    .liked {
      color: #ed4956;
    }

    .saved {
      color: #262626;
    }

    .post-details {
      padding: 0 12px 10px 12px;
    }

    .likes-count {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .caption {
      font-size: 13px;
      color: #262626;
    }

    .caption-username {
      font-weight: 600;
      margin-right: 5px;
    }

    .comments-link {
      font-size: 12px;
      color: #8e8e8e;
      margin-top: 5px;
      cursor: pointer;
    }

    /* 4. ಬಾಟಮ್ ನ್ಯಾವಿಗೇಷನ್ ಬಾರ್ (Bottom Bar) */
    .bottom-nav {
      height: 48px;
      border-top: 1px solid #efefef;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #fff;
      font-size: 22px;
    }

    .nav-icon {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="insta-app">

    <!-- 1. ಟಾಪ್ ಹೆಡರ್ -->
    <div class="top-header">
      <div class="logo">Instagram</div>
      <div class="header-icons">
        <span onclick="alert('ಹೊಸ ನೋಟಿಫಿಕೇಶನ್‌ಗಳಿಲ್ಲ')">❤️</span>
        <span onclick="alert('ಮೆಸೇಜ್ ಬಾಕ್ಸ್ ತೆರೆಯಲಾಗುತ್ತಿದೆ...')">💬</span>
      </div>
    </div>

    <!-- ಆಪ್ ಮುಖ್ಯ ಮೆನು -->
    <div class="main-content">

      <!-- 2. ಇನ್‌ಸ್ಟಾಗ್ರಾಮ್ ಸ್ಟೋರಿಗಳ ಸೆಕ್ಷನ್ -->
      <div class="stories-container">
        <div class="story-item" onclick="viewStory('Your Story')">
          <div class="story-ring">
            <img class="story-img" src="https://picsum.photos/100/100?random=1" alt="Profile">
          </div>
          <span class="story-username">ನಿಮ್ಮ ಸ್ಟೋರಿ</span>
        </div>
        <div class="story-item" onclick="viewStory('ಅನಿಲ್')">
          <div class="story-ring">
            <img class="story-img" src="https://picsum.photos/100/100?random=2" alt="Profile">
          </div>
          <span class="story-username">ಅನಿಲ್</span>
        </div>
        <div class="story-item" onclick="viewStory('ರಾಹುಲ್')">
          <div class="story-ring">
            <img class="story-img" src="https://picsum.photos/100/100?random=3" alt="Profile">
          </div>
          <span class="story-username">ರಾಹುಲ್</span>
        </div>
        <div class="story-item" onclick="viewStory('ಸ್ನೇಹಿತರು')">
          <div class="story-ring">
            <img class="story-img" src="https://picsum.photos/100/100?random=4" alt="Profile">
          </div>
          <span class="story-username">ಸ್ನೇಹಿತರು</span>
        </div>
      </div>

      <!-- 3. ಪೋಸ್ಟ್ ಫೀಡ್ - ಪೋಸ್ಟ್ 1 -->
      <div class="post-card">
        <div class="post-header">
          <div class="user-info">
            <img class="profile-pic" src="https://picsum.photos/100/100?random=2" alt="User">
            <span class="username">anil_karnataka</span>
          </div>
          <span style="cursor: pointer;" onclick="alert('ಆಪ್ಷನ್ಸ್')">•••</span>
        </div>

        <img class="post-img" src="https://picsum.photos/500/400?random=10" alt="Post Image" ondblclick="toggleLike('like1', 'count1')">

        <div class="post-actions">
          <div class="action-group">
            <span class="icon-btn" id="like1" onclick="toggleLike('like1', 'count1')">🤍</span>
            <span class="icon-btn" onclick="addComment('comment-list-1')">💬</span>
            <span class="icon-btn" onclick="alert('ಪೋಸ್ಟ್ ಶೇರ್ ಆಗಿದೆ!')">✈️</span>
          </div>
          <span class="icon-btn" id="save1" onclick="toggleSave('save1')">🔖</span>
        </div>

        <div class="post-details">
          <div class="likes-count" id="count1">124 ಲೈಕ್‌ಗಳು</div>
          <div class="caption">
            <span class="caption-username">anil_karnataka</span>
            ನಮ್ಮ ಸುಂದರ ಪ್ರಯಾಣದ ನೆನಪುಗಳು! 🌟
          </div>
          <div class="comments-link" id="comment-list-1" onclick="addComment('comment-list-1')">ಎಲ್ಲಾ 15 ಕಾಮೆಂಟ್‌ಗಳನ್ನು ನೋಡಿ</div>
        </div>
      </div>

      <!-- ಪೋಸ್ಟ್ 2 -->
      <div class="post-card">
        <div class="post-header">
          <div class="user-info">
            <img class="profile-pic" src="https://picsum.photos/100/100?random=3" alt="User">
            <span class="username">travel_kannada</span>
          </div>
          <span style="cursor: pointer;" onclick="alert('ಆಪ್ಷನ್ಸ್')">•••</span>
        </div>

        <img class="post-img" src="https://picsum.photos/500/400?random=11" alt="Post Image" ondblclick="toggleLike('like2', 'count2')">

        <div class="post-actions">
          <div class="action-group">
            <span class="icon-btn" id="like2" onclick="toggleLike('like2', 'count2')">🤍</span>
            <span class="icon-btn" onclick="addComment('comment-list-2')">💬</span>
            <span class="icon-btn" onclick="alert('ಪೋಸ್ಟ್ ಶೇರ್ ಆಗಿದೆ!')">✈️</span>
          </div>
          <span class="icon-btn" id="save2" onclick="toggleSave('save2')">🔖</span>
        </div>

        <div class="post-details">
          <div class="likes-count" id="count2">89 ಲೈಕ್‌ಗಳು</div>
          <div class="caption">
            <span class="caption-username">travel_kannada</span>
            ಕರ್ನಾಟಕದ ನಿಸರ್ಗ ಸೌಂದರ್ಯ! 🌿📸
          </div>
          <div class="comments-link" id="comment-list-2" onclick="addComment('comment-list-2')">ಎಲ್ಲಾ 8 ಕಾಮೆಂಟ್‌ಗಳನ್ನು ನೋಡಿ</div>
        </div>
      </div>

    </div>

    <!-- 4. ಬಾಟಮ್ ನ್ಯಾವಿಗೇಷನ್ ಬಾರ್ -->
    <div class="bottom-nav">
      <span class="nav-icon" onclick="alert('ಹೋಮ್ ಫೀಡ್‌ನಲ್ಲಿದ್ದೀರಿ')">🏠</span>
      <span class="nav-icon" onclick="alert('ಹುಡುಕಾಟ (Search) ಪೇಜ್')">🔍</span>
      <span class="nav-icon" onclick="alert('ಹೊಸ ಪೋಸ್ಟ್/ಅಪ್‌ಲೋಡ್ ಬಟನ್ (+)')">➕</span>
      <span class="nav-icon" onclick="alert('ರೀಲ್ಸ್ (Reels) ವೀಡಿಯೊಗಳು')">🎬</span>
      <span class="nav-icon" onclick="alert('ನಿಮ್ಮ ಪ್ರೊಫೈಲ್ ಪೇಜ್')">👤</span>
    </div>

  </div>

  <script>
    // 1. ಲೈಕ್ ಮತ್ತು ಡಬಲ್ ಟ್ಯಾಪ್ ಫಂಕ್ಷನ್ (Like & Double Tap)
    function toggleLike(likeId, countId) {
      const likeBtn = document.getElementById(likeId);
      const countBtn = document.getElementById(countId);
      let currentLikes = parseInt(countBtn.innerText);

      if (likeBtn.classList.contains('liked')) {
        likeBtn.classList.remove('liked');
        likeBtn.innerText = '🤍';
        countBtn.innerText = (currentLikes - 1) + ' ಲೈಕ್‌ಗಳು';
      } else {
        likeBtn.classList.add('liked');
        likeBtn.innerText = '❤️';
        countBtn.innerText = (currentLikes + 1) + ' ಲೈಕ್‌ಗಳು';
      }
    }

    // 2. ಪೋಸ್ಟ್ ಸೇವಿಸುವ ಬಟನ್ (Save Bookmark)
    function toggleSave(saveId) {
      const saveBtn = document.getElementById(saveId);
      if (saveBtn.classList.contains('saved')) {
        saveBtn.classList.remove('saved');
        alert('ಪೋಸ್ಟ್ ಸೇವ್ದ್ ನಿಂದ ತೆಗೆಯಲಾಗಿದೆ');
      } else {
        saveBtn.classList.add('saved');
        alert('ಪೋಸ್ಟ್ ಸೇವ್ರ್ ಆಯಿತು!');
      }
    }

    // 3. ಸ್ಟೋರಿ ನೋಡುವ ಸೌಲಭ್ಯ (Story View)
    function viewStory(name) {
      alert(name + ' ಅವರ ಸ್ಟೋರಿ ಪ್ಲೇ ಆಗುತ್ತಿದೆ...');
    }

    // 4. ಕಾಮೆಂಟ್ ಬರೆಯುವ ಫಂಕ್ಷನ್ (Add Comment)
    function addComment(containerId) {
      const userComment = prompt("ನಿಮ್ಮ ಕಾಮೆಂಟ್ ಬರೆಯಿರಿ:");
      if (userComment) {
        const commentArea = document.getElementById(containerId);
        commentArea.innerText = "ನೀವು: " + userComment;
        commentArea.style.color = "#262626";
        commentArea.style.fontWeight = "bold";
      }
    }
  </script>

</body>
</html>
