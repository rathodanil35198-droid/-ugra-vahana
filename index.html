<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಶಾಲೆ ಮತ್ತು ಮಕ್ಕಳ ಸುರಕ್ಷತಾ ಆಪ್</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ಶಿಕ್ಷಕರ ನೋಂದಣಿ ಪೇಜ್</h2>
    <form id="teacherForm" onsubmit="generateID(event)">
        
        <div class="form-group">
            <label>ನಿಮ್ಮ ಹೆಸರು:</label>
            <input type="text" id="name" required placeholder="ನಿಮ್ಮ ಹೆಸರನ್ನು ಹಾಕಿ">
        </div>

        <div class="form-group">
            <label>ಮೊಬೈಲ್ ನಂಬರ್:</label>
            <input type="tel" id="phone" required pattern="[0-9]{10}" placeholder="10 ಅಂಕಿಯ ಮೊಬೈಲ್ ನಂಬರ್">
        </div>

        <div class="form-group">
            <label>ಜಿಲ್ಲೆ:</label>
            <input type="text" id="district" required placeholder="ನಿಮ್ಮ ಜಿಲ್ಲೆ">
        </div>

        <div class="form-group">
            <label>ತಾಲೂಕು:</label>
            <input type="text" id="taluk" required placeholder="ನಿಮ್ಮ ತಾಲೂಕು">
        </div>

        <div class="form-group">
            <label>ಊರು:</label>
            <input type="text" id="village" required placeholder="ನಿಮ್ಮ ಊರು">
        </div>

        <div class="form-group">
            <label>ಹೈಸ್ಕೂಲ್ / ಕಾಲೇಜು ಹೆಸರು:</label>
            <input type="text" id="school" required placeholder="ಶಾಲೆಯ ಹೆಸರು">
        </div>

        <div class="form-group">
            <label>ತರಗತಿ ಆಯ್ಕೆಮಾಡಿ:</label>
            <select id="classSelect" required>
                <option value="">-- ತರಗತಿ ಆಯ್ಕೆಮಾಡಿ --</option>
                <option value="LKG">LKG</option>
                <option value="UKG">UKG</option>
                <option value="1ನೇ ತರಗತಿ">1ನೇ ತರಗತಿ</option>
                <option value="2ನೇ ತರಗತಿ">2ನೇ ತರಗತಿ</option>
                <option value="3ನೇ ತರಗತಿ">3ನೇ ತರಗತಿ</option>
                <option value="4ನೇ ತರಗತಿ">4ನೇ ತರಗತಿ</option>
                <option value="5ನೇ ತರಗತಿ">5ನೇ ತರಗತಿ</option>
                <option value="6ನೇ ತರಗತಿ">6ನೇ ತರಗತಿ</option>
                <option value="7ನೇ ತರಗತಿ">7ನೇ ತರಗತಿ</option>
                <option value="8ನೇ ತರಗತಿ">8ನೇ ತರಗತಿ</option>
                <option value="9ನೇ ತರಗತಿ">9ನೇ ತರಗತಿ</option>
                <option value="10ನೇ ತರಗತಿ">10ನೇ ತರಗತಿ</option>
                <option value="PUC">PUC</option>
                <option value="Degree">Degree</option>
            </select>
        </div>

        <div class="form-group">
            <label>ಪಾಠದ ವಿಷಯ:</label>
            <select id="subjectSelect" required>
                <option value="">-- ವಿಷಯ ಆಯ್ಕೆಮಾಡಿ --</option>
                <option value="ಕನ್ನಡ">ಕನ್ನಡ</option>
                <option value="ಇಂಗ್ಲಿಷ್">ಇಂಗ್ಲಿಷ್</option>
                <option value="ಹಿಂದಿ">ಹಿಂದಿ</option>
                <option value="ಗಣಿತ">ಗಣಿತ</option>
                <option value="ವಿಜ್ಞಾನ">ವಿಜ್ಞಾನ</option>
                <option value="ಸಮಾಜ ವಿಜ್ಞಾನ">ಸಮಾಜ ವಿಜ್ಞಾನ</option>
            </select>
        </div>

        <button type="submit">ಸಂರಕ್ಷಿಸಿ ಮತ್ತು ಐಡಿ ಪಡೆಯಿರಿ</button>
    </form>
</div>

<script>
    function generateID(event) {
        event.preventDefault();
        // 4 ಡಿಜಿಟ್ ನಂಬರ್ ಜನರೇಟ್ ಮಾಡುವುದು
        const randomId = Math.floor(1000 + Math.random() * 9000);
        alert("ಯಶಸ್ವಿಯಾಗಿದೆ! ನಿಮ್ಮ 4 ಡಿಜಿಟ್ ಐಡಿ ಸಂಖ್ಯೆ: " + randomId + "\nಮಕ್ಕಳ ಹಾಜರಾತಿ ಹಾಕುವಾಗ ಇದು ಬೇಕಾಗುತ್ತದೆ.");
    }
</script>

</body>
</html>
