<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ನಮ್ಮ ತಾಲೂಕು - ಸರ್ಕಾರಿ ಯೋಜನೆಗಳು</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 15px;
        }

        header {
            background-color: #0d6efd;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .notification-btn {
            background-color: #ffc107;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .category-title {
            margin: 15px 0 10px 0;
            font-size: 1.2rem;
            color: #0d6efd;
        }

        .scheme-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            border-left: 5px solid #0d6efd;
        }

        .scheme-card h3 {
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .badge {
            background: #28a745;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 10px;
        }

        .details p {
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .contact-box {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .btn-call {
            display: inline-block;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h2>ನಮ್ಮ ತಾಲೂಕು - ಸರ್ಕಾರಿ ಯೋಜನೆಗಳು</h2>
        <p>ಸ್ವಯಂಚಾಲಿತ ಯೋಜನೆಗಳ ಮಾಹಿತಿ</p>
        <button class="notification-btn" onclick="requestNotification()">🔔 ನೋಟಿಫಿಕೇಶನ್ ಆನ್ ಮಾಡಿ</button>
    </header>

    <h3 class="category-title">📌 ಇಂದಿನ ಪ್ರಮುಖ ಸೌಲಭ್ಯಗಳು</h3>
    <div id="schemes-container">
        <p class="loading">ಮಾಹಿತಿ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</p>
    </div>

    <script>
        // ಯೋಜನೆಗಳ ಡೇಟಾ (API ಅಥವಾ ವೆಬ್ ಸ್ಕ್ರಾಪಿಂಗ್ ಮೂಲಕ ಬರುವ ಮಾದರಿ ಡೇಟಾ)
        const sampleFetchedData = [
            {
                id: 1,
                title: "ಉಚಿತ ಬೋರ್‌ವೆಲ್ ಸಬ್ಸಿಡಿ (ಗಂಗಾ ಕಲ್ಯಾಣ ಯೋಜನೆ)",
                category: "ರೈತರಿಗೆ",
                benefit: "ಬೋರ್‌ವೆಲ್ ಕೊರೆಸಲು ₹1.50 ಲಕ್ಷ ಸಬ್ಸಿಡಿ ಸಹಾಯಧನ",
                eligibility: "ಸಣ್ಣ ಮತ್ತು ಅತಿ ಸಣ್ಣ ರೈತರು (SC/ST ಹಾಗೂ ಹಿಂದುಳಿದ ವರ್ಗದವರು)",
                documents: "ಆಧಾರ್ ಕಾರ್ಡ್, ಪಹಣಿ (RTC), ಜಾತಿ ಮತ್ತು ಆದಾಯ ಪ್ರಮಾಣಪತ್ರ",
                lastDate: "2026-11-15",
                gramaOneContact: "+919876543210",
                helpline: "1800-425-3553"
            },
            {
                id: 2,
                title: "ಪಿಎಂ ಕಿಸಾನ್ ಸಮ್ಮಾನ್ ನಿಧಿ - 19ನೇ ಕಂತು",
                category: "ರೈತರಿಗೆ",
                benefit: "ವಾರ್ಷಿಕ ₹6,000 ನೇರ ಬ್ಯಾಂಕ್ ಖಾತೆಗೆ",
                eligibility: "ಸ್ವಂತ ಜಮೀನು ಹೊಂದಿರುವ ಎಲ್ಲಾ ರೈತ ಕುಟುಂಬಗಳು",
                documents: "ಆಧಾರ್, e-KYC ಪೂರ್ಣಗೊಂಡ ಬ್ಯಾಂಕ್ ಪಾಸ್‌ಬುಕ್",
                lastDate: "ಸದಾ ಚಾಲ್ತಿಯಲ್ಲಿರುತ್ತದೆ",
                gramaOneContact: "+919876543210",
                helpline: "155261"
            }
        ];

        // ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಆ್ಯಪ್/ವೆಬ್‌ನಲ್ಲಿ ಪ್ರದರ್ಶಿಸುವ ಫಂಕ್ಷನ್
        function displaySchemes() {
            const container = document.getElementById('schemes-container');
            container.innerHTML = '';

            sampleFetchedData.forEach(scheme => {
                const card = document.createElement('div');
                card.className = 'scheme-card';

                card.innerHTML = `
                    <span class="badge">${scheme.category}</span>
                    <h3>${scheme.title}</h3>
                    <div class="details">
                        <p><strong>ನೇರ ಲಾಭ:</strong> ${scheme.benefit}</p>
                        <p><strong>ಅರ್ಹತೆ:</strong> ${scheme.eligibility}</p>
                        <p><strong>ಬೇಕಾಗುವ ದಾಖಲೆಗಳು:</strong> ${scheme.documents}</p>
                        <p style="color: #d9534f;"><strong>ಕೊನೆಯ ದಿನಾಂಕ:</strong> ${scheme.lastDate}</p>
                    </div>
                    <div class="contact-box">
                        <p><strong>ಅರ್ಜಿ ಸಲ್ಲಿಸಲು ಸಂಪರ್ಕಿಸಿ:</strong></p>
                        <p>📍 ಸ್ಥಳೀಯ ಗ್ರಾಮ ಒನ್ / ಸಿಎಸ್‌ಸಿ ಕೇಂದ್ರ</p>
                        <a href="https://wa.me/${scheme.gramaOneContact}?text=${encodeURIComponent(scheme.title + ' ಬಗ್ಗೆ ಮಾಹಿತಿ ಬೇಕು')}" class="btn-call" target="_blank">
                            💬 WhatsApp ನಲ್ಲಿ ಸಂಪರ್ಕಿಸಿ
                        </a>
                        <p style="margin-top: 5px; font-size: 0.85rem; color: #555;">
                            ಸರ್ಕಾರಿ ಹೆಲ್ಪ್‌ಲೈನ್: <a href="tel:${scheme.helpline}">${scheme.helpline}</a>
                        </p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ಪುಶ್ ನೋಟಿಫಿಕೇಶನ್ ಅನುಮತಿ ಪಡೆಯುವುದು
        function requestNotification() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("ನೋಟಿಫಿಕೇಶನ್ ಆನ್ ಆಗಿದೆ! ಹೊಸ ಯೋಜನೆ ಬಂದ ತಕ್ಷಣ ಮಾಹಿತಿ ಸಿಗುತ್ತದೆ.");
                        showDummyNotification();
                    } else {
                        alert("ನೋಟಿಫಿಕೇಶನ್ ಅನುಮತಿ ನೀಡಲಾಗಿಲ್ಲ.");
                    }
                });
            } else {
                alert("ನಿಮ್ಮ ಬ್ರೌಸರ್ ನೋಟಿಫಿಕೇಶನ್ ಬೆಂಬಲಿಸುವುದಿಲ್ಲ.");
            }
        }

        // ಮಾದರಿ ನೋಟಿಫಿಕೇಶನ್ ಕಳುಹಿಸುವುದು
        function showDummyNotification() {
            if (Notification.permission === "granted") {
                new Notification("ನಮ್ಮ ತಾಲೂಕು - ಹೊಸ ಯೋಜನೆ!", {
                    body: "ಇಂದು ಹೊಸ ಯೋಜನೆ ಬಿಡುಗಡೆ: ಬೋರ್‌ವೆಲ್ ಸಬ್ಸಿಡಿಗೆ ಅರ್ಜಿ ಆಹ್ವಾನಿಸಲಾಗಿದೆ!",
                    icon: "https://via.placeholder.com/128"
                });
            }
        }

        // ಪೇಜ್ ಲೋಡ್ ಆದ ತಕ್ಷಣ ರನ್ ಆಗುತ್ತದೆ
        window.onload = () => {
            displaySchemes();
        };
    </script>
</body>
</html>
