<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಶಹಾಪುರ ಮಾರ್ಕೆಟ್ - ಡೆಲಿವರಿ ಬಾಯ್ ಆಪ್</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- ಸಕ್ಸಸ್ ಪಾಪ್‌ಅಪ್ -->
    <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center space-y-3">
            <div id="modal-icon" class="text-4xl">🎉</div>
            <h3 id="modal-title" class="text-lg font-bold text-gray-800">ಯಶಸ್ವಿ!</h3>
            <p id="modal-message" class="text-xs text-gray-600"></p>
            <button onclick="closeModal()" class="w-full bg-indigo-600 text-white py-2 rounded-xl font-bold text-xs">ಸರಿ (OK)</button>
        </div>
    </div>

    <!-- ಹೆಡರ್ -->
    <header class="bg-indigo-700 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-40">
        <h1 class="text-sm font-bold">🛵 ಶಹಾಪುರ ಮಾರ್ಕೆಟ್ (ಡೆಲಿವರಿ ಬಾಯ್)</h1>
        <div id="user-info" class="text-xs hidden items-center gap-2">
            <span id="logged-user-name" class="font-semibold"></span>
            <button onclick="logout()" class="bg-red-500 px-2 py-1 rounded">ಲಾಗ್‌ಔಟ್</button>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-md">

        <!-- ೧. ಡೆಲಿವರಿ ಬಾಯ್ ನೋಂದಣಿ ಪೇಜ್ -->
        <div id="auth-screen" class="bg-white p-6 rounded-2xl shadow-lg space-y-4 page-section">
            <h2 class="text-xl font-bold text-gray-800 border-b pb-2">ಡೆಲಿವರಿ ಬಾಯ್ ನೋಂದಣಿ</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-700">ನಿಮ್ಮ ಹೆಸರು</label>
                    <input type="text" id="reg-name" placeholder="ನಿಮ್ಮ ಹೆಸರು ನಮೂದಿಸಿ" class="w-full p-2 border rounded-lg text-sm mt-1">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">ಮೊಬೈಲ್ ನಂಬರ್</label>
                    <input type="tel" id="reg-phone" placeholder="10 ಅಂಕಿಯ ಮೊಬೈಲ್ ನಂಬರ್" maxlength="10" class="w-full p-2 border rounded-lg text-sm mt-1">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="reg-district" placeholder="ಜಿಲ್ಲೆ" class="p-2 border rounded-lg text-sm" value="ಯಾದಗಿರಿ">
                    <input type="text" id="reg-taluk" placeholder="ತಾಲೂಕು" class="p-2 border rounded-lg text-sm" value="ಶಹಾಪುರ">
                </div>

                <button onclick="registerDelivery()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold text-sm shadow">ಖಾತೆ ಸೃಷ್ಟಿಸಿ & ಲಾಗಿನ್ ಆಗಿ</button>
            </div>
        </div>

        <!-- ೨. ಡೆಲಿವರಿ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ -->
        <div id="dashboard-delivery" class="space-y-4 hidden page-section">
            <div class="bg-white p-4 rounded-xl shadow space-y-3">
                <h3 class="font-bold text-base text-gray-800 border-b pb-1">🛵 ಡೆಲಿವರಿ ಕಾರ್ಯಗಳು & ಇವತ್ತಿನ ವರದಿ</h3>
                
                <!-- ಇವತ್ತಿನ ಟೋಟಲ್ ಆರ್ಡರ್ಸ್ ಮತ್ತು ಕಮಿಷನ್ ವಿವರ -->
                <div class="grid grid-cols-2 gap-2 bg-indigo-50 p-3 rounded-xl text-center">
                    <div>
                        <p class="text-[10px] text-gray-600 font-semibold">ಇವತ್ತಿನ ಒಟ್ಟು ಆರ್ಡರ್ಸ್</p>
                        <p id="today-total-orders" class="text-lg font-bold text-indigo-700">0</p>
                    </div>
                    <div>
                        <p class="text-[10px] text-gray-600 font-semibold">ಕಮಿಷನ್ (10%)</p>
                        <p id="today-commission" class="text-lg font-bold text-green-700">₹0</p>
                    </div>
                </div>

                <h4 class="font-bold text-xs text-gray-700 pt-2">ಬಾಕಿವಿರುವ ಡೆಲಿವರಿಗಳು:</h4>
                <div id="delivery-orders-list" class="text-xs text-gray-600">ಯಾವುದೇ ಡೆಲಿವರಿ ಬಾಕಿ ಇಲ್ಲ.</div>
            </div>
        </div>

    </main>

    <script>
        let currentDelivery = JSON.parse(localStorage.getItem('currentDelivery')) || null;

        function showModal(title, message, icon = '🎉') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function checkLogin() {
            if (!currentDelivery) {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('dashboard-delivery').classList.add('hidden');
                document.getElementById('user-info').classList.add('hidden');
            } else {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('dashboard-delivery').classList.remove('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('logged-user-name').innerText = `${currentDelivery.name} (ಡೆಲಿವರಿ ಬಾಯ್)`;
                renderDeliveryOrders();
            }
        }

        function registerDelivery() {
            let name = document.getElementById('reg-name').value;
            let phone = document.getElementById('reg-phone').value;
            let district = document.getElementById('reg-district').value;
            let taluk = document.getElementById('reg-taluk').value;

            if (!name || !phone || phone.length < 10) {
                alert('ದಯವಿಟ್ಟು ಸರಿಯಾದ ಹೆಸರು ಮತ್ತು ಮೊಬೈಲ್ ನಂಬರ್ ಹಾಕಿ!');
                return;
            }

            currentDelivery = { name, phone, district, taluk };
            localStorage.setItem('currentDelivery', JSON.stringify(currentDelivery));
            showModal("ಯಶಸ್ವಿ!", "ಡೆಲಿವರಿ ಬಾಯ್ ಖಾತೆ ಯಶಸ್ವಿಯಾಗಿ ಸೃಷ್ಟಿಯಾಗಿದೆ!", "🛵");
            checkLogin();
        }

        function logout() {
            localStorage.removeItem('currentDelivery');
            currentDelivery = null;
            checkLogin();
        }

        function renderDeliveryOrders() {
            let dDiv = document.getElementById('delivery-orders-list');
            let savedOrders = JSON.parse(localStorage.getItem('market_orders')) || [];
            
            // ಪ್ಯಾಕಿಂಗ್ ಮುಗಿದು ಡೆಲಿವರಿಗೆ ಬಂದಿರುವ ಆರ್ಡರ್‌ಗಳು
            let readyOrders = savedOrders.filter(o => o.packingReady && !o.delivered);

            let totalCount = savedOrders.length;
            let totalAmount = savedOrders.reduce((sum, ord) => sum + ord.items.reduce((s, i) => s + i.discPrice, 0), 0);
            let commission = Math.round(totalAmount * 0.10);

            document.getElementById('today-total-orders').innerText = totalCount;
            document.getElementById('today-commission').innerText = `₹${commission}`;

            if (readyOrders.length === 0) {
                dDiv.innerHTML = "<p class='text-gray-500 text-xs mt-2'>ಯಾವುದೇ ಡೆಲಿವರಿ ಬಾಕಿ ಇಲ್ಲ.</p>";
                return;
            }

            dDiv.innerHTML = readyOrders.map(o => `
                <div class="border p-3 rounded-xl bg-teal-50 mb-2 space-y-2">
                    <p><b>ಅಂಗಡಿ ಹೆಸರು:</b> ${o.items[0].vendorShop}</p>
                    <p><b>ಗ್ರಾಹಕರು:</b> ${o.customerName} (<a href="tel:${o.phone}" class="text-blue-600 underline font-bold">📞 ${o.phone}</a>)</p>
                    <p><b>ವಿಳಾಸ:</b> ${o.address} (Pin: ${o.pincode})</p>
                    <p><b>ಪಾವತಿ ವಿಧಾನ:</b> <span class="text-indigo-600 font-bold">${o.paymentMethod}</span></p>
                    
                    <div class="flex gap-2 pt-1 flex-wrap">
                        <a href="https://maps.google.com/?q=${encodeURIComponent(o.address)}" target="_blank" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow">🗺️ ಜಿಪಿಎಸ್ ಮ್ಯಾಪ್ ರೂಟ್</a>
                        
                        <button onclick="markDelivered(${o.id})" class="w-full bg-green-600 text-white py-2 rounded-lg text-xs font-bold shadow">✅ ಡೆಲಿವರಿ ಮುಗಿಯಿತು & ಪೇಮೆಂಟ್ ಕನ್ಫರ್ಮ್ (OK)</button>
                    </div>
                </div>
            `).join('');
        }

        function markDelivered(id) {
            let savedOrders = JSON.parse(localStorage.getItem('market_orders')) || [];
            let o = savedOrders.find(x => x.id === id);
            if (o) {
                o.delivered = true;
                o.status = 'ಡೆಲಿವರಿ ಯಶಸ್ವಿಯಾಗಿದೆ (Payment & Delivery Success)';
                localStorage.setItem('market_orders', JSON.stringify(savedOrders));
                renderDeliveryOrders();
                showModal("ಯಶಸ್ವಿ!", "ಡೆಲಿವರಿ ಮುಗಿದಿದೆ ಮತ್ತು ಪೇಮೆಂಟ್ ಸಕ್ಸೆಸ್ ಆಗಿದೆ!", "💰");
            }
        }

        checkLogin();
    </script>
</body>
</html>
