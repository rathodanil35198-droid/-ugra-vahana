<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಮಕ್ಕಳ ಡಿಜಿಟಲ್ ಶಾಲೆ</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Baloo Tamma 2', 'Nunito', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        #app-container {
            width: 100%;
            max-width: 450px;
            height: 92vh;
            max-height: 850px;
            background: #ffffff;
            border-radius: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 8px solid #FFF066;
        }

        /* Header */
        .app-header {
            background: linear-gradient(180deg, #4FACFE 0%, #00F2FE 100%);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 40px; height: 40px; background: #FFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px solid #FFD700; }
        .user-details h3 { font-size: 1rem; line-height: 1.1; }
        .user-details p { font-size: 0.8rem; opacity: 0.9; }

        .score-badge {
            background: #FFD700;
            color: #4A3B00;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 3px 0 #C9A800;
        }

        /* Screen Area */
        .screen { flex: 1; padding: 15px; display: flex; flex-direction: column; overflow-y: auto; }

        /* Screen 1: Welcome */
        #welcome-screen { justify-content: center; align-items: center; text-align: center; gap: 15px; }
        .robot-box { cursor: pointer; animation: bounce 2s infinite alternate ease-in-out; }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-12px); } }
        .robot-svg { width: 130px; height: 130px; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15)); }

        .speech-bubble {
            background: #FFF9C4;
            border: 3px solid #FBC02D;
            border-radius: 20px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 0 #FBC02D;
            max-width: 90%;
        }

        .input-group { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .custom-input, .custom-select {
            width: 100%;
            padding: 12px 16px;
            border: 3px solid #4FACFE;
            border-radius: 18px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            font-weight: bold;
            color: #2C3E50;
            background: #F4F9FF;
        }

        .btn-start {
            background: linear-gradient(180deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 #1b7a54;
        }

        /* Dashboard */
        .dashboard-title { text-align: center; color: #FF4081; font-size: 1.3rem; margin-bottom: 12px; font-weight: 800; }
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .category-card {
            background: #FFF;
            border-radius: 20px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
            border: 3px solid #EEE;
            cursor: pointer;
        }
        .card-kn { border-color: #FF9F43; background: #FFF9F0; }
        .card-en { border-color: #54a0ff; background: #F0F7FF; }
        .card-math { border-color: #10ac84; background: #EBFBF7; }
        .card-exam { border-color: #ee5253; background: #FFF0F0; }
        .card-icon { font-size: 2.5rem; }
        .card-title { font-size: 1rem; font-weight: 800; color: #2D3436; }

        /* Lesson & Pagination View */
        .lesson-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .btn-back { background: #FF6B6B; color: white; border: none; padding: 6px 14px; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #c0392b; }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .item-card {
            aspect-ratio: 1;
            background: white;
            border: 3px solid #74b9ff;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #0984e3;
            padding: 5px;
            text-align: center;
        }
        .item-char { font-size: 1.6rem; font-weight: 800; color: #2c3e50; }
        .item-sub { font-size: 0.75rem; color: #7f8c8d; font-weight: bold; }

        /* Pagination Controls */
        .pagination-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .btn-page { background: #2196F3; color: white; border: none; padding: 8px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #1976D2; }
        .btn-page:disabled { background: #BDC3C7; box-shadow: none; cursor: not-allowed; }
        .page-info { font-weight: bold; color: #2C3E50; }

        /* Quiz View */
        .quiz-container { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }
        .question-box {
            background: #FFF3E0;
            border: 3px solid #FF9800;
            border-radius: 18px;
            padding: 15px;
            width: 100%;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #E65100;
            box-shadow: 0 4px 0 #FB8C00;
        }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
        .option-btn {
            background: #E3F2FD;
            border: 3px solid #2196F3;
            padding: 15px;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #0D47A1;
            cursor: pointer;
            box-shadow: 0 4px 0 #1976D2;
            text-align: center;
        }

        /* Persistent Assistant Bar */
        .assistant-bar {
            background: #FFF8E1;
            border-top: 3px solid #FFE082;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .chat-top { display: flex; align-items: center; gap: 10px; }
        .mini-robot { width: 40px; height: 40px; flex-shrink: 0; }
        .robot-msg { font-size: 0.9rem; font-weight: bold; color: #5D4037; flex: 1; }
        
        .chat-input-box { display: flex; gap: 8px; width: 100%; }
        .chat-input { flex: 1; padding: 8px 12px; border: 2px solid #FFB74D; border-radius: 12px; font-size: 0.9rem; outline: none; }
        .btn-mic, .btn-send { background: #FF9800; color: white; border: none; padding: 8px 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-mic { background: #E91E63; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">

    <!-- Header -->
    <div id="app-header" class="app-header hidden">
        <div class="user-info">
            <div class="user-avatar">🤖</div>
            <div class="user-details">
                <h3 id="display-name">ಮಗು</h3>
                <p id="display-class">ತರಗತಿ: ೧</p>
            </div>
        </div>
        <div class="score-badge">⭐ <span id="score-val">10</span></div>
    </div>

    <!-- 1. WELCOME SCREEN -->
    <div id="welcome-screen" class="screen">
        <div class="speech-bubble" id="welcome-bubble">
            ನಮಸ್ಕಾರ! 👋 ನಿಮ್ಮ ಹೆಸರನ್ನು ಬರೆದು, ಎಷ್ಟನೇ ತರಗತಿ ಎಂದು ಆಯ್ಕೆ ಮಾಡಿ!
        </div>
        
        <div class="robot-box" onclick="playWelcomeAudio()">
            <svg class="robot-svg" viewBox="0 0 200 200">
                <rect x="50" y="60" width="100" height="90" rx="20" fill="#4FACFE" stroke="#00C6FF" stroke-width="5"/>
                <circle cx="80" cy="95" r="15" fill="#FFF"/><circle cx="120" cy="95" r="15" fill="#FFF"/>
                <circle cx="80" cy="95" r="7" fill="#2C3E50"/><circle cx="120" cy="95" r="7" fill="#2C3E50"/>
                <path d="M 80 125 Q 100 145 120 125" stroke="#FFF" stroke-width="6" fill="none" stroke-linecap="round"/>
                <rect x="90" y="25" width="20" height="35" fill="#FFD700"/>
                <circle cx="100" cy="20" r="12" fill="#FF4757"/>
            </svg>
        </div>

        <div class="input-group">
            <input type="text" id="student-name" class="custom-input" placeholder="ನಿಮ್ಮ ಹೆಸರು ಬರೆಯಿರಿ..." value="ಅರ್ಜುನ್">
            
            <!-- Class Selection Options (1 to 10) -->
            <select id="student-class" class="custom-select">
                <option value="1">೧ ನೇ ತರಗತಿ (Class 1)</option>
                <option value="2">೨ ನೇ ತರಗತಿ (Class 2)</option>
                <option value="3">೩ ನೇ ತರಗತಿ (Class 3)</option>
                <option value="4">೪ ನೇ ತರಗತಿ (Class 4)</option>
                <option value="5">೫ ನೇ ತರಗತಿ (Class 5)</option>
                <option value="6">೬ ನೇ ತರಗತಿ (Class 6)</option>
                <option value="7">೭ ನೇ ತರಗತಿ (Class 7)</option>
                <option value="8">೮ ನೇ ತರಗತಿ (Class 8)</option>
                <option value="9">೯ ನೇ ತರಗತಿ (Class 9)</option>
                <option value="10">೧೦ ನೇ ತರಗತಿ (Class 10)</option>
            </select>
            
            <button class="btn-start" onclick="startApp()">ಕಲಿಕೆ ಆರಂಭಿಸಿ 🚀</button>
        </div>
    </div>

    <!-- 2. DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="screen hidden">
        <div class="dashboard-title">ಏನು ಕಲಿಯಲು ಬಯಸುತ್ತೀಯಾ? 👇</div>
        <div class="category-grid">
            <div class="category-card card-kn" onclick="openModule('kannada')">
                <div class="card-icon">ಅ</div>
                <div class="card-title">ಕನ್ನಡ ಅಕ್ಷರಗಳು</div>
            </div>
            <div class="category-card card-en" onclick="openModule('english')">
                <div class="card-icon">A</div>
                <div class="card-title">English ABC & Words</div>
            </div>
            <div class="category-card card-math" onclick="openModule('maths')">
                <div class="card-icon">🔢</div>
                <div class="card-title">ಅನ್ಲಿಮಿಟೆಡ್ ಸಂಖ್ಯೆಗಳು</div>
            </div>
            <div class="category-card card-exam" onclick="openModule('exam')">
                <div class="card-icon">📝</div>
                <div class="card-title">ರಸಪ್ರಶ್ನೆ (Quiz)</div>
            </div>
        </div>
    </div>

    <!-- 3. LEARNING MODULE VIEW (PAGINATED) -->
    <div id="learning-screen" class="screen hidden">
        <div class="lesson-header">
            <button class="btn-back" onclick="goDashboard()">⬅️ ಹಿಂದೆ</button>
            <h3 id="module-title" style="color:#2C3E50;">ಕಲಿಕೆ</h3>
        </div>
        
        <div id="cards-container" class="cards-grid"></div>

        <!-- Pagination Navigation Buttons -->
        <div class="pagination-bar">
            <button id="btn-prev" class="btn-page" onclick="changePage(-1)">⬅️ ಹಿಂದಿನ ಪುಟ</button>
            <span id="page-number" class="page-info">ಪುಟ ೧</span>
            <button id="btn-next" class="btn-page" onclick="changePage(1)">ಮುಂದಿನ ಪುಟ ➡️️</button>
        </div>
    </div>

    <!-- 4. EXAM SCREEN -->
    <div id="exam-screen" class="screen hidden">
        <div class="lesson-header">
            <button class="btn-back" onclick="goDashboard()">⬅️ ನಿರ್ಗಮಿಸು</button>
            <h3 style="color:#E65100;">ಮಕ್ಕಳ ಪರೀಕ್ಷೆ 🎯</h3>
        </div>
        <div class="quiz-container">
            <div class="question-box" id="quiz-question">ಪ್ರಶ್ನೆ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</div>
            <div class="options-grid" id="options-box"></div>
        </div>
    </div>

    <!-- Persistent AI Assistant and Chat -->
    <div id="assistant-bar" class="assistant-bar hidden">
        <div class="chat-top">
            <svg class="mini-robot" viewBox="0 0 200 200">
                <rect x="50" y="60" width="100" height="90" rx="20" fill="#4FACFE"/>
                <circle cx="80" cy="95" r="10" fill="#FFF"/><circle cx="120" cy="95" r="10" fill="#FFF"/>
                <path d="M 85 125 Q 100 135 115 125" stroke="#FFF" stroke-width="5" fill="none"/>
            </svg>
            <div class="robot-msg" id="robot-speech">ನನ್ನ ಜೊತೆ ಮಾತನಾಡು ಮಗು! </div>
        </div>
        <div class="chat-input-box">
            <input type="text" id="chat-text" class="chat-input" placeholder="ಏನಾದರೂ ಕೇಳು..." onkeypress="handleKeyPress(event)">
            <button class="btn-mic" onclick="startVoiceRecognition()">🎤</button>
            <button class="btn-send" onclick="sendChat()">ಉತ್ತರಿಸು</button>
        </div>
    </div>

</div>

<script>
    let studentName = "";
    let studentClass = "";
    let userScore = 10;
    let currentCorrectAnswer = "";

    // Pagination Variables
    let currentModule = "";
    let currentPage = 1;
    const itemsPerPage = 12; // 12 cards per page

    // Data Sets
    const kannadaData = [
        { char: 'ಅ', name: 'ಅರಸ' }, { char: 'ಆ', name: 'ಆನೆ' }, { char: 'ಇ', name: 'ಇಲಿ' }, { char: 'ಈ', name: 'ಈಶ' },
        { char: 'ಉ', name: 'ಉಟ' }, { char: 'ಊ', name: 'ಊಟ' }, { char: 'ಋ', name: 'ಋಷಿ' }, { char: 'ಎ', name: 'ಎಲೆ' },
        { char: 'ಏ', name: 'ಏಣಿ' }, { char: 'ಐ', name: 'ಐದನೇ' }, { char: 'ಒ', name: 'ಒಂಟೆ' }, { char: 'ಓ', name: 'ಓಡು' },
        { char: 'ಔ', name: 'ಔಷಧ' }, { char: 'ಅಂ', name: 'ಅಂಬಾರಿ' }, { char: 'ಕ', name: 'ಕಮಲ' }, { char: 'ಖ', name: 'ಖಡ್ಗ' },
        { char: 'ಗ', name: 'ಗಜ' }, { char: 'ಘ', name: 'ಘಂಟೆ' }, { char: 'ಚ', name: 'ಚಮಚ' }, { char: 'ಛ', name: 'ಛತ್ರಿ' },
        { char: 'ಜ', name: 'ಜಲ' }, { char: 'ಝ', name: 'ಝರಿ' }, { char: 'ಟ', name: 'ಟೊಮೆಟೊ' }, { char: 'ಠ', name: 'ಠಸ್ಸೆ' },
        { char: 'ಡ', name: 'ಡಬ್ಬಿ' }, { char: 'ಢ', name: 'ಢಕ್ಕೆ' }, { char: 'ಣ', name: 'ಬಾಣ' }, { char: 'ತ', name: 'ತಬಲ' },
        { char: 'ಥ', name: 'ಥರ್ಮಸ್' }, { char: 'ದ', name: 'ದಸರಾ' }, { char: 'ಧ', name: 'ಧನುಸ್ಸು' }, { char: 'ನ', name: 'ನವಿಲು' },
        { char: 'ಪ', name: 'ಪಟಂಗ' }, { char: 'ಫ', name: 'ಫಲ' }, { char: 'ಬ', name: 'ಬಸ್' }, { char: 'ಭ', name: 'ಭಾರತ' },
        { char: 'ಮ', name: 'ಮರ' }, { char: 'ಯ', name: 'ಯಂತ್ರ' }, { char: 'ರ', name: 'ರಥ' }, { char: 'ಲ', name: 'ಲತಾ' },
        { char: 'ವ', name: 'ವನ' }, { char: 'ಶ', name: 'ಶಂಖ' }, { char: 'ಷ', name: 'ಷಟ್ಕೋನ' }, { char: 'ಸ', name: 'ಸೇಬು' },
        { char: 'ಹ', name: 'ಹೂವು' }, { char: 'ಳ', name: 'ನಳ' }
    ];

    const englishData = [
        { char: 'A', name: 'Apple', desc: 'Apple is a red fruit.' },
        { char: 'B', name: 'Ball', desc: 'Ball is used for playing.' },
        { char: 'C', name: 'Cat', desc: 'Cat says Meow.' },
        { char: 'D', name: 'Dog', desc: 'Dog is a faithful animal.' },
        { char: 'E', name: 'Elephant', desc: 'Elephant is a big animal.' },
        { char: 'F', name: 'Fish', desc: 'Fish lives in water.' },
        { char: 'G', name: 'Grapes', desc: 'Grapes are sweet and sour.' },
        { char: 'H', name: 'Horse', desc: 'Horse runs fast.' },
        { char: 'I', name: 'Ice Cream', desc: 'Ice cream is cold and sweet.' },
        { char: 'J', name: 'Joker', desc: 'Joker makes us laugh.' },
        { char: 'K', name: 'Kite', desc: 'Kite flies in the sky.' },
        { char: 'L', name: 'Lion', desc: 'Lion is king of the jungle.' },
        { char: 'M', name: 'Monkey', desc: 'Monkey loves bananas.' },
        { char: 'N', name: 'Nest', desc: 'Birds live in a nest.' },
        { char: 'O', name: 'Orange', desc: 'Orange is a juicy fruit.' },
        { char: 'P', name: 'Parrot', desc: 'Parrot is a green bird.' },
        { char: 'Q', name: 'Queen', desc: 'Queen wears a crown.' },
        { char: 'R', name: 'Rose', desc: 'Rose is a beautiful flower.' },
        { char: 'S', name: 'Sun', desc: 'Sun gives us light.' },
        { char: 'T', name: 'Tiger', desc: 'Tiger is our national animal.' },
        { char: 'U', name: 'Umbrella', desc: 'Umbrella protects from rain.' },
        { char: 'V', name: 'Van', desc: 'Van takes us to school.' },
        { char: 'W', name: 'Watch', desc: 'Watch shows us time.' },
        { char: 'X', name: 'Xylophone', desc: 'Xylophone is a musical instrument.' },
        { char: 'Y', name: 'Yak', desc: 'Yak lives in cold mountains.' },
        { char: 'Z', name: 'Zebra', desc: 'Zebra has black and white stripes.' }
    ];

    // Auto Play Welcome Audio on Load/Click
    window.onload = () => {
        setTimeout(() => playWelcomeAudio(), 800);
    };

    function playWelcomeAudio() {
        speakText("ನಮಸ್ಕಾರ! ನಿಮ್ಮ ಹೆಸರನ್ನು ಹಾಕಿ ಮತ್ತು ನಿಮ್ಮ ತರಗತಿಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ!");
    }

    function speakText(text) {
        try {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'kn-IN';
                utterance.rate = 0.92;
                window.speechSynthesis.speak(utterance);
            }
        } catch (e) { console.log(e); }
    }

    function setRobotMessage(msg) {
        document.getElementById('robot-speech').innerText = msg;
        speakText(msg);
    }

    function startApp() {
        const nameInput = document.getElementById('student-name').value.trim();
        studentClass = document.getElementById('student-class').value;
        studentName = nameInput ? nameInput : "ಮಗು";

        document.getElementById('display-name').innerText = studentName;
        document.getElementById('display-class').innerText = "ತರಗತಿ: " + studentClass;

        document.getElementById('welcome-screen').classList.add('hidden');
        document.getElementById('app-header').classList.remove('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
        document.getElementById('assistant-bar').classList.remove('hidden');

        setRobotMessage(`ಸ್ವಾಗತ ${studentName}! ಇಂದು ಏನು ಕಲಿಯಲು ಇಷ್ಟಪಡುತ್ತೀಯಾ?`);
    }

    function goDashboard() {
        document.getElementById('learning-screen').classList.add('hidden');
        document.getElementById('exam-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
    }

    function openModule(moduleType) {
        currentModule = moduleType;
        currentPage = 1;

        document.getElementById('dashboard-screen').classList.add('hidden');
        
        if (moduleType === 'exam') {
            document.getElementById('exam-screen').classList.remove('hidden');
            generateQuestion();
            return;
        }

        document.getElementById('learning-screen').classList.remove('hidden');
        renderPaginatedContent();
    }

    // Render cards based on current page and module
    function renderPaginatedContent() {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        document.getElementById('page-number').innerText = `ಪುಟ ${currentPage}`;
        document.getElementById('btn-prev').disabled = (currentPage === 1);

        if (currentModule === 'kannada') {
            document.getElementById('module-title').innerText = "ಕನ್ನಡ ಅಕ್ಷರಗಳು";
            let startIndex = (currentPage - 1) * itemsPerPage;
            let endIndex = startIndex + itemsPerPage;
            let pageData = kannadaData.slice(startIndex, endIndex);

            document.getElementById('btn-next').disabled = (endIndex >= kannadaData.length);

            pageData.forEach(item => {
                createCard(container, item.char, item.name, `${item.char} ಅಂದರೆ ${item.name}`);
            });

        } else if (currentModule === 'english') {
            document.getElementById('module-title').innerText = "English ABC & Words";
            let startIndex = (currentPage - 1) * itemsPerPage;
            let endIndex = startIndex + itemsPerPage;
            let pageData = englishData.slice(startIndex, endIndex);

            document.getElementById('btn-next').disabled = (endIndex >= englishData.length);

            pageData.forEach(item => {
                createCard(container, item.char, item.name, `${item.char} for ${item.name}. ${item.desc}`);
            });

        } else if (currentModule === 'maths') {
            document.getElementById('module-title').innerText = "ಸಂಖ್ಯೆಗಳು (Unlimited)";
            let startIndex = (currentPage - 1) * itemsPerPage + 1;
            let endIndex = startIndex + itemsPerPage - 1;

            // Unlimited Numbers - Next button never gets disabled!
            document.getElementById('btn-next').disabled = false;

            for (let i = startIndex; i <= endIndex; i++) {
                createCard(container, i.toString(), `ಸಂಖ್ಯೆ ${i}`, `ಇದು ಸಂಖ್ಯೆ ${i}`);
            }
        }
    }

    function changePage(direction) {
        currentPage += direction;
        if (currentPage < 1) currentPage = 1;
        renderPaginatedContent();
    }

    function createCard(container, title, sub, speakMsg) {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `<div class="item-char">${title}</div><div class="item-sub">${sub}</div>`;
        card.onclick = () => setRobotMessage(speakMsg);
        container.appendChild(card);
    }

    // Dynamic Question Generator for Quiz
    function generateQuestion() {
        const qTypes = ['math_add', 'math_sub', 'math_mul', 'kn_letter', 'en_letter'];
        const type = qTypes[Math.floor(Math.random() * qTypes.length)];

        let questionText = "";
        let correctAns = "";
        let wrongOpts = [];

        if (type === 'math_add') {
            let n1 = Math.floor(Math.random() * 15) + 1;
            let n2 = Math.floor(Math.random() * 15) + 1;
            questionText = `${n1} + ${n2} = ಎಷ್ಟು?`;
            correctAns = (n1 + n2).toString();
            wrongOpts = [(n1 + n2 + 2).toString(), (n1 + n2 - 1).toString(), (n1 + n2 + 3).toString()];
        } else if (type === 'math_sub') {
            let n1 = Math.floor(Math.random() * 20) + 5;
            let n2 = Math.floor(Math.random() * n1) + 1;
            questionText = `${n1} - ${n2} = ಎಷ್ಟು?`;
            correctAns = (n1 - n2).toString();
            wrongOpts = [(n1 - n2 + 1).toString(), (n1 - n2 + 3).toString(), (n1 - n2 - 2).toString()];
        } else if (type === 'math_mul') {
            let n1 = Math.floor(Math.random() * 10) + 1;
            let n2 = Math.floor(Math.random() * 10) + 1;
            questionText = `${n1} × ${n2} = ಎಷ್ಟು?`;
            correctAns = (n1 * n2).toString();
            wrongOpts = [(n1 * n2 + 2).toString(), (n1 * n2 - 3).toString(), (n1 * n2 + 4).toString()];
        } else if (type === 'kn_letter') {
            let item = kannadaData[Math.floor(Math.random() * kannadaData.length)];
            questionText = `'${item.name}' ಪದದ ಮೊದಲ ಅಕ್ಷರ ಯಾವುದು?`;
            correctAns = item.char;
            wrongOpts = ['ಕ', 'ಮ', 'ರ', 'ನ'].filter(x => x !== correctAns).slice(0, 3);
        } else if (type === 'en_letter') {
            let item = englishData[Math.floor(Math.random() * englishData.length)];
            questionText = `'${item.name}' ಪದದ ಮೊದಲ ಅಕ್ಷರ ಯಾವುದು?`;
            correctAns = item.char;
            wrongOpts = ['A', 'B', 'M', 'S'].filter(x => x !== correctAns).slice(0, 3);
        }

        currentCorrectAnswer = correctAns;
        document.getElementById('quiz-question').innerText = questionText;
        setRobotMessage("ಈ ಪ್ರಶ್ನೆಗೆ ಸರಿಯಾದ ಉತ್ತರ ನೀಡು ಮಗು!");

        let allOptions = [correctAns, ...wrongOpts].sort(() => Math.random() - 0.5);

        const optBox = document.getElementById('options-box');
        optBox.innerHTML = '';
        allOptions.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);
            optBox.appendChild(btn);
        });
    }

    function checkAnswer(selectedOpt) {
        if (selectedOpt === currentCorrectAnswer) {
            userScore += 5;
            document.getElementById('score-val').innerText = userScore;
            setRobotMessage(`ಶಬ್ಬಾಶ್ ${studentName}! ಸರಿಯಾದ ಉತ್ತರ! 🎉`);
            setTimeout(() => generateQuestion(), 1500);
        } else {
            setRobotMessage(`ಅಯ್ಯೋ ತಪ್ಪಾಯಿತು! ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸು! ❌`);
        }
    }

    // Dynamic AI Smart Voice & Text Assistant
    function handleKeyPress(e) { if (e.key === 'Enter') sendChat(); }

    function sendChat() {
        const input = document.getElementById('chat-text');
        const text = input.value.trim().toLowerCase();
        if (!text) return;

        input.value = '';
        let reply = evaluateChildMessage(text);
        setRobotMessage(reply);
    }

    function evaluateChildMessage(text) {
        // Dynamic Maths Evaluator
        if (text.includes('+') || text.includes('-') || text.includes('*') || text.includes('/') || text.includes('ಪ್ಲಸ್') || text.includes('ಮೈನಸ್')) {
            try {
                let expr = text.replace(/ಪ್ಲಸ್/g, '+').replace(/ಮೈನಸ್/g, '-').replace(/ಗುಣಿಸು/g, '*').replace(/ಭಾಗಿಸು/g, '/').replace(/ಎಷ್ಟು/g, '').replace(/=/g, '');
                let sanitized = expr.replace(/[^0-9+\-*/.]/g, '');
                if (sanitized) {
                    let result = eval(sanitized);
                    return `ಇದರ ಉತ್ತರ ${result} ಮಗು!`;
                }
            } catch(e) {}
        }

        // Varied Intelligent Responses
        if (text.includes("ಹೆಸರು") || text.includes("ಯಾರು")) {
            return `ನನ್ನ ಹೆಸರು ಚಿನ್ನು ರೋಬೋಟ್! ನಿನ್ನ ಜೊತೆ ಕಲಿಯಲು ಬಂದಿದ್ದೇನೆ ${studentName}!`;
        } else if (text.includes("ಹಾಯ್") || text.includes("ಹಲೊ") || text.includes("ನಮಸ್ಕಾರ")) {
            return `ಹಾಯ್ ${studentName}! ಇಂದು ಏನು ಕಲಿಯೋಣ? ಕನ್ನಡ, ಇಂಗ್ಲಿಷ್ ಅಥವಾ ಲೆಕ್ಕ?`;
        } else if (text.includes("ಇಷ್ಟ") || text.includes("ಖುಷಿ")) {
            return "ನನಗೆ ಮಕ್ಕಳ ಜೊತೆ ಮಾತನಾಡುವುದು ಮತ್ತು ಪಾಠ ಹೇಳಿಕೊಡುವುದು ತುಂಬಾ ಇಷ್ಟ!";
        } else if (text.includes("ಬರುವುದಿಲ್ಲ") || text.includes("ಗೊತ್ತಿಲ್ಲ") || text.includes("ಹೇಳಿಕೊಡು")) {
            return "ಚಿಂತೆ ಮಾಡಬೇಡ ಮಗು! ನಿನಗೆ ಯಾವುದು ಬರುವುದಿಲ್ಲವೋ ಅದನ್ನು ನನಗೆ ಕೇಳು, ನಾನು ಪ್ರೀತಿಯಿಂದ ಹೇಳಿಕೊಡುತ್ತೇನೆ!";
        } else if (text.includes("ತಿಂಡಿ") || text.includes("ಊಟ")) {
            return "ನನ್ನ ಊಟ ವಿದ್ಯುತ್ ಚಾರ್ಜಿಂಗ್! ನೀನು ಸರಿಯಾಗಿ ಊಟ ಮಾಡಿ ಅಭ್ಯಾಸ ಮಾಡು!";
        } else if (text.includes("ಕಥೆ") || text.includes("ಕತೆ")) {
            const stories = [
                "ಒಂದಾನೊಂದು ಕಾಲದಲ್ಲಿ ಒಂದು ಜಾಣ ನರಿ ಇತ್ತು, ಅದು ಉಪಾಯದಿಂದ ಕಾಗೆಯಿಂದ ವಡೆಯನ್ನು ಪಡೆದುಕೊಂಡಿತು!",
                "ಒಂದು ಕಾಡಿನಲ್ಲಿ ಆಮೆ ಮತ್ತು ಮೊಲ ಓಟದ ಸ್ಪರ್ಧೆ ಮಾಡಿದವು. ಆಮೆ ಸತತ ಪ್ರಯತ್ನದಿಂದ ಗೆದ್ದಿತು!",
                "ಒಂದು ಸಿಂಹ ಮತ್ತು ಇಲಿ ಸ್ನೇಹಿತರಾಗಿದ್ದವು. ಇಲಿ ಸಿಂಹವನ್ನು ಬಲೆಯಿಂದ ರಕ್ಷಿಸಿತು!"
            ];
            return stories[Math.floor(Math.random() * stories.length)];
        } else {
            const randomReplies = [
                `ತುಂಬಾ ಒಳ್ಳೆಯ ಪ್ರಶ್ನೆ ${studentName}! ಮುಂದುವರಿಯೋಣವೇ?`,
                "ನನಗೆ ನಿನ್ನ ಜೊತೆ ಮಾತನಾಡಲು ತುಂಬಾ ಖುಷಿಯಾಗುತ್ತಿದೆ!",
                "ನಿನ್ನ ಅಭ್ಯಾಸ ತುಂಬಾ ಚೆನ್ನಾಗಿ ನಡೆಯುತ್ತಿದೆ, ಹೀಗೆ ಕಲಿಕೆಯನ್ನು ಮುಂದುವರಿಸು!"
            ];
            return randomReplies[Math.floor(Math.random() * randomReplies.length)];
        }
    }

    // Voice Recognition Implementation
    function startVoiceRecognition() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert("ನಿಮ್ಮ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಮೈಕ್ ಸಪೋರ್ಟ್ ಇಲ್ಲ.");
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'kn-IN';

        setRobotMessage("ನಾನು ಕೇಳುತ್ತಿದ್ದೇನೆ, ಮಾತನಾಡು ಮಗು...");
        recognition.start();

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById('chat-text').value = transcript;
            sendChat();
        };

        recognition.onerror = function() {
            setRobotMessage("ನಿನ್ನ ಧ್ವನಿ ಸರಿಯಾಗಿ ಕೇಳಿಸಲಿಲ್ಲ, ಮತ್ತೊಮ್ಮೆ ಮೈಕ್ ಒತ್ತಿ ಮಾತನಾಡು!");
        };
    }
</script>
