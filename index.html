<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ಸ್ಮಾರ್ಟ್ ಅಟೆಂಡೆನ್ಸ್ ಮತ್ತು ಪೇರೆಂಟ್ ಅಲರ್ಟ್ ಆಪ್</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #e8f5e9; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            color: #333; 
        }
        .container { 
            width: 100%; 
            height: 100%; 
            background: white; 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            overflow-y: auto;
        }
        h2 { text-align: center; color: #2e7d32; margin-top: 10px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #444; font-size: 16px; }
        input, select, button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 8px; 
            border-radius: 8px; 
            border: 1px solid #ccc; 
            font-size: 16px; 
        }
        button { background: #2e7d32; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
        button:hover { background: #1b5e20; }
        .section { display: none; flex: 1; flex-direction: column; }
        .active { display: flex; }
        .card { background: #f1f8e9; padding: 15px; border-radius: 8px; margin-top: 15px; border-left: 5px solid #4caf50; }
        .success-msg { color: #2e7d32; font-weight: bold; margin-top: 10px; text-align: center; }
        video { width: 100%; max-height: 200px; background: #000; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. ಟೀಚರ್ ಲಾಗಿನ್ ಪೇಜ್ -->
    <div id="loginSection" class="section active">
        <h2>🏫 ಶಾಲಾ ಅಟೆಂಡೆನ್ಸ್ ಲಾಗಿನ್</h2>
        <p style="text-align: center; color: #666;">ಶಿಕ್ಷಕರು ಅಥವಾ ಪ್ರಿನ್ಸಿಪಾಲ್ ಲಾಗಿನ್ ಆಗಿ</p>
        
        <label>ಶಿಕ್ಷಕರ ಹೆಸರು:</label>
        <input type="text" id="teacherName" placeholder="ನಿಮ್ಮ ಹೆಸರು ಹಾಕಿ">

        <label>ಮೊಬೈಲ್ ನಂಬರ್:</label>
        <input type="tel" id="teacherPhone" placeholder="10 ಅಂಕಿಯ ನಂಬರ್">

        <button onclick="teacherLogin()">ಲಾಗಿನ್ ಮಾಡಿ</button>
    </div>

    <!-- 2. ತರಗತಿ ಮತ್ತು ವಿದ್ಯಾರ್ಥಿ ಆಯ್ಕೆ ಪೇಜ್ -->
    <div id="dashboardSection" class="section">
        <h2>📋 ವಿದ್ಯಾರ್ಥಿ ಹಾಜರಾತಿ (Attendance)</h2>
        <p id="welcomeTeacher" style="font-weight: bold; color: #2e7d32;"></p>

        <label>ತರಗತಿ ಆಯ್ಕೆಮಾಡಿ (Class):</label>
        <select id="classSelect">
            <option value="1">1ನೇ ತರಗತಿ</option>
            <option value="2">2ನೇ ತರಗತಿ</option>
            <option value="3">3ನೇ ತರಗತಿ</option>
            <option value="4">4ನೇ ತರಗತಿ</option>
            <option value="5">5ನೇ ತರಗತಿ</option>
            <option value="6">6ನೇ ತರಗತಿ</option>
            <option value="7">7ನೇ ತರಗತಿ</option>
            <option value="8">8ನೇ ತರಗತಿ</option>
            <option value="9">9ನೇ ತರಗತಿ</option>
            <option value="10">10ನೇ ತರಗತಿ</option>
        </select>

        <label>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು ಮತ್ತು ID:</label>
        <select id="studentSelect">
            <option value="Ramesh (ID: ST101) - ಪೋಷಕರು: 9876543210">ರಮೇಶ್ (ID: ST101)</option>
            <option value="Priya (ID: ST102) - ಪೋಷಕರು: 9123456789">ಪ್ರಿಯಾ (ID: ST102)</option>
            <option value="Rahul (ID: ST103) - ಪೋಷಕರು: 9988776655">ರಾಹುಲ್ (ID: ST103)</option>
        </select>

        <label>ಮುಖದ ಗುರುತು (Face Verification / Selfie):</label>
        <button onclick="startCamera()" style="background: #0288d1;">📸 ಮುಖ ಸ್ಕ್ಯಾನ್ ಮಾಡಿ (Scan Face)</button>
        <video id="video" autoplay playsinline style="display:none;"></video>

        <button onclick="markAttendance()" style="background: #e65100; margin-top: 20px;">✅ ಹಾಜರಾತಿ ನಮೂದಿಸಿ ಮತ್ತು ಪೋಷಕರಿಗೆ ಕಳುಹಿಸಿ</button>
        
        <div id="statusBox"></div>
    </div>
</div>

<script>
    let loggedInTeacher = '';

    function teacherLogin() {
        const name = document.getElementById('teacherName').value.trim();
        const phone = document.getElementById('teacherPhone').value.trim();

        if(!name || phone.length < 10) {
            alert("ದಯವಿಟ್ಟು ಸರಿಯಾದ ಹೆಸರು ಮತ್ತು ಮೊಬೈಲ್ ನಂಬರ್ ಹಾಕಿ!");
            return;
        }

        loggedInTeacher = name;
        document.getElementById('welcomeTeacher').innerText = "ಸ್ವಾಗತ, ಶಿಕ್ಷಕರು: " + name;

        document.getElementById('loginSection').classList.remove('active');
        document.getElementById('dashboardSection').classList.add('active');
    }

    function startCamera() {
        const video = document.getElementById('video');
        video.style.display = 'block';
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                alert("ಕ್ಯಾಮರಾ ಓಪನ್ ಮಾಡಲು ಅನುಮತಿ ಸಿಕ್ಕಿಲ್ಲ: " + err);
            });
    }

    function markAttendance() {
        const selectedClass = document.getElementById('classSelect').value;
        const studentInfo = document.getElementById('studentSelect').value;
        
        const statusBox = document.getElementById('statusBox');
        statusBox.innerHTML = `
            <div class="card">
                <p class="success-msg">✅ ಹಾಜರಾತಿ ಯಶಸ್ವಿಯಾಗಿ ದಾಖಲಾಗಿದೆ!</p>
                <p><b>ತರಗತಿ:</b> ${selectedClass}ನೇ ತರಗತಿ</p>
                <p><b>ವಿದ್ಯಾರ್ಥಿ:</b> ${studentInfo}</p>
                <p><b>ಸ್ಥಿತಿ:</b> ಶಾಲೆಗೆ ಹಾಜರಾಗಿದ್ದಾರೆ (Present)</p>
                <p style="color: #d32f2f;">📩 ಪೋಷಕರ ಮೊಬೈಲ್‌ಗೆ ಆಟೋಮ್ಯಾಟಿಕ್ SMS / WhatsApp ನೋಟಿಫಿಕೇಶನ್ ಕಳುಹಿಸಲಾಗಿದೆ!</p>
            </div>
        `;

        // ಧ್ವನಿ ಅಥವಾ ಅಲರ್ಟ್ ಮೂಲಕ ಖಚಿತಪಡಿಸುವುದು
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance("ಹಾಜರಾತಿ ದಾಖಲಾಗಿದೆ. ಪೋಷಕರಿಗೆ ಮೆಸೇಜ್ ಕಳುಹಿಸಲಾಗಿದೆ.");
            utterance.lang = 'kn-IN';
            window.speechSynthesis.speak(utterance);
        }
    }
</script>

</body>
</html>
