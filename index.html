<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ನಮ್ಮದೇಶಿ ಶಾಲಾ ಹಾಜರಾತಿ ಆಪ್</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        .btn { width: 100%; padding: 12px; margin: 8px 0; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .btn:hover { background-color: #2980b9; }
        .btn-admin { background-color: #e74c3c; }
        .btn-admin:hover { background-color: #c0392b; }
        .btn-success { background-color: #27ae60; }
        .btn-success:hover { background-color: #219653; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .hidden { display: none; }
        .back-btn { background-color: #7f8c8d; margin-top: 15px; }
        video, canvas { width: 100%; max-height: 250px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body onload="initApp()">

<div class="container" id="app">
    <!-- ಭಾಷಾ ಸೆಟ್ಟಿಂಗ್ಸ್ & ವಾಯ್ಸ್ ಟಾಗಲ್ -->
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <button onclick="toggleVoice()" id="voiceToggleBtn" style="padding: 5px 10px; background: #e67e22; color: white; border: none; border-radius: 4px; cursor: pointer;">🔊 ಧ್ವನಿ ಸಹಾಯ: ಚಾಲು</button>
        <select id="langSelect" onchange="changeLanguage()" style="width: auto; padding: 5px;">
            <option value="kn">ಕನ್ನಡ</option>
            <option value="en">English</option>
            <option value="hi">हिंदी</option>
        </select>
    </div>

    <!-- 1. ಲಾಗಿನ್ ಪೇಜ್ -->
    <div id="loginPage">
        <h2 id="t_loginTitle">ನಮ್ಮದೇಶಿ ಲಾಗಿನ್</h2>
        <input type="text" id="loginName" placeholder="ನಿಮ್ಮ ಹೆಸರು (Name)">
        <input type="tel" id="loginMobile" placeholder="ಮೊಬೈಲ್ ನಂಬರ್ (Mobile Number)">
        <button class="btn" onclick="openHome()" id="b_loginBtn">ಲಾಗಿನ್ ಮಾಡಿ</button>
    </div>

    <!-- 2. ಮುಖಪುಟ (Home Page) -->
    <div id="homePage" class="hidden">
        <h2 id="t_homeTitle">ಮುಖಪುಟ</h2>
        <button class="btn" onclick="showPage('teacherRegPage')" id="b_teacherReg">ಶಿಕ್ಷಕರ ನೋಂದಣಿ</button>
        <button class="btn" onclick="showPage('studentRegPage')" id="b_studentReg">ಮಕ್ಕಳ ನೋಂದಣಿ</button>
        <button class="btn" onclick="showPage('attendancePage')" id="b_attendance">ಹಾಜರಾತಿ ಹಾಕಿ</button>
        <button class="btn" onclick="showPage('parentReasonPage')" id="b_parentReason">ಪೋಷಕರ ರಜೆ/ಕಾರಣ ವಿಭಾಗ</button>
        <button class="btn" onclick="showPage('historyPage')" id="b_history">ಹಾಜರಾತಿ ಇತಿಹಾಸ (10 ತಿಂಗಳು)</button>
        <button class="btn btn-admin" onclick="checkAdmin()" id="b_adminPanel">ಐಡಿ ಪ್ಯಾನೆಲ್ (Admin)</button>
    </div>

    <!-- 3. ಶಿಕ್ಷಕರ ನೋಂದಣಿ ಪುಟ -->
    <div id="teacherRegPage" class="hidden">
        <h2 id="t_teacherRegTitle">ಶಿಕ್ಷಕರ ನೋಂದಣಿ</h2>
        <input type="text" id="tName" placeholder="ಪೂರ್ಣ ಹೆಸರು">
        <input type="tel" id="tMobile" placeholder="ಮೊಬೈಲ್ ನಂಬರ್">
        <input type="number" id="tAge" placeholder="ವಯಸ್ಸು">
        <input type="text" id="tDistrict" placeholder="ಜಿಲ್ಲೆ">
        <input type="text" id="tTaluk" placeholder="ತಾಲೂಕು">
        <input type="text" id="tVillage" placeholder="ಊರು">
        <input type="text" id="tSchool" placeholder="ಶಾಲೆಯ ಹೆಸರು">
        <select id="tSchoolType">
            <option value="ನರ್ಸರಿ">ನರ್ಸರಿ / KG / UKG</option>
            <option value="ಹೈಸ್ಕೂಲ್">ಹೈಸ್ಕೂಲ್ (1 ರಿಂದ 10)</option>
        </select>
        <select id="tSubject">
            <option value="ಕನ್ನಡ">ಕನ್ನಡ</option>
            <option value="ಇಂಗ್ಲಿಷ್">ಇಂಗ್ಲಿಷ್</option>
            <option value="ಹಿಂದಿ">ಹಿಂದಿ</option>
            <option value="ಗಣಿತ">ಗಣಿತ</option>
            <option value="ಸಮಾಜ ವಿಜ್ಞಾನ">ಸಮಾಜ ವಿಜ್ಞಾನ</option>
        </select>
        
        <!-- ನೇರ ಕ್ಯಾಮೆರಾ ಫೋಟೋ ಆಪ್ಷನ್ -->
        <p style="margin: 5px 0; font-weight: bold;">ಶಾಲೆಯ ಐಡಿ ಕಾರ್ಡ್ ಅಥವಾ ಮುಖದ ಫೋಟೋ:</p>
        <video id="tVideo" autoplay playsinline style="display:none;"></video>
        <canvas id="tCanvas" style="display:none;"></canvas>
        <button type="button" class="btn btn-success" onclick="startCamera('tVideo', 'tCanvas', 'tPhotoData')">ಕ್ಯಾಮೆರಾ ತೆರೆಯಿರಿ</button>
        <button type="button" class="btn hidden" id="tCaptureBtn" onclick="capturePhoto('tVideo', 'tCanvas', 'tPhotoData', 'tPreview')">ಫೋಟೋ ಸೆರೆಹಿಡಿಯಿರಿ</button>
        <input type="hidden" id="tPhotoData">
        <div id="tPreview" style="margin-top:10px;"></div>

        <button class="btn" onclick="registerTeacher()">ನೋಂದಾಯಿಸಿ & ID ಪಡೆಯಿರಿ</button>
        <button class="btn back-btn" onclick="showPage('homePage')">ಹಿಂದಕ್ಕೆ</button>
    </div>

    <!-- 4. ಮಕ್ಕಳ ನೋಂದಣಿ ಪುಟ -->
    <div id="studentRegPage" class="hidden">
        <h2 id="t_studentRegTitle">ಮಕ್ಕಳ ನೋಂದಣಿ</h2>
        <input type="number" id="sTeacherId" placeholder="ಶಿಕ್ಷಕರ 4-ಅಂಕಿಯ ಡಿಜಿಟಲ್ ಐಡಿ ಹಾಕಿ">
        <input type="text" id="sName" placeholder="ಮಗುವಿನ ಹೆಸರು">
        <input type="text" id="sParentName" placeholder="ತಂದೆ/ತಾಯಿಯ ಹೆಸರು">
        <input type="text" id="sVillage" placeholder="ಊರು">
        <input type="text" id="sClass" placeholder="ತರಗತಿ">
        <input type="tel" id="sParentMobile" placeholder="ಪೋಷಕರ ಮೊಬೈಲ್ ನಂಬರ್">
        
        <!-- ಮಕ್ಕಳಿಗೂ ನೇರ ಕ್ಯಾಮೆರಾ ಫೋಟೋ/ಐಡಿ ಕಾರ್ಡ್ ಅಪ್ಲೋಡ್ -->
        <p style="margin: 5px 0; font-weight: bold;">ಮಗುವಿನ ಫೋಟೋ ಅಥವಾ ಶಾಲಾ ಐಡಿ ಕಾರ್ಡ್ ಫೋಟೋ:</p>
        <video id="sVideo" autoplay playsinline style="display:none;"></video>
        <canvas id="sCanvas" style="display:none;"></canvas>
        <button type="button" class="btn btn-success" onclick="startCamera('sVideo', 'sCanvas', 'sPhotoData')">ಕ್ಯಾಮೆರಾ ತೆರೆಯಿರಿ</button>
        <button type="button" class="btn hidden" id="sCaptureBtn" onclick="capturePhoto('sVideo', 'sCanvas', 'sPhotoData', 'sPreview')">ಫೋಟೋ ಸೆರೆಹಿಡಿಯಿರಿ</button>
        <input type="hidden" id="sPhotoData">
        <div id="sPreview" style="margin-top:10px;"></div>

        <button class="btn" onclick="registerStudent()">ಮಗುವನ್ನು ಸೇರಿಸಿ & ID ಪಡೆಯಿರಿ</button>
        <button class="btn back-btn" onclick="showPage('homePage')">ಹಿಂದಕ್ಕೆ</button>
    </div>

    <!-- 5. ಹಾಜರಾತಿ ಪುಟ -->
    <div id="attendancePage" class="hidden">
        <h2>ಹಾಜರಾತಿ ದಾಖಲು</h2>
        <input type="number" id="attTeacherId" placeholder="ನಿಮ್ಮ 4-ಅಂಕಿಯ ಟೀಚರ್ ಐಡಿ ಹಾಕಿ">
        <input type="number" id="attStudentId" placeholder="ಮಗುವಿನ 4-ಅಂಕಿಯ ಐಡಿ ಹಾಕಿ">
        <button class="btn btn-success" onclick="verifyAndMarkAttendance()">ಓಕೆ (Verify & Mark)</button>
        <button class="btn back-btn" onclick="showPage('homePage')">ಹಿಂದಕ್ಕೆ</button>
    </div>

    <!-- 6. ಪೋಷಕರ ರಜೆ ಕಾರಣ ಪುಟ -->
    <div id="parentReasonPage" class="hidden">
        <h2>ಶಾಲೆಗೆ ಬಾರದ ಕಾರಣ ತಿಳಿಸಿ</h2>
        <input type="number" id="pStudentId" placeholder="ಮಗುವಿನ 4-ಅಂಕಿಯ ಐಡಿ ಹಾಕಿ">
        <input type="text" id="pReason" placeholder="ಯಾಕೆ ಶಾಲೆಗೆ ಬರುತ್ತಿಲ್ಲ ಕಾರಣ ಬರೆಯಿರಿ">
        <button class="btn" onclick="sendParentReason()">ಕಾರಣ ಕಳುಹಿಸಿ</button>
        <button class="btn back-btn" onclick="showPage('homePage')">ಹಿಂದಕ್ಕೆ</button>
    </div>

    <!-- 7. ಹಾಜರಾತಿ ಇತಿಹಾಸ ಮತ್ತು PDF ಡೌನ್‌ಲೋಡ್ (10 ತಿಂಗಳು) -->
    <div id="historyPage" class="hidden">
        <h2>ಹಾಜರಾತಿ ಇತಿಹಾಸ (10 ತಿಂಗಳು)</h2>
        <input type="number" id="histStudentId" placeholder="ಮಗುವಿನ 4-ಅಂಕಿಯ ಐಡಿ ಹಾಕಿ">
        <button class="btn" onclick="loadStudentHistory()">ವಿವರಗಳನ್ನು ನೋಡಿ</button>
        <div id="historyContent" style="margin-top: 15px; max-height: 250px; overflow-y: auto; background: #fff; border: 1px solid #ccc; padding: 10px;"></div>
        <button class="btn btn-success hidden" id="downloadPdfBtn" onclick="downloadPDFReport()">PDF ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ</button>
        <button class="btn back-btn" onclick="showPage('homePage')">ಹಿಂದಕ್ಕೆ</button>
    </div>

    <!-- 8. ಅಡ್ಮಿನ್ ಐಡಿ ಪ್ಯಾನೆಲ್ -->
    <div id="adminPanelPage" class="hidden">
        <h2 style="color: red;">ಐಡಿ ಪ್ಯಾನೆಲ್ (Admin Panel)</h2>
        <div id="adminDataContent" style="background: #eee; padding: 10px; border-radius: 5px; max-height: 300px; overflow-y: auto;"></div>
        <button class="btn back-btn" onclick="showPage('homePage')">ಹಿಂದಕ್ಕೆ</button>
    </div>
</div>

<script>
    let teachers = JSON.parse(localStorage.getItem('teachers')) || [];
    let students = JSON.parse(localStorage.getItem('students')) || [];
    let attendanceRecords = JSON.parse(localStorage.getItem('attendanceRecords')) || [];
    let voiceEnabled = true;

    // ಧ್ವನಿ ಸಂದೇಶ (Speech Synthesis) ಕಾರ್ಯ
    function speakText(text) {
        if (!voiceEnabled || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel(); // ಹಿಂದಿನ ಧ್ವನಿ ನಿಲ್ಲಿಸು
        let lang = document.getElementById('langSelect').value;
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang === 'kn' ? 'kn-IN' : (lang === 'hi' ? 'hi-IN' : 'en-US');
        window.speechSynthesis.speak(utterance);
    }

    function toggleVoice() {
        voiceEnabled = !voiceEnabled;
        let btn = document.getElementById('voiceToggleBtn');
        btn.innerText = voiceEnabled ? "🔊 ಧ್ವನಿ ಸಹಾಯ: ಚಾಲು" : "🔇 ಧ್ವನಿ ಸಹಾಯ: ಬಂದ್";
        speakText(voiceEnabled ? "ಧ್ವನಿ ಸಹಾಯ ಚಾಲು ಮಾಡಲಾಗಿದೆ" : "ಧ್ವನಿ ಸಹಾಯ ಬಂದ್ ಮಾಡಲಾಗಿದೆ");
    }

    function initApp() {
        cleanupOldRecords(); // 10 ತಿಂಗಳ ಹಳೆಯ ಡೇಟಾ ಸ್ವಯಂಚಾಲಿತವಾಗಿ ಅಳಿಸುವುದು
        speakText("ನಮ್ಮದೇಶಿ ಶಾಲಾ ಹಾಜರಾತಿ ಆಪ್‌ಗೆ ಸ್ವಾಗತ. ದಯವಿಟ್ಟು ಲಾಗಿನ್ ಮಾಡಿ.");
    }

    function showPage(pageId) {
        let pages = ['loginPage', 'homePage', 'teacherRegPage', 'studentRegPage', 'attendancePage', 'parentReasonPage', 'historyPage', 'adminPanelPage'];
        pages.forEach(p => document.getElementById(p).classList.add('hidden'));
        document.getElementById(pageId).classList.remove('hidden');

        // ಪುಟ ಬದಲಾದಾಗ ಧ್ವನಿ ಮುಖಾಂತರ ಮಾರ್ಗದರ್ಶನ
        if(pageId === 'homePage') speakText("ಮುಖಪುಟ. ನಿಮಗೆ ಬೇಕಾದ ಆಯ್ಕೆಯನ್ನು ಆರಿಸಿ.");
        else if(pageId === 'teacherRegPage') speakText("ಶಿಕ್ಷಕರ ನೋಂದಣಿ ಪುಟ. ನಿಮ್ಮ ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ ಮತ್ತು ಕ್ಯಾಮೆರಾ ಮೂಲಕ ಫೋಟೋ ಅಥವಾ ಐಡಿ ಕಾರ್ಡ್ ಸೆರೆಹಿಡಿಯಿರಿ.");
        else if(pageId === 'studentRegPage') speakText("ಮಕ್ಕಳ ನೋಂದಣಿ ಪುಟ. ಮಗುವಿನ ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ.");
        else if(pageId === 'attendancePage') speakText("ಹಾಜರಾತಿ ದಾಖಲು ಪುಟ. ನಿಮ್ಮ ಐಡಿ ಮತ್ತು ಮಗುವಿನ ಐಡಿ ಹಾಕಿ ಓಕೆ ಮಾಡಿ.");
    }

    function openHome() {
        let name = document.getElementById('loginName').value;
        let mobile = document.getElementById('loginMobile').value;
        if(name && mobile) {
            speakText("ಲಾಗಿನ್ ಯಶಸ್ವಿಯಾಗಿದೆ");
            showPage('homePage');
        } else {
            speakText("ದಯವಿಟ್ಟು ಹೆಸರು ಮತ್ತು ಮೊಬೈಲ್ ನಂಬರ್ ಹಾಕಿ");
            alert('ದಯವಿಟ್ಟು ಹೆಸರು ಮತ್ತು ಮೊಬೈಲ್ ನಂಬರ್ ಹಾಕಿ!');
        }
    }

    function generateId() {
        return Math.floor(1000 + Math.random() * 9000);
    }

    // ಕ್ಯಾಮೆರಾ ಆನ್ ಮಾಡುವ ಫಂಕ್ಷನ್
    let currentStream = null;
    function startCamera(videoId, canvasId, inputId) {
        let video = document.getElementById(videoId);
        let captureBtnId = videoId === 'tVideo' ? 'tCaptureBtn' : 'sCaptureBtn';
        document.getElementById(captureBtnId).classList.remove('hidden');
        video.style.display = 'block';

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(stream) {
                currentStream = stream;
                video.srcObject = stream;
                speakText("ಕ್ಯಾಮೆರಾ ತೆರೆಯಲಾಗಿದೆ. ಶಾಲಾ ಐಡಿ ಕಾರ್ಡ್ ಅಥವಾ ಮುಖವನ್ನು ತೋರಿಸಿ ಫೋಟೋ ಕ್ಲಿಕ್ ಮಾಡಿ.");
            }).catch(function(err) {
                alert("ಕ್ಯಾಮೆರಾ ಪ್ರವೇಶ ಸಿಗುತ್ತಿಲ್ಲ: " + err);
            });
        }
    }

    function capturePhoto(videoId, canvasId, inputId, previewId) {
        let video = document.getElementById(videoId);
        let canvas = document.getElementById(canvasId);
        canvas.width = video.videoWidth || 300;
        canvas.height = video.videoHeight || 200;
        let ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        let dataUrl = canvas.toDataURL('image/png');
        document.getElementById(inputId).value = dataUrl;

        // ಕ್ಯಾಮೆರಾ ಸ್ಟಾಪ್ ಮಾಡುವುದು
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        video.style.display = 'none';
        document.getElementById(videoId === 'tVideo' ? 'tCaptureBtn' : 'sCaptureBtn').classList.add('hidden');
        
        document.getElementById(previewId).innerHTML = `<p style="color:green; font-weight:bold;">✓ ಫೋಟೋ / ಐಡಿ ಕಾರ್ಡ್ ಯಶಸ್ವಿಯಾಗಿ ಸೆರೆಹಿಡಿಯಲಾಗಿದೆ!</p>`;
        speakText("ಫೋಟೋ ಯಶಸ್ವಿಯಾಗಿ ಸೆರೆಹಿಡಿಯಲಾಗಿದೆ.");
    }

    function registerTeacher() {
        let name = document.getElementById('tName').value;
        let mobile = document.getElementById('tMobile').value;
        if(!name || !mobile) { 
            speakText("ಎಲ್ಲಾ ಮಾಹಿತಿ ಭರ್ತಿ ಮಾಡಿ");
            alert('ಎಲ್ಲಾ ಮಾಹಿತಿ ಭರ್ತಿ ಮಾಡಿ'); 
            return; 
        }

        let id = generateId();
        let teacherData = { id: id, name: name, mobile: mobile, school: document.getElementById('tSchool').value };
        teachers.push(teacherData);
        localStorage.setItem('teachers', JSON.stringify(teachers));

        speakText("ಶಿಕ್ಷಕರ ನೋಂದಣಿ ಯಶಸ್ವಿಯಾಗಿದೆ. ನಿಮ್ಮ 4 ಅಂಕಿಯ ಐಡಿ ನಂಬರ್: " + id);
        alert('ನೋಂದಣಿ ಯಶಸ್ವಿಯಾಗಿದೆ! ನಿಮ್ಮ 4-ಅಂಕಿಯ ಡಿಜಿಟಲ್ ಐಡಿ: ' + id);
        showPage('homePage');
    }

    function registerStudent() {
        let tid = document.getElementById('sTeacherId').value;
        let sname = document.getElementById('sName').value;
        let pmobile = document.getElementById('sParentMobile').value;
        if(!tid || !sname || !pmobile) { 
            speakText("ಮಾಹಿತಿ ಅಪೂರ್ಣವಾಗಿದೆ");
            alert('ಮಾಹಿತಿ ಅಪೂರ್ಣವಾಗಿದೆ'); 
            return; 
        }

        let tCheck = teachers.find(t => t.id == tid);
        if(!tCheck) { 
            speakText("ತಪ್ಪಾದ ಟೀಚರ್ ಐಡಿ");
            alert('ತಪ್ಪಾದ ಟೀಚರ್ ಐಡಿ!'); 
            return; 
        }

        let id = generateId();
        let studentData = { id: id, teacherId: tid, name: sname, parentMobile: pmobile, village: document.getElementById('sVillage').value, class: document.getElementById('sClass').value };
        students.push(studentData);
        localStorage.setItem('students', JSON.stringify(students));

        speakText("ಮಗುವಿನ ನೋಂದಣಿ ಯಶಸ್ವಿಯಾಗಿದೆ. ಮಗುವಿನ ಐಡಿ ನಂಬರ್: " + id);
        alert('ಮಗುವಿನ ನೋಂದಣಿ ಯಶಸ್ವಿಯಾಗಿದೆ! ಮಗುವಿನ 4-ಅಂಕಿಯ ಡಿಜಿಟಲ್ ಐಡಿ: ' + id);
        showPage('homePage');
    }

    function verifyAndMarkAttendance() {
        let tid = document.getElementById('attTeacherId').value;
        let sid = document.getElementById('attStudentId').value;

        let student = students.find(s => s.id == sid && s.teacherId == tid);
        if(!student) {
            speakText("ತಪ್ಪಾದ ಐಡಿ. ದಯವಿಟ್ಟು ಸರಿಯಾದ ಐಡಿ ಹಾಕಿ.");
            alert('ತಪ್ಪಾದ ಐಡಿ! ಸರಿಯಾದ 4-ಅಂಕಿಯ ಐಡಿ ಹಾಕಿ.');
            return;
        }

        // ಹಾಜರಾತಿ ದಾಖಲು ಮತ್ತು ದಿನಾಂಕ ಸೇರಿಸುವುದು
        let now = new Date();
        let record = {
            studentId: student.id,
            studentName: student.name,
            parentMobile: student.parentMobile,
            village: student.village,
            date: now.toISOString(),
            dateStr: now.toLocaleDateString() + ' ' + now.toLocaleTimeString()
        };
        attendanceRecords.push(record);
        localStorage.setItem('attendanceRecords', JSON.stringify(attendanceRecords));

        // WhatsApp ಮೆಸೇಜ್ ಕಳುಹಿಸುವುದು
        let msg = `ನಮಸ್ಕಾರ, ನಿಮ್ಮ ಮಗು ${student.name} ಶಾಲೆಗೆ ತಲುಪಿದೆ. ಹಾಜರಾತಿ ದಾಖಲಾಗಿದೆ. ದಿನಾಂಕ: ${record.dateStr}. ನಮ್ಮದೇಶಿ ಆಪ್.`;
        let whatsappUrl = `https://api.whatsapp.com/send?phone=91${student.parentMobile}&text=${encodeURIComponent(msg)}`;
        
        speakText(`ಹಾಜರಾತಿ ಸಫಲವಾಗಿದೆ. ಪೋಷಕರಿಗೆ ವಾಟ್ಸಾಪ್ ಸಂದೇಶ ಕಳುಹಿಸಲಾಗುತ್ತಿದೆ.`);
        alert('ಹಾಜರಾತಿ ಸಫಲವಾಗಿದೆ! WhatsApp ಮೆಸೇಜ್ ಕಳುಹಿಸಲಾಗುತ್ತಿದೆ...');
        window.open(whatsappUrl, '_blank');
        showPage('homePage');
    }

    function sendParentReason() {
        let sid = document.getElementById('pStudentId').value;
        let reason = document.getElementById('pReason').value;
        let student = students.find(s => s.id == sid);

        if(!student || !reason) { 
            speakText("ಸರಿಯಾದ ಐಡಿ ಮತ್ತು ಕಾರಣ ನೀಡಿ");
            alert('ಸರಿಯಾದ ಐಡಿ ಮತ್ತು ಕಾರಣ ನೀಡಿ'); 
            return; 
        }

        speakText("ನಿಮ್ಮ ಕಾರಣವನ್ನು ಶಿಕ್ಷಕರಿಗೆ ಯಶಸ್ವಿಯಾಗಿ ತಲುಪಿಸಲಾಗಿದೆ.");
        alert('ನಿಮ್ಮ ಕಾರಣವನ್ನು ಶಿಕ್ಷಕರಿಗೆ ಯಶಸ್ವಿಯಾಗಿ ತಲುಪಿಸಲಾಗಿದೆ.');
        showPage('homePage');
    }

    // 10 ತಿಂಗಳವರೆಗೆ ಮಾತ್ರ ಹಾಜರಾತಿ ಇಡುವುದು & ಹಳೆಯದು ಡಿಲೀಟ್ ಮಾಡುವುದು
    function cleanupOldRecords() {
        let now = new Date().getTime();
        let tenMonthsInMs = 10 * 30 * 24 * 60 * 60 * 1000;
        attendanceRecords = attendanceRecords.filter(r => (now - new Date(r.date).getTime()) < tenMonthsInMs);
        localStorage.setItem('attendanceRecords', JSON.stringify(attendanceRecords));
    }

    function loadStudentHistory() {
        let sid = document.getElementById('histStudentId').value;
        let student = students.find(s => s.id == sid);
        if(!student) {
            speakText("ಮಗುವಿನ ಐಡಿ ಸಿಗಲಿಲ್ಲ");
            alert("ಸರಿಯಾದ ಮಗುವಿನ ಐಡಿ ಹಾಕಿ!");
            return;
        }

        let myRecords = attendanceRecords.filter(r => r.studentId == sid);
        let html = `<b>ಮಗು:</b> ${student.name} (ID: ${student.id})<br><b>ಒಟ್ಟು ಹಾಜರಾತಿ ದಿನಗಳು:</b> ${myRecords.length}<hr>`;
        if(myRecords.length === 0) {
            html += "<p>ಯಾವುದೇ ಹಾಜರಾತಿ ದಾಖಲೆ ಇಲ್ಲ.</p>";
            document.getElementById('downloadPdfBtn').classList.add('hidden');
        } else {
            html += "<ul>";
            myRecords.forEach(r => {
                html += `<li>${r.dateStr} - ಹಾಜರಿದ್ದಾರೆ</li>`;
            });
            html += "</ul>";
            document.getElementById('downloadPdfBtn').classList.remove('hidden');
        }
        document.getElementById('historyContent').innerHTML = html;
        speakText("ಹಾಜರಾತಿ ವಿವರಗಳನ್ನು ತೋರಿಸಲಾಗಿದೆ.");
    }

    function downloadPDFReport() {
        let sid = document.getElementById('histStudentId').value;
        let student = students.find(s => s.id == sid);
        let myRecords = attendanceRecords.filter(r => r.studentId == sid);

        let reportText = `--- ನಮ್ಮದೇಶಿ ಶಾಲಾ ಹಾಜರಾತಿ ವರದಿ ---\nಮಗುವಿನ ಹೆಸರು: ${student.name}\nಐಡಿ: ${student.id}\nತರಗತಿ: ${student.class}\nಊರು: ${student.village}\nಒಟ್ಟು ದಿನಗಳು: ${myRecords.length}\n\nದಿನಾಂಕಗಳು:\n`;
        myRecords.forEach(r => { reportText += `- ${r.dateStr}\n`; });

        let blob = new Blob([reportText], { type: 'text/plain;charset=utf-8' });
        let link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Attendance_Report_${student.id}.txt`;
        link.click();
        speakText("ವರದಿ ಡೌನ್‌ಲೋಡ್ ಆಗಿದೆ.");
    }

        let code = prompt("ಐಡಿ ಪ್ಯಾನೆಲ್ ಕೋಡ್ ಹಾಕಿ (Admin Code):");

            showPage('adminPanelPage');

                content += `<p><b>ಟೀಚರ್:</b> ${t.name} (ID: ${t.id}, Mobile: ${t.mobile})</p>`;

                    content += `&nbsp;&nbsp;&nbsp;&nbsp;- ಮಗು: ${s.name} (ID: ${s.id}, Class: ${s.class})<br>`;
                });

            speakText("ಅಡ್ಮಿನ್ ಪ್ಯಾನೆಲ್ ತೆರೆಯಲಾಗಿದೆ.");
        } else {
            speakText("ತಪ್ಪಾದ ಕೋಡ್");
            alert("ತಪ್ಪಾದ ಕೋಡ್!");
        }
    }
