<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mobile School - ಮಕ್ಕಳ ಅಭ್ಯಾಸ ತಾಣ</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #FF9F43;
            --success: #2ECC71;
            --bg: #F4F7FE;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, #4A90E2, #50E3C2);
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 22px; }
        header p { margin: 5px 0 0; font-size: 13px; }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card h2 {
            margin-top: 0;
            font-size: 17px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input, select, button, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #DDD;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            overflow-x: auto;
        }

        .nav-tabs button {
            flex: 1;
            padding: 10px;
            font-size: 12px;
            white-space: nowrap;
            background: #E0E0E0;
            color: #333;
        }

        .nav-tabs button.active {
            background: var(--primary);
            color: white;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .chat-box {
            height: 180px;
            overflow-y: auto;
            border: 1px solid #EEE;
            padding: 10px;
            border-radius: 8px;
            background: #FAFAFA;
            margin-bottom: 10px;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        .user-msg { background: #E3F2FD; text-align: right; }
        .robot-msg { background: #FFF3E0; }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .game-btn {
            background: #E8F5E9;
            color: #2E7D32;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            border: 2px solid #A5D6A7;
            cursor: pointer;
            text-align: center;
        }

        canvas {
            border: 2px dashed var(--primary);
            border-radius: 10px;
            background: #FFF;
            touch-action: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤖 AI Mobile School</h1>
        <p id="welcomeText">ನಿಮ್ಮ ಮನೆಯೇ ನಿಮ್ಮ ಶಾಲೆ!</p>
    </header>

    <div class="container">

        <!-- 🔑 Gemini API Key -->
        <div class="card" style="background: #E8F5E9;">
            <h2>🔑 Gemini API Key ಝೋನ್</h2>
            <input type="password" id="apiKey" placeholder="ಇಲ್ಲಿ Gemini API Key ಹಾಕಿ...">
        </div>

        <!-- 👧 1. ಮಗುವಿನ ವಿವರಗಳ ನೋಂದಣಿ (Registration) -->
        <div class="card">
            <h2>👦 ಮಗುವಿನ ನೋಂದಣಿ & ತರಗತಿ</h2>
            <input type="text" id="studentName" placeholder="ಮಗುವಿನ ಹೆಸರು ಬರೆಯಿರಿ..." onchange="updateProfile()">
            <select id="classSelect" onchange="updateProfile()">
                <option value="LKG">LKG / UKG (ಅಕ್ಷರ ಪಯಣ)</option>
                <option value="1">1ನೇ ತರಗತಿ</option>
                <option value="2">2ನೇ ತರಗತಿ</option>
                <option value="3">3ನೇ ತರಗತಿ</option>
                <option value="4">4ನೇ ತರಗತಿ</option>
                <option value="5">5ನೇ ತರಗತಿ</option>
                <option value="6">6ನೇ ತರಗತಿ</option>
                <option value="7">7ನೇ ತರಗತಿ</option>
                <option value="8">8ನೇ ತರಗತಿ (ಪರೀಕ್ಷಾ ತರಬೇತಿ)</option>
                <option value="9">9ನೇ ತರಗತಿ (ಪರೀಕ್ಷಾ ತರಬೇತಿ)</option>
                <option value="10">10ನೇ ತರಗತಿ (SSLC ತಯಾರಿ)</option>
            </select>
        </div>

        <!-- 📌 Menu Navigation -->
        <div class="nav-tabs">
            <button class="active" onclick="switchTab('tutor')">🤖 AI ಗುರೂಜಿ</button>
            <button onclick="switchTab('games')">🎮 ಅಕ್ಷರ ಆಟಗಳು</button>
            <button onclick="switchTab('homework')">📝 ನೋಟ್‌ಬುಕ್ ಪರಿಶೀಲನೆ</button>
            <button onclick="switchTab('trace')">✍️ ಕೈಬರಹ</button>
        </div>

        <!-- 🤖 2. AI Tutor & Audio System -->
        <div id="tutor" class="tab-content active card">
            <h2>🎙️ AI ಗುರೂಜಿ ಜೊತೆ ಮಾತುಕತೆ</h2>
            <div class="chat-box" id="chatBox">
                <div class="message robot-msg">ನಮಸ್ಕಾರ ಮಗುವೇ! ಇಂದು ನಾವೇನು ಕಲಿಯೋಣ?</div>
            </div>
            <textarea id="userInput" rows="2" placeholder="ನಿಮ್ಮ ಪ್ರಶ್ನೆಯನ್ನು ಕೇಳಿ..."></textarea>
            <div style="display: flex; gap: 8px;">
                <button onclick="sendMessage()">ಕಳುಹಿಸಿ 🚀</button>
                <button onclick="startVoice()" style="background: var(--secondary);">🎤 ಮಾತನಾಡಿ (Audio)</button>
            </div>
        </div>

        <!-- 🎮 3. Interactive Games (ಆಟಗಳು) -->
        <div id="games" class="tab-content card">
            <h2>🎮 ಶಬ್ದ ಮತ್ತು ಅಕ್ಷರ ಆಟಗಳು</h2>
            <p style="font-size: 13px;">ಅಕ್ಷರಗಳನ್ನು ಕ್ಲಿಕ್ ಮಾಡಿ ಧ್ವನಿ ಆಲಿಸಿ ಕಲಿಯಿರಿ:</p>
            <div class="game-grid" id="gameGrid">
                <!-- Dynamically Populated Games -->
            </div>
        </div>

        <!-- 📸 4. Homework Evaluation -->
        <div id="homework" class="tab-content card">
            <h2>📸 ನೋಟ್‌ಬುಕ್ ಪರಿಶೀಲನೆ</h2>
            <input type="file" id="imageInput" accept="image/*">
            <button onclick="evaluateHomework()" style="margin-top: 10px;">🔍 ತಪಾಸಣೆ ಮಾಡಿ</button>
            <div id="evalResult" style="margin-top: 15px; font-size: 14px;"></div>
        </div>

        <!-- ✍️ 5. Trace Writing -->
        <div id="trace" class="tab-content card">
            <h2>✏️ ಸ್ಕ್ರೀನ್ ಮೇಲೆ ಬರೆಯುವ ಅಭ್ಯಾಸ</h2>
            <div style="text-align: center;">
                <canvas id="paintCanvas" width="280" height="180"></canvas>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button onclick="clearCanvas()" style="background: #E74C3C;">ಅಳಿಸಿ</button>
                <button onclick="speakText('ತುಂಬಾ ಚೆನ್ನಾಗಿ ಬರೆದಿದ್ದೀಯಾ, ಶಭಾಷ್!')">ಶಭಾಷ್ 🔊</button>
            </div>
        </div>

    </div>

    <script>
        // Switch Tabs
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Voice/Audio Generator (Kannada Audio)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'kn-IN';
                window.speechSynthesis.speak(utterance);
            }
        }

        // Profile Update
        function updateProfile() {
            const name = document.getElementById('studentName').value || 'ಮಗುವೇ';
            const grade = document.getElementById('classSelect').value;
            document.getElementById('welcomeText').innerText = `ಸ್ವಾಗತ ${name}! (${grade} ತರಗತಿ)`;
            loadGames(grade);
            speakText(`ಸ್ವಾಗತ ${name}, ನಿನ್ನ ${grade} ತರಗತಿಯ ಅಭ್ಯಾಸ ಆರಂಭಿಸೋಣ.`);
        }

        // Dynamic Games based on Class
        function loadGames(grade) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            let items = [];

            if (grade === 'LKG' || grade === '1') {
                items = ['ಅ', 'ಆ', 'ಇ', 'ಈ', 'ಉ', 'ಊ', 'A', 'B', 'C'];
            } else {
                items = ['ಗಣಿತ', 'ವಿಜ್ಞಾನ', 'ಕನ್ನಡ', 'ಇಂಗ್ಲಿಷ್', 'ಸಮಾಜ', 'ರಸಪ್ರಶ್ನೆ'];
            }

            items.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'game-btn';
                btn.innerText = item;
                btn.onclick = () => {
                    speakText(`${item}`);
                    alert(`${item} ಅಭ್ಯಾಸ ಆಯ್ಕೆಯಾಗಿದೆ!`);
                };
                grid.appendChild(btn);
            });
        }

        // Voice Recognition
        function startVoice() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'kn-IN';
                recognition.onresult = function(event) {
                    const text = event.results[0][0].transcript;
                    document.getElementById('userInput').value = text;
                    sendMessage();
                };
                recognition.start();
            } else {
                alert("ನಿಮ್ಮ ಮೊಬೈಲ್‌ನಲ್ಲಿ ಮೈಕ್ ಸಪೋರ್ಟ್ ಸಿಗುತ್ತಿಲ್ಲ.");
            }
        }

        // Send to Gemini AI
        async function sendMessage() {
            const apiKey = document.getElementById('apiKey').value;
            const userText = document.getElementById('userInput').value;
            const name = document.getElementById('studentName').value || 'ಮಗು';
            const grade = document.getElementById('classSelect').value;
            const chatBox = document.getElementById('chatBox');

            if (!userText || !apiKey) {
                alert("API Key ಮತ್ತು ನಿಮ್ಮ ಪ್ರಶ್ನೆ ನಮೂದಿಸಿ!");
                return;
            }

            chatBox.innerHTML += `<div class="message user-msg">${userText}</div>`;
            document.getElementById('userInput').value = '';

            const systemPrompt = `ನೀನು ${name} ಎಂಬ ${grade} ತರಗತಿಯ ಮಗುವಿಗೆ ಪ್ರೀತಿಯಿಂದ ಪಾಠ ಹೇಳಿಕೊಡುವ ಶಿಕ್ಷಕ. ಸರಳ ಕನ್ನಡದಲ್ಲಿ ಚಿಕ್ಕದಾಗಿ ಉತ್ತರಿಸು.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `${systemPrompt}\n\n${userText}` }] }]
                    })
                });

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;

                chatBox.innerHTML += `<div class="message robot-msg">${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                speakText(reply);

            } catch (err) {
                chatBox.innerHTML += `<div class="message robot-msg" style="color:red;">API ದೋಷವಾಗಿದೆ, ಸರಿಯಾದ Key ಹಾಕಿ.</div>`;
            }
        }

        // Canvas Setup
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#4A90E2';

        canvas.addEventListener('touchstart', () => isDrawing = true);
        canvas.addEventListener('touchend', () => { isDrawing = false; ctx.beginPath(); });
        canvas.addEventListener('touchmove', draw);

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            let rect = canvas.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left;
            let y = e.touches[0].clientY - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Default Load
        loadGames('LKG');
    </script>
</body>
</html>
