<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ಸಂಪೂರ್ಣ ಜ್ಯೋತಿಷ್ಯ ಮತ್ತು ಹಸ್ತಸಾಮುದ್ರಿಕ ಆಪ್</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            color: #333; 
        }
        .container { 
            width: 100%; 
            height: 100%; 
            max-width: none; 
            background: white; 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            box-shadow: none; 
            border-radius: 0;
            overflow-y: auto;
        }
        h2, h3 { text-align: center; color: #4a148c; margin-top: 10px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #444; font-size: 18px; }
        input, select, button, textarea { 
            width: 100%; 
            padding: 16px; 
            margin-top: 8px; 
            border-radius: 8px; 
            border: 1px solid #ccc; 
            font-size: 18px; 
        }
        button { background: #6a1b9a; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
        button:hover { background: #4a148c; }
        .audio-btn { background: #ffb300; color: black; margin-top: 10px; }
        .audio-btn:hover { background: #ffa000; }
        .mic-btn { background: #00897b; color: white; width: 100%; padding: 16px; margin-top: 10px; font-size: 18px; }
        .section { display: none; flex: 1; flex-direction: column; }
        .active { display: flex; }
        .result-box { margin-top: 20px; padding: 15px; background: #ede7f6; border-radius: 8px; line-height: 1.8; font-size: 18px; white-space: pre-line; flex: 1; }
        .lang-bar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .lang-bar select { width: 140px; padding: 8px; font-size: 16px; }
        
        /* ಚಾಟ್ ಬಾಕ್ಸ್ ಸ್ಟೈಲ್ */
        .chat-container { margin-top: 15px; border: 1px solid #ccc; border-radius: 8px; padding: 10px; background: #fafafa; display: flex; flex-direction: column; flex: 1; }
        .chat-box { flex: 1; min-height: 250px; overflow-y: auto; border: 1px solid #ddd; background: white; padding: 10px; border-radius: 5px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .chat-message { padding: 12px 15px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 16px; }
        .user-msg { background: #d1c4e9; align-self: flex-end; text-align: right; }
        .bot-msg { background: #e0f2f1; align-self: flex-start; text-align: left; }
        
        .chat-input-container { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .chat-input-row { display: flex; gap: 10px; width: 100%; }
        .chat-input-row input { margin-top: 0; flex: 1; font-size: 18px; padding: 14px; }
        .send-btn { margin-top: 0; width: 120px; font-size: 18px; padding: 14px; background: #4a148c; }
    </style>
</head>
<body>

<div class="container">
    <!-- ಭಾಷೆ ಬದಲಾಯಿಸುವ ಸೆಟ್ಟಿಂಗ್ ಬಟನ್ -->
    <div class="lang-bar">
        <select id="langSelect" onchange="changeLanguage()">
            <option value="kn">ಕನ್ನಡ</option>
            <option value="hi">हिंदी</option>
            <option value="en">English</option>
        </select>
    </div>

    <!-- 1. ಲಾಗಿನ್ ಪೇಜ್ (Login Page) -->
    <div id="loginSection" class="section active">
        <h2 id="l-title">ಜ್ಯೋತಿಷ್ಯ ಆಪ್‌ಗೆ ಸ್ವಾಗತ</h2>
        <label id="l-namelbl">ನಿಮ್ಮ ಹೆಸರು:</label>
        <input type="text" id="loginName" placeholder="ಹೆಸರನ್ನು ನಮೂದಿಸಿ">

        <label id="l-phonelbl">ಮೊಬೈಲ್ ನಂಬರ್:</label>
        <input type="tel" id="loginPhone" placeholder="10 ಅಂಕಿಯ ಮೊಬೈಲ್ ನಂಬರ್">

        <button onclick="handleLogin()" id="l-btn">ಲಾಗಿನ್ ಮಾಡಿ</button>
    </div>

    <!-- 2. ಮುಖ್ಯ ಪೇಜ್ (Home / Input Page) -->
    <div id="homeSection" class="section">
        <h2 id="h-title">ಹಸ್ತಸಾಮುದ್ರಿಕ ಮತ್ತು ಜ್ಯೋತಿಷ್ಯ ವಿಶ್ಲೇಷಣೆ</h2>
        <p id="welcomeMsg" style="text-align: center; font-weight: bold; color: #6a1b9a; font-size: 18px;"></p>

        <label id="h-namelbl">ಹೆಸರು:</label>
        <input type="text" id="userName" placeholder="ನಿಮ್ಮ ಹೆಸರು">

        <label id="h-palmlbl">ಕೈಯ ಫೋಟೋ ಹಾಕಿ ಅಥವಾ ಕ್ಯಾಮೆರಾ ಬಳಸಿ:</label>
        <input type="file" id="palmImage" accept="image/*" capture="environment">

        <button onclick="analyzePalm()" id="h-btn">ಭವಿಷ್ಯ ನೋಡಿ</button>
    </div>

    <!-- 3. ಫಲಿತಾಂಶದ ಪೇಜ್ (Result Page) -->
    <div id="resultSection" class="section">
        <h3 id="r-title">ನಿಮ್ಮ ರಿಯಲ್ ಜ್ಯೋತಿಷ್ಯ ವರದಿ</h3>
        <div class="result-box" id="resultOutput"></div>
        <button onclick="speakPrediction()" class="audio-btn" id="r-audiobtn">🔊 ಧ್ವನಿಯಲ್ಲಿ ಕೇಳಿ (Audio)</button>
        
        <!-- ಲೈವ್ ಜ್ಯೋತಿಷ್ಯ ಚಾಟ್ ಬಾಕ್ಸ್ -->
        <div class="chat-container">
            <h4 id="c-title" style="margin-top:0; color:#4a148c;">ಜ್ಯೋತಿಷಿಗಳೊಂದಿಗೆ ನೇರ ಚಾಟ್ / ಪ್ರಶ್ನೆ ಕೇಳಿ</h4>
            <div class="chat-box" id="chatBox">
                <div class="chat-message bot-msg" id="botWelcomeMsg">ನಮಸ್ಕಾರ! ನಿಮ್ಮ ಹಸ್ತಸಾಮುದ್ರಿಕ ವರದಿ ನೋಡಿ ಆಯ್ತು. ನಿಮಗೆ ಬೇರೆ ಏನಾದರೂ ಪ್ರಶ್ನೆಗಳಿವೆಯೆ?</div>
            </div>
            
            <div class="chat-input-container">
                <div class="chat-input-row">
                    <input type="text" id="chatInput" placeholder="ಇಲ್ಲಿ ಟೈಪ್ ಮಾಡಿ...">
                    <button onclick="sendChatMessage()" class="send-btn" id="c-send">ಕಳುಹಿಸು</button>
                </div>
                <button onclick="startVoiceInput()" class="mic-btn" id="r-micbtn">🎙️ ಮಾತನಾಡಿ (Mic)</button>
            </div>
        </div>

        <button onclick="goBack()" style="background: #757575;" id="r-backbtn">ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ</button>
    </div>
</div>

<script>
    let currentLang = 'kn';
    let userGlobalName = '';

    const translations = {
        kn: {
            lTitle: "ಜ್ಯೋತಿಷ್ಯ ಆಪ್‌ಗೆ ಸ್ವಾಗತ",
            lNameLbl: "ನಿಮ್ಮ ಹೆಸರು:",
            lPhoneLbl: "ಮೊಬೈಲ್ ನಂಬರ್:",
            lBtn: "ಲಾಗಿನ್ ಮಾಡಿ",
            hTitle: "ಹಸ್ತಸಾಮುದ್ರಿಕ ಮತ್ತು ಜ್ಯೋತಿಷ್ಯ ವಿಶ್ಲೇಷಣೆ",
            hNameLbl: "ಹೆಸರು:",
            hPalmLbl: "ಕೈಯ ಫೋಟೋ ಹಾಕಿ / ಕ್ಯಾಮೆರಾ ಬಳಸಿ:",
            hBtn: "ಭವಿಷ್ಯ ನೋಡಿ",
            rTitle: "ನಿಮ್ಮ ರಿಯಲ್ ಜ್ಯೋತಿಷ್ಯ ವರದಿ",
            rAudioBtn: "🔊 ಧ್ವನಿಯಲ್ಲಿ ಕೇಳಿ",
            cTitle: "ಜ್ಯೋತಿಷಿಗಳೊಂದಿಗೆ ನೇರ ಚಾಟ್ / ಪ್ರಶ್ನೆ ಕೇಳಿ",
            cPlaceholder: "ಇಲ್ಲಿ ಟೈಪ್ ಮಾಡಿ...",
            cSend: "ಕಳುಹಿಸು",
            rMicBtn: "🎙️ ಮಾತನಾಡಿ (Mic)",
            rBackbtn: "ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ",
            botDefault: "ನಿಮ್ಮ ಪ್ರಶ್ನೆಗೆ ಜ್ಯೋತಿಷ್ಯ ಶಾಸ್ತ್ರದ ಪ್ರಕಾರ, ಮುಂಬರುವ ದಿನಗಳಲ್ಲಿ ನಿಮಗೆ ಶುಭ ಫಲಗಳು ಸಿಗಲಿವೆ. ತಾಳ್ಮೆಯಿಂದ ಇರಿ."
        },
        hi: {
            lTitle: "ज्योतिष ऐप में आपका स्वागत है",
            lNameLbl: "आपका नाम:",
            lPhoneLbl: "मोबाइल नंबर:",
            lBtn: "लॉगिन करें",
            hTitle: "हस्तरेखा और ज्योतिष विश्लेषण",
            hNameLbl: "नाम:",
            hPalmLbl: "हाथ की फोटो अपलोड करें / कैमरा:",
            hBtn: "भविष्य देखें",
            rTitle: "आपकी वास्तविक ज्योतिष रिपोर्ट",
            rAudioBtn: "🔊 आवाज़ में सुनें",
            cTitle: "ज्योतिषी से लाइव चैट करें",
            cPlaceholder: "यहाँ टाइप करें...",
            cSend: "भेजें",
            rMicBtn: "🎙️ बोलें (Mic)",
            rBackbtn: "वापस जाएं",
            botDefault: "ज्योतिष शास्त्र के अनुसार आने वाले दिनों में आपको शुभ फल मिलेंगे। धैर्य रखें।"
        },
        en: {
            lTitle: "Welcome to Astrology App",
            lNameLbl: "Your Name:",
            lPhoneLbl: "Mobile Number:",
            lBtn: "Login",
            hTitle: "Palmistry & Astrology Analysis",
            hNameLbl: "Name:",
            hPalmLbl: "Upload Palm Photo / Camera:",
            hBtn: "Analyze Future",
            rTitle: "Your Real Astrology Report",
            rAudioBtn: "🔊 Listen Audio",
            cTitle: "Live Chat with Astrologer",
            cPlaceholder: "Type here...",
            cSend: "Send",
            rMicBtn: "🎙️ Speak (Mic)",
            rBackbtn: "Back",
            botDefault: "According to astrology, you will receive favorable results in the coming days. Stay patient."
        }
    };

    function changeLanguage() {
        currentLang = document.getElementById('langSelect').value;
        document.getElementById('l-title').innerText = translations[currentLang].lTitle;
        document.getElementById('l-namelbl').innerText = translations[currentLang].lNameLbl;
        document.getElementById('l-phonelbl').innerText = translations[currentLang].lPhoneLbl;
        document.getElementById('l-btn').innerText = translations[currentLang].lBtn;
        document.getElementById('h-title').innerText = translations[currentLang].hTitle;
        document.getElementById('h-namelbl').innerText = translations[currentLang].hNameLbl;
        document.getElementById('h-palmlbl').innerText = translations[currentLang].hPalmLbl;
        document.getElementById('h-btn').innerText = translations[currentLang].hBtn;
        document.getElementById('r-title').innerText = translations[currentLang].rTitle;
        document.getElementById('r-audiobtn').innerText = translations[currentLang].rAudioBtn;
        document.getElementById('c-title').innerText = translations[currentLang].cTitle;
        document.getElementById('chatInput').placeholder = translations[currentLang].cPlaceholder;
        document.getElementById('c-send').innerText = translations[currentLang].cSend;
        document.getElementById('r-micbtn').innerText = translations[currentLang].rMicBtn;
        document.getElementById('r-backbtn').innerText = translations[currentLang].rBackbtn;
        document.getElementById('botWelcomeMsg').innerText = currentLang === 'kn' ? 
            "ನಮಸ್ಕಾರ! ನಿಮ್ಮ ಹಸ್ತಸಾಮುದ್ರಿಕ ವರದಿ ನೋಡಿ ಆಯ್ತು. ನಿಮಗೆ ಬೇರೆ ಏನಾದರೂ ಪ್ರಶ್ನೆಗಳಿವೆಯೆ?" :
            (currentLang === 'hi' ? "नमस्ते! आपकी रिपोर्ट देख ली गई है। क्या आपका कोई अन्य प्रश्न है?" : "Hello! Your report is viewed. Do you have any other questions?");
    }

    function handleLogin() {
        const name = document.getElementById('loginName').value.trim();
        const phone = document.getElementById('loginPhone').value.trim();

        if(!name || phone.length < 10) {
            alert(currentLang === 'kn' ? "ದಯವಿಟ್ಟು ಸರಿಯಾದ ಹೆಸರು ಮತ್ತು ಮೊಬೈಲ್ ನಂಬರ್ ಹಾಕಿ!" : "Please enter valid name and mobile number!");
            return;
        }

        userGlobalName = name;
        document.getElementById('userName').value = name;
        document.getElementById('welcomeMsg').innerText = (currentLang === 'kn' ? "ಸ್ವಾಗತ, " : "Welcome, ") + name;

        document.getElementById('loginSection').classList.remove('active');
        document.getElementById('homeSection').classList.add('active');
    }

    let reportText = "";

    function analyzePalm() {
        const palmFile = document.getElementById('palmImage').files.length;
        if(palmFile === 0) {
            alert(currentLang === 'kn' ? "ದಯವಿಟ್ಟು ಕೈಯ ಫೋಟೋ ಹಾಕಿ!" : "Please upload your palm photo!");
            return;
        }

        if(currentLang === 'kn') {
            reportText = `ನಮಸ್ಕಾರ ${userGlobalName}.\n\n` +
                         `1. ರಾಶಿ ಮತ್ತು ಅಂದಾಜು ವಯಸ್ಸು:\n ನಿಮ್ಮ ಕೈಯ ರೇಖೆಗಳ ಪ್ರಕಾರ ನಿಮ್ಮ ಭವಿಷ್ಯ ಅತ್ಯಂತ ಉಜ್ವಲವಾಗಿದೆ. ನಿಮಗೆ ಧನಲಾಭವಾಗುವ ಯೋಗವಿದೆ.\n\n` +
                         `2. ವೃತ್ತಿ ಮತ್ತು ವ್ಯಾಪಾರ:\n ಮುಂಬರುವ ದಿನಗಳಲ್ಲಿ ನಿಮಗೆ ಹೊಸ ಅವಕಾಶಗಳು ಸಿಗಲಿವೆ. ತಾಳ್ಮೆಯಿಂದ ಮುಂದುವರಿಯಿರಿ.`;
        } else if(currentLang === 'hi') {
            reportText = `नमस्ते ${userGlobalName}。\n\n` +
                         `1. आपकी रेखाओं के अनुसार आपका भविष्य उज्ज्वल है।\n\n` +
                         `2. व्यवसाय में आपको लाभ मिलने की संभावना है।`;
        } else {
            reportText = `Hello ${userGlobalName}.\n\n` +
                         `1. According to your palm lines, your future is bright.\n\n` +
                         `2. You have good chances of financial growth ahead.`;
        }

        document.getElementById('resultOutput').innerText = reportText;
        document.getElementById('homeSection').classList.remove('active');
        document.getElementById('resultSection').classList.add('active');

        // ಸ್ಕ್ರೀನ್ ಮೇಲೆ ಬಂದ ತಕ್ಷಣ ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಧ್ವನಿಯಲ್ಲಿ ಓದಿ ಹೇಳಲು (Auto Speech)
        speakPrediction();
    }

    // ಧ್ವನಿಯಲ್ಲಿ ಓದಿ ಹೇಳುವ ಫಂಕ್ಷನ್ (Text-to-Speech)
    function speakPrediction() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // ಹಳೆಯ ಧ್ವನಿ ಇದ್ದರೆ ನಿಲ್ಲಿಸಿ
            const utterance = new SpeechSynthesisUtterance(reportText);
            utterance.lang = currentLang === 'kn' ? 'kn-IN' : (currentLang === 'hi' ? 'hi-IN' : 'en-US');
            utterance.rate = 0.9; // ಮಾತಿನ ವೇಗ
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Speech synthesis not supported in this browser.");
        }
    }

    // ಮೈಕ್ ಮೂಲಕ ಧ್ವನಿ ಇನ್ಪುಟ್ ತೆಗೆದುಕೊಂಡು ಚಾಟ್ ಮಾಡುವ ಫಂಕ್ಷನ್ (Speech-to-Text)
    function startVoiceInput() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert(currentLang === 'kn' ? "ನಿಮ್ಮ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಮೈಕ್ ಸಪೋರ್ಟ್ ಇಲ್ಲ." : "Speech recognition is not supported in this browser.");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = currentLang === 'kn' ? 'kn-IN' : (currentLang === 'hi' ? 'hi-IN' : 'en-US');
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = function() {
            document.getElementById('chatInput').placeholder = currentLang === 'kn' ? "ಆಲಿಸುತ್ತಿದೆ..." : "Listening...";
        };

        recognition.onresult = function(event) {
            const speechResult = event.results[0][0].transcript;
            document.getElementById('chatInput').value = speechResult;
            document.getElementById('chatInput').placeholder = translations[currentLang].cPlaceholder;
            sendChatMessage(); // ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಮೆಸೇಜ್ ಕಳುಹಿಸುವುದು
        };

        recognition.onerror = function(event) {
            document.getElementById('chatInput').placeholder = translations[currentLang].cPlaceholder;
        };

        recognition.onend = function() {
            document.getElementById('chatInput').placeholder = translations[currentLang].cPlaceholder;
        };

        recognition.start();
    }

    function sendChatMessage() {
        const inputField = document.getElementById('chatInput');
        const messageText = inputField.value.trim();
        if(!messageText) return;

        const chatBox = document.getElementById('chatBox');

        // ಬಳಕೆದಾರರ ಮೆಸೇಜ್ ಸೇರಿಸುವುದು
        const userMsgDiv = document.createElement('div');
        userMsgDiv.className = 'chat-message user-msg';
        userMsgDiv.innerText = messageText;
        chatBox.appendChild(userMsgDiv);

        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // ಬೋಟ್ ಉತ್ತರ ನೀಡುವುದು
        setTimeout(() => {
            const botMsgDiv = document.createElement('div');
            botMsgDiv.className = 'chat-message bot-msg';
            const replyText = translations[currentLang].botDefault;
            botMsgDiv.innerText = replyText;
            chatBox.appendChild(botMsgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // ಬೋಟ್ ಉತ್ತರವನ್ನೂ ಸಹ ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಧ್ವನಿಯಲ್ಲಿ ಓದಿ ಹೇಳುವುದು
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(replyText);
                utterance.lang = currentLang === 'kn' ? 'kn-IN' : (currentLang === 'hi' ? 'hi-IN' : 'en-US');
                window.speechSynthesis.speak(utterance);
            }
        }, 1000);
    }

    function goBack() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
        document.getElementById('resultSection').classList.remove('active');
        document.getElementById('homeSection').classList.add('active');
    }
</script>

</body>
</html>
