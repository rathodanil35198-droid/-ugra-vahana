<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಕನ್ನಡ ರಿಯಲ್ ಕ್ವಿಜ್ ಗೇಮ್</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            background: #ffffff;
            color: #333;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
            text-align: center;
        }
        h2 { color: #1b4f72; margin-top: 0; margin-bottom: 10px; }
        .stats {
            display: flex;
            justify-content: space-between;
            background: #eaf2f8;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #1b4f72;
        }
        .question-box {
            background: #f9f9f9;
            border: 2px dashed #aed6f1;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        #question {
            font-weight: bold;
            font-size: 17px;
            margin: 0;
            color: #2c3e50;
        }
        .option-btn {
            background: #ebf5fb;
            color: #1b4f72;
            border: 1px solid #85c1e9;
            padding: 12px;
            margin: 6px 0;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            text-align: left;
            padding-left: 15px;
            transition: 0.2s;
        }
        .option-btn:hover { background: #d4e6f1; transform: scale(1.01); }
        .option-btn.correct { background: #27ae60 !important; color: white !important; border-color: #196f3d; }
        .option-btn.wrong { background: #e74c3c !important; color: white !important; border-color: #943126; }
        
        .btn {
            background: #f39c12;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 8px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover { background: #d68910; }
        .btn-green { background: #27ae60; }
        .btn-green:hover { background: #1e8449; }

        .ad-box {
            background: #fef9e7;
            color: #7d6608;
            border: 1px solid #f9e79f;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 12px;
        }
        /* ಪಾಪ್‌ಅಪ್ ಜಾಹೀರಾತು ಸಿಮ್ಯುಲೇಶನ್ */
        #ad-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .ad-modal {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }
        .ad-timer {
            font-size: 22px;
            color: #e74c3c;
            font-weight: bold;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h2>ಕರ್ನಾಟಕ ಜ್ಞಾನ ರತ್ನ</h2>
        
        <div class="stats">
            <div>ನಾಣ್ಯಗಳು: <span id="score">50</span></div>
            <div>ಹಂತ: <span id="level">1</span></div>
        </div>

        <div class="question-box">
            <p id="question">ಪ್ರಶ್ನೆ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</p>
        </div>

        <div id="options-container">
            <!-- ಆಪ್ಟಿಷನ್ ಬಟನ್‌ಗಳು ಇಲ್ಲಿ ಬರುತ್ತವೆ -->
        </div>

        <button class="btn" onclick="showRewardedAd()">📺 ಜಾಹೀರಾತು ನೋಡಿ 30 ನಾಣ್ಯ ಗಳಿಸಿ</button>
        <button class="btn btn-green" onclick="claimDailyBonus()">🎁 ಡೈಲಿ ಬೋನಸ್ (20 ನಾಣ್ಯಗಳು)</button>

        <div class="ad-box">
            📢 <b>ಅಧಿಸೂಚನೆ:</b> ರಿಯಲ್ ಅಪ್ಲಿಕೇಶನ್ ತಯಾರಾದಾಗ ಇಲ್ಲಿ Google AdMob ಜಾಹೀರಾತುಗಳು ಪ್ರದರ್ಶಿಸಲ್ಪಡುತ್ತವೆ.
        </div>
    </div>

    <!-- ರಿಯಲ್ ವರ್ಕಿಂಗ್ ಜಾಹೀರಾತು ಪಾಪ್‌ಅಪ್ ಸಿಮ್ಯುಲೇಶನ್ -->
    <div id="ad-overlay">
        <div class="ad-modal">
            <h3 style="color: #2c3e50; margin-top:0;">ಪ್ರಾಯೋಜಿತ ಜಾಹೀರಾತು (Sponsored Ad)</h3>
            <p style="font-size: 14px; color: #666;">ಈ ಜಾಹೀರಾತು ಪೂರ್ಣಗೊಂಡ ನಂತರ ನಿಮ್ಮ ಖಾತೆಗೆ ನಾಣ್ಯಗಳು ಜಮೆ ಆಗುತ್ತವೆ.</p>
            <div class="ad-timer" id="timer">5</div>
            <p id="ad-status" style="font-size: 13px; font-weight: bold; color: #e67e22;">ಜಾಹೀರಾತು ಮುಗಿಯುವವರೆಗೆ ಕಾಯಿರಿ...</p>
        </div>
    </div>

    <script>
        let score = 50;
        let level = 1;
        let currentQuestionIndex = 0;
        let canAnswer = true;

        // ದೊಡ್ಡದಾದ ಪ್ರಶ್ನೆಗಳ ಬ್ಯಾಂಕ್
        const quizData = [
            {
                question: "ಕರ್ನಾಟಕದ ರಾಜ್ಯ ಪ್ರಾಣಿ ಯಾವುದು?",
                options: ["ಹುಲಿ", "ಏಷ್ಯನ್ ಆನೆ", "ಸಿಂಹ", "ಚಿರತೆ"],
                answer: 1
            },
            {
                question: "ವಿಶ್ವವಿಖ್ಯಾತ ಹಂಪಿ ಯಾವ ನಡಿಯ ದಡದಲ್ಲಿದೆ?",
                options: ["ಕಾವೇರಿ", "ಕೃಷ್ಣಾ", "ತುಂಗಭದ್ರಾ", "ಮಲಪ್ರಭಾ"],
                answer: 2
            },
            {
                question: "ಜ್ಞಾನಪೀಠ ಪ್ರಶಸ್ತಿ ಪಡೆದ ಮೊದಲ ಕನ್ನಡಿಗರು ಯಾರು?",
                options: ["ಕುವೆಂಪು", "ರಾಷ್ಟ್ರಕವಿ ಗೋವಿಂದ ಪೈ", "ಮಾಸ್ತಿ ವೆಂಕಟೇಶ ಅಯ್ಯಂಗಾರ್", "ಬೆಟಗೇರಿ ಕೃಷ್ಣಶರ್ಮ"],
                answer: 0
            },
            {
                question: "ಕನ್ನಡದ ಮೊದಲ ವಾಕ್ಚಿತ್ರ (ಮೊದಲ ಧ್ವನಿ ಚಿತ್ರ) ಸಿನಿಮಾ ಯಾವುದು?",
                options: ["ಸತಿ ಸುಲೋಚನಾ", "ಭಕ್ತ ಪ್ರಹ್ಲಾದ", "ನಾಗರಹಾವು", "ಬಂಗಾರದ ಮನುಷ್ಯ"],
                answer: 0
            },
            {
                question: "ಕರ್ನಾಟಕದಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು ಮಳೆ ಬೀಳುವ ಪ್ರದೇಶ ಯಾವುದು?",
                options: ["ಮಡಿಕೇರಿ", "ಆಗುಂಬೆ", "ಚಾರ್ಮಾಡಿ", "ಸಕಲೇಶಪುರ"],
                answer: 1
            }
        ];

        function loadQuestion() {
            if (currentQuestionIndex >= quizData.length) {
                currentQuestionIndex = 0;
                level++;
                document.getElementById('level').innerText = level;
                alert("ಅಭಿನಂದನೆಗಳು! ನೀವು ಮುಂದಿನ ಹಂತಕ್ಕೆ (Level " + level + ") ಪ್ರವೇಶಿಸಿದ್ದೀರಿ! 🎉");
            }

            canAnswer = true;
            const q = quizData[currentQuestionIndex];
            document.getElementById('question').innerText = `ಪ್ರಶ್ನೆ ${currentQuestionIndex + 1}: ${q.question}`;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${index + 1}. ${opt}`;
                btn.onclick = () => checkAnswer(index, q.answer, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, clickedBtn) {
            if (!canAnswer) return;
            canAnswer = false;

            const allButtons = document.querySelectorAll('.option-btn');

            if (selected === correct) {
                clickedBtn.classList.add('correct');
                score += 10;
                setTimeout(() => {
                    alert("ಸರಿಯಾದ ಉತ್ತರ! 🎉 +10 ನಾಣ್ಯಗಳು");
                    nextStep();
                }, 400);
            } else {
                clickedBtn.classList.add('wrong');
                allButtons[correct].classList.add('correct'); // ಸರಿಯಾದ ಉತ್ತರವನ್ನು ತೋರಿಸಿ
                score -= 5;
                if(score < 0) score = 0;
                setTimeout(() => {
                    alert("ತಪ್ಪು ಉತ್ತರ! ❌ -5 ನಾಣ್ಯಗಳು ಕಡಿತಗೊಂಡಿವೆ.");
                    nextStep();
                }, 400);
            }
            document.getElementById('score').innerText = score;
        }

        function nextStep() {
            currentQuestionIndex++;
            loadQuestion();
        }

        // ರಿಯಲ್ ವರ್ಕಿಂಗ್ ಜಾಹೀರಾತು ಸಿಮ್ಯುಲೇಶನ್ (5 ಸೆಕೆಂಡ್ ಕೌಂಟ್‌ಡೌನ್)
        function showRewardedAd() {
            const overlay = document.getElementById('ad-overlay');
            const timerDisplay = document.getElementById('timer');
            const statusDisplay = document.getElementById('ad-status');
            
            overlay.style.display = 'flex';
            let timeLeft = 5;
            timerDisplay.innerText = timeLeft;
            statusDisplay.innerText = "ಜಾಹೀರಾತು ಪ್ರದರ್ಶಿಸಲಾಗುತ್ತಿದೆ...";

            let countdown = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    overlay.style.display = 'none';
                    score += 30;
                    document.getElementById('score').innerText = score;
                    alert("ಅಭಿನಂದನೆಗಳು! ಜಾಹೀರಾತು ಪೂರ್ಣಗೊಂಡಿದೆ. ನಿಮ್ಮ ಖಾತೆಗೆ 30 ನಾಣ್ಯಗಳು ಜಮೆ ಆಗಿವೆ! 💰");
                }
            }, 1000);
        }

        // ಡೈಲಿ ಬೋನಸ್
        let lastBonusDate = "";
        function claimDailyBonus() {
            let today = new Date().toDateString();
            if (lastBonusDate === today) {
                alert("ನೀವು ಇಂದಿನ ಡೈಲಿ ಬೋನಸ್ ಅನ್ನು ಈಗಾಗಲೇ ಪಡೆದುಕೊಂಡಿದ್ದೀರಿ! ನಾಳೆ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.");
                return;
            }
            lastBonusDate = today;
            score += 20;
            document.getElementById('score').innerText = score;
            alert("ಯಶಸ್ವಿ! ಇಂದಿನ ಡೈಲಿ ಬೋನಸ್ 20 ನಾಣ್ಯಗಳು ಸೇರಿಕೊಂಡಿವೆ! 🎁");
        }

        // ಗೇಮ್ ಪ್ರಾರಂಭ
        loadQuestion();
    </script>

</body>
</html>
