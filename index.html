<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಮಕ್ಕಳ ಡಿಜಿಟಲ್ ಶಾಲೆ</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;700;800&family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Baloo Tamma 2', 'Nunito', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        #app-container {
            width: 100%;
            max-width: 450px;
            height: 92vh;
            max-height: 850px;
            background: #ffffff;
            border-radius: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 8px solid #FFF066;
        }

        /* Top Header */
        .app-header {
            background: linear-gradient(180deg, #4FACFE 0%, #00F2FE 100%);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: #FFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 3px solid #FFD700;
        }

        .user-details h3 {
            font-size: 1.1rem;
            line-height: 1.1;
        }

        .user-details p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .score-badge {
            background: #FFD700;
            color: #4A3B00;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 3px 0 #C9A800;
        }

        /* Screen Area */
        .screen {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Screen 1: Welcome */
        #welcome-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 20px;
        }

        .robot-box {
            position: relative;
            cursor: pointer;
            animation: bounce 2s infinite alternate ease-in-out;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        .robot-svg {
            width: 160px;
            height: 160px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
        }

        .speech-bubble {
            background: #FFF9C4;
            border: 3px solid #FBC02D;
            border-radius: 20px;
            padding: 15px 20px;
            position: relative;
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            box-shadow: 0 5px 0 #FBC02D;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: #FFF9C4 transparent;
            display: block;
            width: 0;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .custom-input, .custom-select {
            width: 100%;
            padding: 14px 18px;
            border: 3px solid #4FACFE;
            border-radius: 18px;
            font-size: 1.1rem;
            outline: none;
            text-align: center;
            font-weight: bold;
            color: #2C3E50;
            background: #F4F9FF;
        }

        .btn-start {
            background: linear-gradient(180deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 20px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 0 #1b7a54;
            transition: all 0.1s ease;
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1b7a54;
        }

        /* Dashboard Screen */
        .dashboard-title {
            text-align: center;
            color: #FF4081;
            font-size: 1.4rem;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .category-card {
            background: #FFF;
            border-radius: 22px;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.08);
            border: 3px solid #EEE;
            cursor: pointer;
        }

        .card-kn { border-color: #FF9F43; background: #FFF9F0; }
        .card-en { border-color: #54a0ff; background: #F0F7FF; }
        .card-math { border-color: #10ac84; background: #EBFBF7; }
        .card-exam { border-color: #ee5253; background: #FFF0F0; }

        .card-icon { font-size: 2.8rem; }
        .card-title { font-size: 1.1rem; font-weight: 800; color: #2D3436; }

        /* Lesson View */
        .lesson-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .btn-back {
            background: #FF6B6B;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 #c0392b;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .item-card {
            aspect-ratio: 1;
            background: white;
            border: 3px solid #74b9ff;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 0 #0984e3;
        }

        .item-char { font-size: 2rem; font-weight: 800; color: #2c3e50; }
        .item-sub { font-size: 0.8rem; color: #7f8c8d; }

        /* Quiz View */
        .quiz-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .question-box {
            background: #FFF3E0;
            border: 3px solid #FF9800;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: #E65100;
            box-shadow: 0 5px 0 #FB8C00;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .option-btn {
            background: #E3F2FD;
            border: 3px solid #2196F3;
            padding: 20px;
            border-radius: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #0D47A1;
            cursor: pointer;
            box-shadow: 0 5px 0 #1976D2;
            text-align: center;
        }

        /* Robot Footer */
        .assistant-bar {
            background: #FFF8E1;
            border-top: 3px solid #FFE082;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .mini-robot { width: 50px; height: 50px; flex-shrink: 0; cursor: pointer; }
        .robot-msg { font-size: 0.95rem; font-weight: bold; color: #5D4037; line-height: 1.2; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">

    <!-- Header View -->
    <div id="app-header" class="app-header hidden">
        <div class="user-info">
            <div class="user-avatar" id="header-avatar">🤖</div>
            <div class="user-details">
                <h3 id="display-name">ಮಗು</h3>
                <p id="display-class">ತರಗತಿ: ೧</p>
            </div>
        </div>
        <div class="score-badge">
            ⭐ <span id="score-val">10</span>
        </div>
    </div>

    <!-- 1. WELCOME SCREEN -->
    <div id="welcome-screen" class="screen">
        <div class="speech-bubble" id="welcome-bubble">
            ಹಾಯ್ ಮಗು! 🖐️ ನನ್ನ ಹೆಸರು ಚಿನ್ನು ರೋಬೋಟ್! ನಿನ್ನ ಹೆಸರೇನು?
        </div>
        
        <div class="robot-box" onclick="speakText('ಹಾಯ್ ಮಗು! ನನ್ನ ಹೆಸರು ಚಿನ್ನು ರೋಬೋಟ್!')">
            <svg class="robot-svg" viewBox="0 0 200 200">
                <rect x="50" y="60" width="100" height="90" rx="20" fill="#4FACFE" stroke="#00C6FF" stroke-width="5"/>
                <circle cx="80" cy="95" r="15" fill="#FFF"/>
                <circle cx="120" cy="95" r="15" fill="#FFF"/>
                <circle cx="80" cy="95" r="7" fill="#2C3E50"/>
                <circle cx="120" cy="95" r="7" fill="#2C3E50"/>
                <path d="M 80 125 Q 100 145 120 125" stroke="#FFF" stroke-width="6" fill="none" stroke-linecap="round"/>
                <rect x="90" y="25" width="20" height="35" fill="#FFD700"/>
                <circle cx="100" cy="20" r="12" fill="#FF4757"/>
                <rect x="25" y="80" width="25" height="50" rx="10" fill="#38EF7D"/>
                <rect x="150" y="80" width="25" height="50" rx="10" fill="#38EF7D"/>
            </svg>
        </div>

        <div class="input-group">
            <input type="text" id="student-name" class="custom-input" placeholder="ನಿನ್ನ ಹೆಸರು ಬರೆ..." value="ಅರ್ಜುನ್">
            <select id="student-class" class="custom-select">
                <option value="೧ ನೇ ತರಗತಿ">೧ ನೇ ತರಗತಿ (Class 1)</option>
                <option value="೨ ನೇ ತರಗತಿ">೨ ನೇ ತರಗತಿ (Class 2)</option>
                <option value="೩ ನೇ ತರಗತಿ">೩ ನೇ ತರಗತಿ (Class 3)</option>
            </select>
            <button class="btn-start" onclick="startApp()">ಕಲಿಕೆ ಆರಂಭಿಸಿ 🚀</button>
        </div>
    </div>

    <!-- 2. DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="screen hidden">
        <div class="dashboard-title">ಏನು ಕಲಿಯಲು ಬಯಸುತ್ತೀಯಾ? 👇</div>
        <div class="category-grid">
            <div class="category-card card-kn" onclick="openModule('kannada')">
                <div class="card-icon">ಅ</div>
                <div class="card-title">ಕನ್ನಡ ಅಕ್ಷರಮಾಲೆ</div>
            </div>
            <div class="category-card card-en" onclick="openModule('english')">
                <div class="card-icon">A</div>
                <div class="card-title">English ABC</div>
            </div>
            <div class="category-card card-math" onclick="openModule('maths')">
                <div class="card-icon">🔢</div>
                <div class="card-title">ಗಣಿತ & ಲೆಕ್ಕಗಳು</div>
            </div>
            <div class="category-card card-exam" onclick="openModule('exam')">
                <div class="card-icon">📝</div>
                <div class="card-title">ಪರೀಕ್ಷೆ / Exam Test</div>
            </div>
        </div>
    </div>

    <!-- 3. LEARNING MODULE VIEW -->
    <div id="learning-screen" class="screen hidden">
        <div class="lesson-header">
            <button class="btn-back" onclick="goDashboard()">⬅️ ಹಿಂದೆ</button>
            <h3 id="module-title" style="color:#2C3E50;">ಕನ್ನಡ</h3>
        </div>
        <div id="cards-container" class="cards-grid"></div>
    </div>

    <!-- 4. EXAM SCREEN -->
    <div id="exam-screen" class="screen hidden">
        <div class="lesson-header">
            <button class="btn-back" onclick="goDashboard()">⬅️ ನಿರ್ಗಮಿಸು</button>
            <h3 style="color:#E65100;">ಮಕ್ಕಳ ಪರೀಕ್ಷೆ 🎯</h3>
        </div>
        <div class="quiz-container">
            <div class="question-box" id="quiz-question">೩ + ೨ = ಎಷ್ಟು?</div>
            <div class="options-grid" id="options-box"></div>
        </div>
    </div>

    <!-- Persistent Bottom Robot Assistant -->
    <div id="assistant-bar" class="assistant-bar hidden">
        <svg class="mini-robot" viewBox="0 0 200 200">
            <rect x="50" y="60" width="100" height="90" rx="20" fill="#4FACFE"/>
            <circle cx="80" cy="95" r="12" fill="#FFF"/><circle cx="120" cy="95" r="12" fill="#FFF"/>
            <circle cx="80" cy="95" r="5" fill="#000"/><circle cx="120" cy="95" r="5" fill="#000"/>
            <path d="M 85 125 Q 100 135 115 125" stroke="#FFF" stroke-width="5" fill="none"/>
            <circle cx="100" cy="20" r="10" fill="#FF4757"/>
        </svg>
        <div class="robot-msg" id="robot-speech">
            ನಾನು ನಿನಗೆ ಸಹಾಯ ಮಾಡಲು ಇಲ್ಲಿದ್ದೇನೆ!
        </div>
    </div>

</div>

<script>
    let studentName = "";
    let studentClass = "";
    let userScore = 10;
    let currentCorrectAnswer = "";

    const kannadaData = [
        { char: 'ಅ', name: 'ಅರಸ' }, { char: 'ಆ', name: 'ಆನೆ' },
        { char: 'ಇ', name: 'ಇಲಿ' }, { char: 'ಈ', name: 'ಈಶ' },
        { char: 'ಉ', name: 'ಉಟ' }, { char: 'ಊ', name: 'ಊಟ' },
        { char: 'ಋ', name: 'ಋಷಿ' }, { char: 'ಎ', name: 'ಎಲೆ' },
        { char: 'ಏ', name: 'ಏಣಿ' }, { char: 'ಐ', name: 'ಐದನೇ' },
        { char: 'ಒ', name: 'ಒಂಟೆ' }, { char: 'ಓ', name: 'ಓಡು' },
        { char: 'ಔ', name: 'ಔಷಧ' }, { char: 'ಅಂ', name: 'ಅಂಬಾರಿ' },
        { char: 'ಕ', name: 'ಕಮಲ' }, { char: 'ಖ', name: 'ಖಡ್ಗ' },
        { char: 'ಗ', name: 'ಗಜ' }, { char: 'ಘ', name: 'ಘಂಟೆ' }
    ];

    const englishData = [
        { char: 'A', name: 'Apple' }, { char: 'B', name: 'Ball' },
        { char: 'C', name: 'Cat' }, { char: 'D', name: 'Dog' }
    ];

    const mathsData = [
        { char: '1', name: 'ಒಂದು' }, { char: '2', name: 'ಎರಡು' },
        { char: '3', name: 'ಮೂರು' }, { char: '4', name: 'ನಾಲ್ಕು' }
    ];

    const questions = [
        { q: 'ಕಮಲ ದ ಮೊದಲ ಅಕ್ಷರ ಯಾವುದು?', options: ['ಕ', 'ಖ', 'ಗ', 'ಘ'], ans: 'ಕ' },
        { q: '೨ + ೩ = ಎಷ್ಟು?', options: ['೪', '೫', '೬', '೩'], ans: '೫' }
    ];

    function speakText(text) {
        try {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'kn-IN';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        } catch (e) {
            console.log("Speech Error:", e);
        }
    }

    function setRobotMessage(msg) {
        document.getElementById('robot-speech').innerText = msg;
        speakText(msg);
    }

    function startApp() {
        try {
            const nameInput = document.getElementById('student-name').value.trim();
            studentClass = document.getElementById('student-class').value;
            studentName = nameInput ? nameInput : "ಮಗು";

            document.getElementById('display-name').innerText = studentName;
            document.getElementById('display-class').innerText = "ತರಗತಿ: " + studentClass;

            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('app-header').classList.remove('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('assistant-bar').classList.remove('hidden');

            setRobotMessage(`ಸ್ವಾಗತ ${studentName}! ಏನು ಕಲಿಯೋಣ?`);
        } catch (err) {
            alert("Error: " + err.message);
        }
    }

    function goDashboard() {
        document.getElementById('learning-screen').classList.add('hidden');
        document.getElementById('exam-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
    }

    function openModule(moduleType) {
        document.getElementById('dashboard-screen').classList.add('hidden');
        
        if (moduleType === 'exam') {
            document.getElementById('exam-screen').classList.remove('hidden');
            loadNextQuestion();
            return;
        }

        document.getElementById('learning-screen').classList.remove('hidden');
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        let data = [];
        let title = "";

        if (moduleType === 'kannada') { data = kannadaData; title = "ಕನ್ನಡ ಅಕ್ಷರಗಳು"; } 
        else if (moduleType === 'english') { data = englishData; title = "English Alphabet"; } 
        else if (moduleType === 'maths') { data = mathsData; title = "ಗಣಿತ"; }

        document.getElementById('module-title').innerText = title;

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `<div class="item-char">${item.char}</div><div class="item-sub">${item.name}</div>`;
            card.onclick = () => {
                setRobotMessage(`${item.char} ಅಂದರೆ ${item.name}`);
            };
            container.appendChild(card);
        });
    }

    let currentQIndex = 0;
    function loadNextQuestion() {
        const qData = questions[currentQIndex % questions.length];
        currentCorrectAnswer = qData.ans;
        document.getElementById('quiz-question').innerText = qData.q;

        const optBox = document.getElementById('options-box');
        optBox.innerHTML = '';

        qData.options.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);
            optBox.appendChild(btn);
        });
    }

    function checkAnswer(selectedOpt) {
        if (selectedOpt === currentCorrectAnswer) {
            userScore += 5;
            document.getElementById('score-val').innerText = userScore;
            setRobotMessage(`ಕರೆಕ್ಟ್ ಉತ್ತರ! 🎉`);
            setTimeout(() => {
                currentQIndex++;
                loadNextQuestion();
            }, 1500);
        } else {
            setRobotMessage(`ತಪ್ಪಾಯಿತು! ಮತ್ತೆ ಪ್ರಯತ್ನಿಸು! ❌`);
        }
    }
</script>
</body>
</html>
