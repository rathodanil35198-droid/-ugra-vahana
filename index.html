<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch & Earn App Demo</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 650px;
        }

        .header {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h2 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .wallet-card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .video-box {
            width: 100%;
            height: 200px;
            background-color: #000;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
            margin-bottom: 15px;
        }

        .timer-overlay {
            font-size: 32px;
            font-weight: bold;
            color: #FFD700;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #2196F3;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .status-msg {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header Section -->
    <div class="header">
        <h2> Watch & Earn App</h2>
        <div class="wallet-card">
            ಬ್ಯಾಲೆನ್ಸ್: <span id="balance-display">₹0.00</span>
        </div>
    </div>

    <!-- Main Content Screens -->
    <div class="content">

        <!-- 1. Login Screen -->
        <div id="login-screen" class="screen active">
            <h3>ಲಾಗಿನ್ ಮಾಡಿ</h3>
            <p style="color: #666; font-size: 13px; margin-bottom: 15px;">ವಿಡಿಯೋ ನೋಡಿ ಹಣ ಗಳಿಸಲು ಲಾಗಿನ್ ಆಗಿ</p>
            <input type="text" id="username" placeholder="ನಿಮ್ಮ ಹೆಸರು">
            <input type="tel" id="mobile" placeholder="ಮೊಬೈಲ್ ಸಂಖ್ಯೆ (10 Digit)">
            <button class="btn" onclick="loginUser()">ಆ್ಯಪ್ ಪ್ರವೇಶಿಸಿ</button>
            <div id="login-msg" class="status-msg"></div>
        </div>

        <!-- 2. Home / Watch Video Screen -->
        <div id="home-screen" class="screen">
            <h3>30-ಸೆಕೆಂಡ್ ವಿಡಿಯೋ ವೀಕ್ಷಿಸಿ</h3>
            <p style="color: #666; font-size: 13px; margin-bottom: 10px;">ಪ್ರತಿ ವಿಡಿಯೋಗೆ: ₹0.10 ಸಿಗುತ್ತದೆ</p>

            <div class="video-box">
                <div id="video-placeholder">🎬 ಜಾಹೀರಾತು ವಿಡಿಯೋ</div>
                <div id="timer-display" class="timer-overlay" style="display:none;">30</div>
            </div>

            <button id="start-btn" class="btn" onclick="startVideo()">ವಿಡಿಯೋ ಪ್ಲೇ ಮಾಡಿ (Play)</button>
            <button class="btn btn-secondary" onclick="showScreen('withdraw-screen')">ಹಣ ವಿಥ್‌ಡ್ರಾ ಮಾಡಿ (Withdraw)</button>
            <div id="reward-msg" class="status-msg" style="color: #388E3C;"></div>
        </div>

        <!-- 3. Withdrawal Screen -->
        <div id="withdraw-screen" class="screen">
            <h3>ಹಣ ವರ್ಗಾವಣೆ (Withdraw)</h3>
            <p style="color: #666; font-size: 13px; margin-bottom: 10px;">ಕನಿಷ್ಠ ವಿಥ್‌ಡ್ರಾ ಮೊತ್ತ: ₹5.00</p>
            
            <input type="text" id="upi-id" placeholder="ನಿಮ್ಮ UPI ID (eg: name@upi / phonepe)">
            <input type="number" id="withdraw-amount" placeholder="ವಿಥ್‌ಡ್ರಾ ಮಾಡಬೇಕಾದ ಮೊತ್ತ (₹)">
            
            <button class="btn" onclick="processWithdrawal()">UPI ಗೆ ವರ್ಗಾಯಿಸಿ</button>
            <button class="btn btn-secondary" onclick="showScreen('home-screen')">ಹಿಂತಿರುಗಿ (Back)</button>
            <div id="withdraw-msg" class="status-msg"></div>
        </div>

    </div>
</div>

<script>
    // App State Management
    let userBalance = 0.00;
    let isWatching = false;
    let countdown;

    // Switch between screens
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        document.getElementById('reward-msg').innerText = "";
        document.getElementById('withdraw-msg').innerText = "";
    }

    // Login validation
    function loginUser() {
        const name = document.getElementById('username').value.trim();
        const mobile = document.getElementById('mobile').value.trim();
        const msg = document.getElementById('login-msg');

        if (name === "" || mobile.length !== 10) {
            msg.innerText = "ದಯವಿಟ್ಟು ಸರಿಯಾದ ಹೆಸರು ಮತ್ತು 10 ಅಂಕಿಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ನಮೂದಿಸಿ.";
            return;
        }

        showScreen('home-screen');
    }

    // Start 30-second Video Logic
    function startVideo() {
        if (isWatching) return;

        isWatching = true;
        let timeLeft = 30; // 30 seconds timer
        
        const startBtn = document.getElementById('start-btn');
        const videoPlaceholder = document.getElementById('video-placeholder');
        const timerDisplay = document.getElementById('timer-display');
        const rewardMsg = document.getElementById('reward-msg');

        startBtn.disabled = true;
        videoPlaceholder.style.display = 'none';
        timerDisplay.style.display = 'block';
        timerDisplay.innerText = timeLeft;
        rewardMsg.innerText = "";

        countdown = setInterval(() => {
            timeLeft--;
            timerDisplay.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                
                // Add Reward Money (e.g., ₹0.10 per view)
                userBalance += 0.10;
                updateBalanceDisplay();

                // Reset UI
                timerDisplay.style.display = 'none';
                videoPlaceholder.style.display = 'block';
                startBtn.disabled = false;
                isWatching = false;

                rewardMsg.innerText = "🎉 ಅಭಿನಂದನೆಗಳು! ₹0.10 ನಿಮ್ಮ ವಾಲೆಟ್‌ಗೆ ಜಮೆಯಾಗಿದೆ.";
            }
        }, 1000);
    }

    // Balance Display Helper
    function updateBalanceDisplay() {
        document.getElementById('balance-display').innerText = "₹" + userBalance.toFixed(2);
    }

    // Handle Withdrawal
    function processWithdrawal() {
        const upiId = document.getElementById('upi-id').value.trim();
        const amount = parseFloat(document.getElementById('withdraw-amount').value);
        const msg = document.getElementById('withdraw-msg');

        if (!upiId.includes('@')) {
            msg.style.color = "#d32f2f";
            msg.innerText = "ದಯವಿಟ್ಟು ಸರಿಯಾದ UPI ID ನಮೂದಿಸಿ.";
            return;
        }

        if (isNaN(amount) || amount < 5.00) {
            msg.style.color = "#d32f2f";
            msg.innerText = "ಕನಿಷ್ಠ ವಿಥ್‌ಡ್ರಾ ಮೊತ್ತ ₹5.00 ಆಗಿರಬೇಕು.";
            return;
        }

        if (amount > userBalance) {
            msg.style.color = "#d32f2f";
            msg.innerText = "ನಿಮ್ಮ ವಾಲೆಟ್‌ನಲ್ಲಿ ಕನಿಷ್ಠ ಹಣ ಲಭ್ಯವಿಲ್ಲ.";
            return;
        }

        // Deduct Balance
        userBalance -= amount;
        updateBalanceDisplay();

        msg.style.color = "#388E3C";
        msg.innerText = `✅ request ಯಶಸ್ವಿಯಾಗಿದೆ! ₹${amount.toFixed(2)} ಅನ್ನು ${upiId} ಗೆ ಶೀಘ್ರದಲ್ಲೇ ಕಳುಹಿಸಲಾಗುವುದು.`;
        
        document.getElementById('upi-id').value = "";
        document.getElementById('withdraw-amount').value = "";
    }
</script>

</body>
</html>
