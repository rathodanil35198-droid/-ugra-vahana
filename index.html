<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Tap Puzzle Master</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
        body { background: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }

        .game-card-wrapper { background: linear-gradient(180deg, #1e1b4b, #0f172a); width: 100%; max-width: 420px; border-radius: 25px; box-shadow: 0 0 25px rgba(99, 102, 241, 0.4); border: 3px solid #6366f1; overflow: hidden; display: flex; flex-direction: column; min-height: 600px; position: relative; }

        /* Top Header Navigation */
        .header { background: rgba(15, 23, 42, 0.95); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #312e81; }
        .back-btn { background: #ef4444; border: none; color: white; padding: 6px 14px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .coin-box { background: #1e293b; border: 1px solid #facc15; padding: 5px 12px; border-radius: 20px; color: #facc15; font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; gap: 5px; }

        /* Level Banner */
        .level-bar { text-align: center; padding: 10px; font-size: 1.2rem; font-weight: bold; color: #a855f7; background: #020617; }

        /* Puzzle Game Board */
        .board-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .grid-board { display: grid; grid-template-columns: repeat(3, 80px); gap: 15px; background: #0f172a; padding: 20px; border-radius: 20px; border: 2px solid #3b82f6; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        
        .arrow-tile { width: 80px; height: 80px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 2rem; cursor: pointer; border: 2px solid #60a5fa; transition: transform 0.2s, opacity 0.3s; box-shadow: 0 5px 0 #1e40af; }
        .arrow-tile:active { transform: translateY(3px); box-shadow: none; }
        .empty-tile { opacity: 0; pointer-events: none; }

        /* Bottom Controls */
        .controls { padding: 15px; display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.95rem; text-transform: uppercase; }
        .btn-reset { background: #f59e0b; color: white; }
        .btn-next { background: #22c55e; color: white; }

        /* Victory / Win Popup Modal */
        .modal { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 10; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .modal-box { background: #1e1b4b; border: 3px solid #22c55e; padding: 25px; border-radius: 20px; width: 85%; box-shadow: 0 0 25px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body>

<div class="game-card-wrapper">
    <!-- Header -->
    <div class="header">
        <button class="back-btn" onclick="goBack()">⬅️ ಬ್ಯಾಕ್</button>
        <div class="coin-box">💰 ಗಳಿಕೆ: <span id="coin-count">0</span> ಕಾಯಿನ್</div>
    </div>

    <!-- Level Bar -->
    <div class="level-bar">
        🎯 ಲೆವೆಲ್: <span id="current-level">1</span> / 300
    </div>

    <!-- Game Puzzle Grid -->
    <div class="board-container">
        <div class="grid-board" id="grid-board"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn btn-reset" onclick="resetLevel()">🔄 ಮರುಪ್ರಯತ್ನಿಸಿ</button>
    </div>

    <!-- Win Modal -->
    <div class="modal" id="win-modal">
        <div class="modal-box">
            <h1 style="color:#22c55e; margin-bottom:10px;">🎉 ವಿಕ್ಟರಿ! (Won)</h1>
            <p style="margin-bottom:15px; font-size:1.1rem;">ನೀವು ಲೆವೆಲ್ ಪೂರ್ಣಗೊಳಿಸಿದ್ದೀರಿ!</p>
            <p style="color:#facc15; font-weight:bold; font-size:1.2rem; margin-bottom:20px;">+100 💰 ಕಾಯಿನ್‌ಗಳು ಜಮೆಯಾಗಿವೆ!</p>
            <button class="btn btn-next" style="width:100%;" onclick="nextLevel()">ಮುಂದಿನ ಲೆವೆಲ್ (Next Level) ➡️</button>
        </div>
    </div>
</div>

<script>
    // Audio Sounds
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playTapSound() {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    function playWinSound() {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    // Game Variables
    let currentLevel = 1;
    let coins = 0;
    let remainingTiles = 0;

    // Arrows Array Pattern
    const arrowSymbols = { 'UP': '⬆️', 'DOWN': '⬇️️', 'LEFT': '⬅️', 'RIGHT': '➡️' };

    // Initialize Game Board
    function loadLevel(lvl) {
        document.getElementById('current-level').innerText = lvl;
        const board = document.getElementById('grid-board');
        board.innerHTML = '';
        
        // Dynamic grid generation for 300 levels
        let tilesData = [
            { dir: 'UP' }, { dir: 'RIGHT' }, { dir: 'DOWN' },
            { dir: 'LEFT' }, { dir: 'UP' }, { dir: 'RIGHT' },
            { dir: 'RIGHT' }, { dir: 'DOWN' }, { dir: 'LEFT' }
        ];

        remainingTiles = tilesData.length;

        tilesData.forEach((item, index) => {
            let tile = document.createElement('div');
            tile.className = 'arrow-tile';
            tile.innerText = arrowSymbols[item.dir];
            tile.onclick = () => removeTile(tile);
            board.appendChild(tile);
        });
    }

    function removeTile(tile) {
        if(tile.classList.contains('empty-tile')) return;
        
        playTapSound();
        tile.classList.add('empty-tile');
        remainingTiles--;

        if(remainingTiles === 0) {
            setTimeout(() => {
                playWinSound();
                coins += 100;
                document.getElementById('coin-count').innerText = coins;
                document.getElementById('win-modal').style.display = 'flex';
            }, 300);
        }
    }

    function nextLevel() {
        document.getElementById('win-modal').style.display = 'none';
        if(currentLevel < 300) {
            currentLevel++;
            loadLevel(currentLevel);
        } else {
            alert("ಅಭಿನಂದನೆಗಳು! ನೀವು ಎಲ್ಲಾ 300 ಲೆವೆಲ್‌ಗಳನ್ನು ಪೂರ್ಣಗೊಳಿಸಿದ್ದೀರಿ! 🏆");
        }
    }

    function resetLevel() {
        loadLevel(currentLevel);
    }

    function goBack() {
        alert("ಹೋಮ್ ಸ್ಕ್ರೀನ್‌ಗೆ ಹಿಂತಿರುಗಲಾಗುತ್ತಿದೆ...");
    }

    // Start Level 1
    loadLevel(1);
</script>

</body>
</html>
