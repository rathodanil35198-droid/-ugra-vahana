<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಲೋಕಲ್ ಇ-ಕಾಮರ್ಸ್ ಆಪ್ - Shahapur Market</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- ಮೇಲಿನ ನ್ಯಾವಿಗೇಷನ್ ಬಾರ್ / ರೋಲ್ ಸ್ವಿಚ್ -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🛒 ತಾಲೂಕು ಮಾರ್ಕೆಟ್ (Shahapur)</h1>
            <div class="flex gap-2">
                <button onclick="switchRole('customer')" id="btn-customer" class="px-3 py-1 bg-indigo-800 rounded text-sm font-semibold">ಗ್ರಾಹಕರು</button>
                <button onclick="switchRole('vendor')" id="btn-vendor" class="px-3 py-1 bg-indigo-700 rounded text-sm font-semibold">ಅಂಗಡಿಯವರು</button>
                <button onclick="switchRole('delivery')" id="btn-delivery" class="px-3 py-1 bg-indigo-700 rounded text-sm font-semibold">ಡೆಲಿವರಿ</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-2xl">

        <!-- ೧. ಗ್ರಾಹಕರ ವೀಕ್ಷಣೆ (Customer View) -->
        <div id="view-customer" class="space-y-4">
            <div class="bg-white p-4 rounded-lg shadow">
                <h2 class="text-lg font-bold text-gray-800 mb-2">🛍️ ಲಭ್ಯವಿರುವ ವಸ್ತುಗಳು</h2>
                <div id="product-list" class="grid grid-cols-1 gap-3">
                    <!-- JavaScript ಮೂಲಕ ಪ್ರಾಡಕ್ಟ್ ಲಿಸ್ಟ್ ಇಲ್ಲಿ ಬರುತ್ತದೆ -->
                </div>
            </div>

            <div class="bg-white p-4 rounded-lg shadow">
                <h3 class="font-bold text-gray-800 mb-2">🛒 ನಿಮ್ಮ ಕಾರ್ಟ್ (Cart)</h3>
                <div id="cart-items" class="text-gray-600 text-sm mb-3">ಕಾರ್ಟ್ ಖಾಲಿಯಿದೆ.</div>
                <button onclick="placeOrder()" class="w-full bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700">ಆರ್ಡರ್ ಮಾಡಿ (Place Order)</button>
            </div>
        </div>

        <!-- ೨. ಅಂಗಡಿಯವರ ವೀಕ್ಷಣೆ (Vendor View) -->
        <div id="view-vendor" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-lg shadow">
                <h2 class="text-lg font-bold text-gray-800 mb-2">➕ ಹೊಸ ವಸ್ತು ಸೇರಿಸಿ</h2>
                <input type="text" id="p-name" placeholder="ವಸ್ತುವಿನ ಹೆಸರು (ಉದಾ: ಅಕ್ಕಿ 1kg)" class="w-full p-2 border rounded mb-2">
                <input type="number" id="p-price" placeholder="ಬೆಲೆ (₹)" class="w-full p-2 border rounded mb-2">
                <button onclick="addProduct()" class="w-full bg-indigo-600 text-white py-2 rounded font-bold">ವಸ್ತು ಸೇರಿಸಿ</button>
            </div>

            <div class="bg-white p-4 rounded-lg shadow">
                <h2 class="text-lg font-bold text-gray-800 mb-2">📦 ಬಂದಿರುವ ಆರ್ಡರ್‌ಗಳು</h2>
                <div id="vendor-orders" class="space-y-2 text-sm text-gray-600">ಯಾವ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.</div>
            </div>
        </div>

        <!-- ೩. ಡೆಲಿವರಿ ಬಾಯ್ ವೀಕ್ಷಣೆ (Delivery View) -->
        <div id="view-delivery" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-lg shadow">
                <h2 class="text-lg font-bold text-gray-800 mb-2">🛵 ಡೆಲಿವರಿ ಮಾಡಬೇಕಾದ ಆರ್ಡರ್‌ಗಳು</h2>
                <div id="delivery-orders" class="space-y-2 text-sm text-gray-600">ಯಾವುದೇ ಡೆಲಿವರಿ ಬಾಕಿ ಇಲ್ಲ.</div>
            </div>
        </div>

    </main>

    <!-- ಜಾವಾಸ್ಕ್ರಿಪ್ಟ್ ಲಾಜಿಕ್ -->
    <script>
        // ಆರಂಭಿಕ ಡೇಟಾ
        let products = JSON.parse(localStorage.getItem('products')) || [
            { id: 1, name: 'ಸೋನಾ ಮಸೂರಿ ಅಕ್ಕಿ (10kg)', price: 550 },
            { id: 2, name: 'ಸೂರ್ಯಕಾಂತಿ ಎಣ್ಣೆ (1L)', price: 140 }
        ];

        let cart = [];
        let orders = JSON.parse(localStorage.getItem('orders')) || [];

        // ರೋಲ್ ಬದಲಾಯಿಸುವ ಫಂಕ್ಷನ್
        function switchRole(role) {
            document.getElementById('view-customer').classList.add('hidden');
            document.getElementById('view-vendor').classList.add('hidden');
            document.getElementById('view-delivery').classList.add('hidden');

            document.getElementById('btn-customer').className = "px-3 py-1 bg-indigo-700 rounded text-sm font-semibold";
            document.getElementById('btn-vendor').className = "px-3 py-1 bg-indigo-700 rounded text-sm font-semibold";
            document.getElementById('btn-delivery').className = "px-3 py-1 bg-indigo-700 rounded text-sm font-semibold";

            document.getElementById('view-' + role).classList.remove('hidden');
            document.getElementById('btn-' + role).className = "px-3 py-1 bg-indigo-900 rounded text-sm font-semibold border border-white";

            renderAll();
        }

        // ಪ್ರಾಡಕ್ಟ್ ಸೇರಿಸುವುದು (ಅಂಗಡಿಯವರಿಂದ)
        function addProduct() {
            let name = document.getElementById('p-name').value;
            let price = document.getElementById('p-price').value;
            if(!name || !price) {
                alert('ದಯವಿಟ್ಟು ಹೆಸರು ಮತ್ತು ಬೆಲೆ ನಮೂದಿಸಿ!');
                return;
            }
            products.push({ id: Date.now(), name: name, price: Number(price) });
            localStorage.setItem('products', JSON.stringify(products));
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            alert('ವಸ್ತು ಯಶಸ್ವಿಯಾಗಿ ಸೇರಿದೆ!');
            renderAll();
        }

        // ಕಾರ್ಟ್‌ಗೆ ಸೇರಿಸುವುದು
        function addToCart(id) {
            let prod = products.find(p => p.id === id);
            cart.push(prod);
            renderCart();
        }

        // ಕಾರ್ಟ್ ಪ್ರದರ್ಶನ
        function renderCart() {
            let cartDiv = document.getElementById('cart-items');
            if(cart.length === 0) {
                cartDiv.innerHTML = "ಕಾರ್ಟ್ ಖಾಲಿಯಿದೆ.";
                return;
            }
            let total = 0;
            let html = "";
            cart.forEach((item, index) => {
                total += item.price;
                html += `<div class="flex justify-between border-b py-1"><span>${item.name}</span> <span>₹${item.price}</span></div>`;
            });
            html += `<div class="font-bold mt-2 flex justify-between"><span>ಒಟ್ಟು ಮೊತ್ತ:</span> <span>₹${total}</span></div>`;
            cartDiv.innerHTML = html;
        }

        // ಆರ್ಡರ್ ಮಾಡುವುದು (ಗ್ರಾಹಕರಿಂದ)
        function placeOrder() {
            if(cart.length === 0) {
                alert('ನಿಮ್ಮ ಕಾರ್ಟ್ ಖಾಲಿಯಿದೆ!');
                return;
            }
            let newOrder = {
                id: Date.now(),
                items: [...cart],
                status: 'Pending (ಪ್ಯಾಕಿಂಗ್ ನಡೆಯುತ್ತಿದೆ)'
            };
            orders.push(newOrder);
            localStorage.setItem('orders', JSON.stringify(orders));
            cart = [];
            renderCart();
            alert('ನಿಮ್ಮ ಆರ್ಡರ್ ಯಶಸ್ವಿಯಾಗಿ ಸಲ್ಲಿಕೆಯಾಗಿದೆ!');
            renderAll();
        }

        // ಅಂಗಡಿಯವನು ಆರ್ಡರ್ ರೆಡಿ ಮಾಡುವುದು
        function markReady(orderId) {
            let ord = orders.find(o => o.id === orderId);
            if(ord) {
                ord.status = 'Ready for Delivery (ಡೆಲಿವರಿಗೆ ಸಿದ್ಧವಾಗಿದೆ)';
                localStorage.setItem('orders', JSON.stringify(orders));
                renderAll();
            }
        }

        // ಡೆಲಿವರಿ ಬಾಯ್ ಡೆಲಿವರಿ ಪೂರ್ಣಗೊಳಿಸುವುದು
        function markDelivered(orderId) {
            orders = orders.filter(o => o.id !== orderId);
            localStorage.setItem('orders', JSON.stringify(orders));
            renderAll();
            alert('ಆರ್ಡರ್ ಯಶಸ್ವಿಯಾಗಿ ತಲುಪಿಸಲಾಗಿದೆ!');
        }

        // ಎಲ್ಲಾ ಸ್ಕ್ರೀನ್‌ಗಳನ್ನು ಅಪ್‌ಡೇಟ್ ಮಾಡುವುದು
        function renderAll() {
            // ಗ್ರಾಹಕರಿಗೆ ಪ್ರಾಡಕ್ಟ್ ತೋರಿಸುವುದು
            let pListDiv = document.getElementById('product-list');
            pListDiv.innerHTML = products.map(p => `
                <div class="flex justify-between items-center border p-2 rounded">
                    <div>
                        <h4 class="font-bold">${p.name}</h4>
                        <p class="text-green-600 font-semibold">₹${p.price}</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="bg-indigo-600 text-white px-3 py-1 rounded text-sm">ಸೇರಿಸಿ</button>
                </div>
            `).join('');

            // ಅಂಗಡಿಯವರಿಗೆ ಆರ್ಡರ್ ತೋರಿಸುವುದು
            let vOrdersDiv = document.getElementById('vendor-orders');
            let savedOrders = JSON.parse(localStorage.getItem('orders')) || [];
            if(savedOrders.length === 0) {
                vOrdersDiv.innerHTML = "ಯಾವ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.";
            } else {
                vOrdersDiv.innerHTML = savedOrders.map(o => `
                    <div class="border p-2 rounded bg-gray-50 mb-2">
                        <p><b>ಆರ್ಡರ್ ID:</b> ${o.id}</p>
                        <p><b>ಸ್ಥಿತಿ:</b> <span class="text-orange-600">${o.status}</span></p>
                        ${o.status.includes('Pending') ? `<button onclick="markReady(${o.id})" class="mt-2 bg-blue-600 text-white px-3 py-1 rounded text-xs">ಪ್ಯಾಕ್ ಆಯಿತು (Ready)</button>` : ''}
                    </div>
                `).join('');
            }

            // ಡೆಲಿವರಿ ಬಾಯ್‌ಗೆ ಆರ್ಡರ್ ತೋರಿಸುವುದು
            let dOrdersDiv = document.getElementById('delivery-orders');
            if(savedOrders.length === 0) {
                dOrdersDiv.innerHTML = "ಯಾವುದೇ ಡೆಲಿವರಿ ಬಾಕಿ ಇಲ್ಲ.";
            } else {
                dOrdersDiv.innerHTML = savedOrders.map(o => `
                    <div class="border p-2 rounded bg-gray-50 mb-2">
                        <p><b>ಆರ್ಡರ್ ID:</b> ${o.id}</p>
                        <p><b>ಸ್ಥಿತಿ:</b> ${o.status}</p>
                        <button onclick="markDelivered(${o.id})" class="mt-2 bg-green-600 text-white px-3 py-1 rounded text-xs">ತಲುಪಿಸಲಾಗಿದೆ (Delivered)</button>
                    </div>
                `).join('');
            }
        }

        // ಒಮ್ಮೆ ಲೋಡ್ ಆದಾಗ ರನ್ ಮಾಡಿ
        renderAll();
    </script>
</body>
</html>
