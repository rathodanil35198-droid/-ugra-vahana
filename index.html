<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಮಕ್ಕಳ ಡಿಜಿಟಲ್ ಶಾಲೆ</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Baloo Tamma 2', 'Nunito', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        #app-container {
            width: 100%;
            max-width: 450px;
            height: 92vh;
            max-height: 850px;
            background: #ffffff;
            border-radius: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 8px solid #FFF066;
        }

        /* Header */
        .app-header {
            background: linear-gradient(180deg, #4FACFE 0%, #00F2FE 100%);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 40px; height: 40px; background: #FFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px solid #FFD700; }
        .user-details h3 { font-size: 1rem; line-height: 1.1; }
        .user-details p { font-size: 0.8rem; opacity: 0.9; }

        .score-badge {
            background: #FFD700;
            color: #4A3B00;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 3px 0 #C9A800;
        }

        /* Screen Area */
        .screen { flex: 1; padding: 15px; display: flex; flex-direction: column; overflow-y: auto; }

        /* Screen 1: Welcome */
        #welcome-screen { justify-content: center; align-items: center; text-align: center; gap: 15px; }
        .robot-box { cursor: pointer; animation: bounce 2s infinite alternate ease-in-out; }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-12px); } }
        .robot-svg { width: 130px; height: 130px; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15)); }

        .speech-bubble {
            background: #FFF9C4;
            border: 3px solid #FBC02D;
            border-radius: 20px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 0 #FBC02D;
            max-width: 90%;
        }

        .input-group { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .custom-input, .custom-select {
            width: 100%;
            padding: 12px 16px;
            border: 3px solid #4FACFE;
            border-radius: 18px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            font-weight: bold;
            color: #2C3E50;
            background: #F4F9FF;
        }

        .btn-start {
            background: linear-gradient(180deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 #1b7a54;
        }

        /* Dashboard */
        .dashboard-title { text-align: center; color: #FF4081; font-size: 1.2rem; margin-bottom: 12px; font-weight: 800; }
        
        /* 균일한 4개 ಲೋಗೋ ಬಟನ್‌ಗಳ ಗ್ರಿಡ್ (Uniform 2x2 Grid) */
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .category-card {
            background: #FFF;
            border-radius: 20px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
            border: 3px solid #EEE;
            cursor: pointer;
            min-height: 120px;
        }
        .card-kn { border-color: #FF9F43; background: #FFF9F0; }
        .card-jodi { border-color: #9b59b6; background: #F3E5F5; }
        .card-en { border-color: #54a0ff; background: #F0F7FF; }
        .card-math { border-color: #10ac84; background: #EBFBF7; }
        .card-exam { border-color: #ee5253; background: #FFF0F0; }
        .card-icon { font-size: 2.2rem; }
        .card-title { font-size: 0.95rem; font-weight: 800; color: #2D3436; }

        /* Writing Display Screen */
        .writing-display-box {
            background: #E0F7FA;
            border: 3px dashed #00ACC1;
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 12px;
            text-align: center;
            display: block;
        }
        .writing-title { font-size: 0.9rem; color: #00838F; font-weight: bold; }
        .writing-text { font-size: 1.8rem; font-weight: 800; color: #D81B60; letter-spacing: 2px; margin: 3px 0; }
        .writing-breakdown { font-size: 1rem; color: #2E7D32; font-weight: bold; }

        /* Lesson & Pagination View */
        .lesson-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .btn-back { background: #FF6B6B; color: white; border: none; padding: 6px 14px; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #c0392b; }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .item-card {
            aspect-ratio: 1;
            background: white;
            border: 3px solid #74b9ff;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #0984e3;
            padding: 5px;
            text-align: center;
        }
        .item-char { font-size: 1.4rem; font-weight: 800; color: #2c3e50; word-break: break-all; }
        .item-sub { font-size: 0.75rem; color: #7f8c8d; font-weight: bold; }

        /* Pagination Controls */
        .pagination-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .btn-page { background: #2196F3; color: white; border: none; padding: 10px 14px; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #1976D2; }
        .btn-page:disabled { background: #BDC3C7; box-shadow: none; cursor: not-allowed; }
        .page-info { font-weight: bold; color: #2C3E50; }

        /* Quiz View */
        .quiz-container { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }
        .question-box {
            background: #FFF3E0;
            border: 3px solid #FF9800;
            border-radius: 18px;
            padding: 15px;
            width: 100%;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #E65100;
            box-shadow: 0 4px 0 #FB8C00;
        }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
        .option-btn {
            background: #E3F2FD;
            border: 3px solid #2196F3;
            padding: 15px;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #0D47A1;
            cursor: pointer;
            box-shadow: 0 4px 0 #1976D2;
            text-align: center;
        }

        /* Fixed Bottom Assistant Bar & Mic / Go Controls */
        .assistant-bar {
            background: #FFF8E1;
            border-top: 3px solid #FFE082;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            width: 100%;
        }
        .chat-top { display: flex; align-items: center; gap: 10px; }
        .mini-robot { width: 35px; height: 35px; flex-shrink: 0; }
        .robot-msg { font-size: 0.9rem; font-weight: bold; color: #5D4037; flex: 1; }
        
        .chat-input-box { display: flex; gap: 6px; width: 100%; align-items: center; }
        .chat-input { flex: 1; padding: 10px 12px; border: 2px solid #FFB74D; border-radius: 12px; font-size: 0.95rem; outline: none; }
        .btn-mic { 
            background: #E91E63; 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 12px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 3px 0 #C2185B;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-mic.listening {
            background: #4CAF50;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        /* ಹೊಸ GO ಬಟನ್ */
        .btn-go { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 10px 16px; 
            border-radius: 12px; 
            font-size: 1rem; 
            font-weight: 800; 
            cursor: pointer; 
            box-shadow: 0 3px 0 #2E7D32; 
            flex-shrink: 0; 
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">

    <!-- Header -->
    <div id="app-header" class="app-header hidden">
        <div class="user-info">
            <div class="user-avatar">🤖</div>
            <div class="user-details">
                <h3 id="display-name">ಮಗು</h3>
                <p id="display-class">ತರಗತಿ: ೧</p>
            </div>
        </div>
        <div class="score-badge">⭐ <span id="score-val">10</span></div>
    </div>

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen" class="screen">
        <div class="speech-bubble" id="welcome-bubble">
            ನಮಸ್ಕಾರ! 👋 ನಿಮ್ಮ ಹೆಸರನ್ನು ಬರೆದು, ಎಷ್ಟನೇ ತರಗತಿ ಎಂದು ಆಯ್ಕೆ ಮಾಡಿ!
        </div>
        
        <div class="robot-box" onclick="playWelcomeAudio()">
            <svg class="robot-svg" viewBox="0 0 200 200">
                <rect x="50" y="60" width="100" height="90" rx="20" fill="#4FACFE" stroke="#00C6FF" stroke-width="5"/>
                <circle cx="80" cy="95" r="15" fill="#FFF"/><circle cx="120" cy="95" r="15" fill="#FFF"/>
                <circle cx="80" cy="95" r="7" fill="#2C3E50"/><circle cx="120" cy="95" r="7" fill="#2C3E50"/>
                <path d="M 80 125 Q 100 145 120 125" stroke="#FFF" stroke-width="6" fill="none" stroke-linecap="round"/>
                <rect x="90" y="25" width="20" height="35" fill="#FFD700"/>
                <circle cx="100" cy="20" r="12" fill="#FF4757"/>
            </svg>
        </div>

        <div class="input-group">
            <input type="text" id="student-name" class="custom-input" placeholder="ನಿಮ್ಮ ಹೆಸರು ಬರೆಯಿರಿ..." value="ಅರ್ಜುನ್">
            
            <select id="student-class" class="custom-select">
                <option value="1">೧ ನೇ ತರಗತಿ (Class 1)</option>
                <option value="2">೨ ನೇ ತರಗತಿ (Class 2)</option>
                <option value="3">೩ ನೇ ತರಗತಿ (Class 3)</option>
                <option value="4">೪ ನೇ ತರಗತಿ (Class 4)</option>
                <option value="5">೫ ನೇ ತರಗತಿ (Class 5)</option>
            </select>
            
            <button class="btn-start" onclick="startApp()">ಕಲಿಕೆ ಆರಂಭಿಸಿ 🚀</button>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="screen hidden">
        <div class="dashboard-title">ಏನು ಕಲಿಯಲು ಬಯಸುತ್ತೀಯಾ? 👇</div>
        
        <!-- ಪರದೆಯ ಮೇಲ್ಭಾಗದಲ್ಲಿ ಉತ್ತರ ತೋರುವ ಬಾಕ್ಸ್ -->
        <div id="writing-board" class="writing-display-box">
            <div class="writing-title" id="write-title">💡 ಉತ್ತರ ಪ್ರದರ್ಶನ:</div>
            <div class="writing-text" id="write-word">ಅನಿಲ್</div>
            <div class="writing-breakdown" id="write-breakdown">ಅ + ನಿ + ಲ್ = ಅನಿಲ್</div>
        </div>

        <!-- ೪ ಪ್ರಮುಖ ಬಟನ್‌ಗಳು ಒಂದೇ ಸಮನಾಗಿ ಜೋಡಣೆಯಾಗಿವೆ -->
        <div class="category-grid">
            <div class="category-card card-kn" onclick="openModule('kannada')">
                <div class="card-icon">ಅ</div>
                <div class="card-title">ಕನ್ನಡ ಅಕ್ಷರಗಳು</div>
            </div>

            <div class="category-card card-jodi" onclick="openModule('jodakshara')">
                <div class="card-icon">🧩</div>
                <div class="card-title">ಅಕ್ಷರ ಜೋಡಣೆ & ಜೋಡಾಕ್ಷರ (೧-೨೦)</div>
            </div>

            <div class="category-card card-en" onclick="openModule('english')">
                <div class="card-icon">A</div>
                <div class="card-title">English ABC & Words</div>
            </div>

            <div class="category-card card-math" onclick="openModule('maths')">
                <div class="card-icon">🔢</div>
                <div class="card-title">ಸಂಖ್ಯೆಗಳು (Numbers)</div>
            </div>
        </div>
    </div>

    <!-- LEARNING MODULE VIEW -->
    <div id="learning-screen" class="screen hidden">
        <div class="lesson-header">
            <button class="btn-back" onclick="goDashboard()">⬅️ ಹಿಂದೆ</button>
            <h3 id="module-title" style="color:#2C3E50;">ಕಲಿಕೆ</h3>
        </div>
        
        <div id="cards-container" class="cards-grid"></div>

        <div class="pagination-bar">
            <button id="btn-prev" class="btn-page" onclick="changePage(-1)">⬅️ ಹಿಂದಿನ ಪುಟ</button>
            <span id="page-number" class="page-info">ಪುಟ ೧</span>
            <button id="btn-next" class="btn-page" onclick="changePage(1)">ಮುಂದಿನ ಪುಟ ➡</button>
        </div>
    </div>

    <!-- Fixed Voice Assistant & Go Panel -->
    <div id="assistant-bar" class="assistant-bar hidden">
        <div class="chat-top">
            <svg class="mini-robot" viewBox="0 0 200 200">
                <rect x="50" y="60" width="100" height="90" rx="20" fill="#4FACFE"/>
                <circle cx="80" cy="95" r="10" fill="#FFF"/><circle cx="120" cy="95" r="10" fill="#FFF"/>
                <path d="M 85 125 Q 100 135 115 125" stroke="#FFF" stroke-width="5" fill="none"/>
            </svg>
            <div class="robot-msg" id="robot-speech">ನಿನ್ನ ಪ್ರಶ್ನೆ ಕೇಳು ಮಗು!</div>
        </div>
        <div class="chat-input-box">
            <input type="text" id="chat-text" class="chat-input" placeholder="ಇಲ್ಲಿ ಪ್ರಶ್ನೆ ಬರೆಯಿರಿ..." onkeypress="handleKeyPress(event)">
            <button id="mic-btn" class="btn-mic" onclick="startVoiceRecognition()">🎤</button>
            <button class="btn-go" onclick="sendChat()">GO ➔</button>
        </div>
    </div>

</div>

<script>
    let studentName = "";
    let studentClass = "";
    let userScore = 10;

    let currentModule = "";
    let currentPage = 1;
    const itemsPerPage = 12;

    const kannadaData = [
        { char: 'ಅ', name: 'ಅರಸ' }, { char: 'ಆ', name: 'ಆನೆ' }, { char: 'ಇ', name: 'ಇಲಿ' }, { char: 'ಈ', name: 'ಈಶ' },
        { char: 'ಉ', name: 'ಉಟ' }, { char: 'ಊ', name: 'ಊಟ' }, { char: 'ಋ', name: 'ಋಷಿ' }, { char: 'ಎ', name: 'ಎಲೆ' },
        { char: 'ಏ', name: 'ಏಣಿ' }, { char: 'ಐ', name: 'ಐದನೇ' }, { char: 'ಒ', name: 'ಒಂಟೆ' }, { char: 'ಓ', name: 'ಓಡು' },
        { char: 'ಔ', name: 'ಔಷಧ' }, { char: 'ಅಂ', name: 'ಅಂಬಾರಿ' }, { char: 'ಕ', name: 'ಕಮಲ' }, { char: 'ಖ', name: 'ಖಡ್ಗ' }
    ];

    const jodaksharaData = [
        { char: 'ಮರ', type: '೨ ಅಕ್ಷರ', breakdown: 'ಮ + ರ = ಮರ' },
        { char: 'ಮನೆ', type: '೨ ಅಕ್ಷರ', breakdown: 'ಮ + ನೆ = ಮನೆ' },
        { char: 'ಅರಸ', type: '೩ ಅಕ್ಷರ', breakdown: 'ಅ + ರ + ಸ = ಅರಸ' },
        { char: 'ಪುಸ್ತಕ', type: '೩ ಅಕ್ಷರ', breakdown: 'ಪು + ಸ್ತ + ಕ = ಪುಸ್ತಕ' },
        { char: 'ಅರಮನೆ', type: '೪ ಅಕ್ಷರ', breakdown: 'ಅ + ರ + ಮ + ನೆ = ಅರಮನೆ' }
    ];

    const englishData = [
        { char: 'A', name: 'Apple', desc: 'Apple is red.' },
        { char: 'B', name: 'Ball', desc: 'Ball is for playing.' },
        { char: 'C', name: 'Cat', desc: 'Cat says Meow.' }
    ];

    function playWelcomeAudio() {
        speakText("ನಮಸ್ಕಾರ! ನಿಮ್ಮ ಹೆಸರನ್ನು ಹಾಕಿ ಮತ್ತು ತರಗತಿಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ!");
    }

    function speakText(text) {
        try {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'kn-IN';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        } catch (e) { console.log(e); }
    }

    function setRobotMessage(msg) {
        document.getElementById('robot-speech').innerText = msg;
        speakText(msg);
    }

    function startApp() {
        const nameInput = document.getElementById('student-name').value.trim();
        studentClass = document.getElementById('student-class').value;
        studentName = nameInput ? nameInput : "ಮಗು";

        document.getElementById('display-name').innerText = studentName;
        document.getElementById('display-class').innerText = "ತರಗತಿ: " + studentClass;

        document.getElementById('welcome-screen').classList.add('hidden');
        document.getElementById('app-header').classList.remove('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
        document.getElementById('assistant-bar').classList.remove('hidden');

        setRobotMessage(`ಸ್ವಾಗತ ${studentName}! ಪ್ರಶ್ನೆ ಕೇಳಲು GO ಬಟನ್ ಬಳಸಿ.`);
    }

    function goDashboard() {
        document.getElementById('learning-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
    }

    function openModule(moduleType) {
        currentModule = moduleType;
        currentPage = 1;
        document.getElementById('dashboard-screen').classList.add('hidden');
        document.getElementById('learning-screen').classList.remove('hidden');
        renderPaginatedContent();
    }

    function renderPaginatedContent() {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';
        document.getElementById('page-number').innerText = `ಪುಟ ${currentPage}`;
        document.getElementById('btn-prev').disabled = (currentPage === 1);

        let data = [];
        if (currentModule === 'kannada') data = kannadaData;
        else if (currentModule === 'jodakshara') data = jodaksharaData;
        else if (currentModule === 'english') data = englishData;

        let startIndex = (currentPage - 1) * itemsPerPage;
        let pageData = data.slice(startIndex, startIndex + itemsPerPage);

        document.getElementById('btn-next').disabled = (startIndex + itemsPerPage >= data.length);

        pageData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `<div class="item-char">${item.char}</div><div class="item-sub">${item.name || item.type}</div>`;
            card.onclick = () => {
                showInWritingBoard(item.char, item.breakdown || item.name);
                setRobotMessage(`${item.char}`);
            };
            container.appendChild(card);
        });
    }

    function changePage(dir) {
        currentPage += dir;
        renderPaginatedContent();
    }

    function showInWritingBoard(title, breakdown) {
        document.getElementById('writing-board').style.display = 'block';
        document.getElementById('write-word').innerText = title;
        document.getElementById('write-breakdown').innerText = breakdown || title;
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendChat(); }

    function sendChat() {
        const input = document.getElementById('chat-text');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        processChildQuery(text);
    }

    /* ರೋಬೋಟ್‌ನ ಸರಿಯಾದ ಪ್ರತ್ಯುತ್ತರ ಹಾಗೂ ಸ್ಕ್ರೀನ್ ಪ್ರದರ್ಶನ */
    function processChildQuery(text) {
        let cleanText = text.trim();
        
        // ಪಠ್ಯ ಒಡೆದು ಮಗುವಿಗೆ ತೋರಿಸುವುದು
        let letters = cleanText.split('').join(' + ');
        showInWritingBoard(cleanText, letters);

        // ಉಲ್ಟಾ ಮತ್ತು ತಪ್ಪು ಉತ್ತರಗಳನ್ನು ತಡೆಗಟ್ಟಿ ಅರ್ಥಪೂರ್ಣ ಪ್ರತ್ಯುತ್ತರ ನೀಡುವುದು
        if (cleanText.includes("ನೀನು ಯಾರು")) {
            setRobotMessage(`ನಾನು ನಿಮ್ಮ ಪ್ರೀತಿಯ ಕಲಿ ರೋಬೋಟ್ ${studentName}!`);
        } else if (cleanText.includes("ಹೆಸರು")) {
            setRobotMessage(`ನಿನ್ನ ಹೆಸರು ${studentName}, ನನ್ನ ಹೆಸರು ರೋಬೋಟ್!`);
        } else {
            setRobotMessage(`ನೀವು ಕೇಳಿದ ಉತ್ತರ: ${cleanText}. ಇದನ್ನು ಮೇಲಿನ ಬೋರ್ಡ್‌ನಲ್ಲಿ ಬರೆಯಲಾಗಿದೆ!`);
        }
    }

    /* ಮೈಕ್ ಕಾರ್ಯನಿರ್ವಹಣೆ */
    function startVoiceRecognition() {
        const micBtn = document.getElementById('mic-btn');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            setRobotMessage("ನಿಮ್ಮ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಮೈಕ್ ಲಭ್ಯವಿಲ್ಲ. ಪಠ್ಯವನ್ನು ಟೈಪ್ ಮಾಡಿ 'GO' ಬಟನ್ ಒತ್ತಿ.");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'kn-IN';

        micBtn.classList.add('listening');
        setRobotMessage("ನಾನು ಕೇಳುತ್ತಿದ್ದೇನೆ, ಮಾತನಾಡಿ...");

        recognition.start();

        recognition.onresult = function(event) {
            micBtn.classList.remove('listening');
            const transcript = event.results[0][0].transcript;
            document.getElementById('chat-text').value = transcript;
            processChildQuery(transcript);
        };

        recognition.onerror = function() {
            micBtn.classList.remove('listening');
            setRobotMessage("ಧ್ವನಿ ಸ್ಪಷ್ಟವಾಗಿಲ್ಲ. ದಯವಿಟ್ಟು ಬರೆದು 'GO' ಬಟನ್ ಬಳಸಿ!");
        };

        recognition.onend = function() {
            micBtn.classList.remove('listening');
        };
    }
</script>
