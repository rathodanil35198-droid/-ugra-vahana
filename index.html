            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

            background: #e7f1ff;
            color: #0d6efd;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;

            border: none;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;

            line-height: 1.4;

                category: "ಪರೀಕ್ಷೆಗಳು/ಮಕ್ಕಳಿಗೆ",
                benefit: "ಪಿಯುಸಿ, ಪದವಿ ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ ಶೈಕ್ಷಣಿಕ ಧನಸಹಾಯ",
                eligibility: "ಕಾಲೇಜಿನಲ್ಲಿ ವ್ಯಾಸಂಗ ಮಾಡುತ್ತಿರುವ ವಿದ್ಯಾರ್ಥಿಗಳು",
                documents: "SSLC ಮಾಸ್ ಕಾರ್ಡ್, ಕಾಲೇಜು ರಸೀದಿ, ಬ್ಯಾಂಕ್ ಖಾತೆ",
                lastDate: "2026-10-31",
                helpline: "1902"
            },
            {
                title: "ಉಚಿತ ಬೋರ್‌ವೆಲ್ ಸಬ್ಸಿಡಿ (ಗಂಗಾ ಕಲ್ಯಾಣ ಯೋಜನೆ)",
                category: "ರೈತರಿಗೆ",
                benefit: "ಬೋರ್‌ವೆಲ್ ಕೊರೆಸಲು ₹1.50 ಲಕ್ಷ ಸಬ್ಸಿಡಿ",
                eligibility: "ಸಣ್ಣ ಮತ್ತು ಅತಿ ಸಣ್ಣ ರೈತರು (SC/ST/OBC)",
                documents: "ಆಧಾರ್, RTC, ಜಾತಿ/ಆದಾಯ ಪ್ರಮಾಣಪತ್ರ",
                lastDate: "2026-11-15",
                helpline: "1800-425-3553"
            },
            {
                title: "ಉದ್ಯೋಗಿನಿ ಯೋಜನೆ (ಮಹಿಳಾ ಉದ್ಯಮ ಶಕ್ತಿ)",
                category: "ಮಹಿಳೆಯರಿಗೆ",
                benefit: "ವ್ಯಾಪಾರಕ್ಕೆ ₹3 ಲಕ್ಷದವರೆಗೆ ಶೇ.30 ಸಬ್ಸಿಡಿ ಸಾಲ",
                eligibility: "18 ರಿಂದ 55 ವರ್ಷದ ಮಹಿಳೆಯರು",
                documents: "ಆಧಾರ್, ರೇಷನ್ ಕಾರ್ಡ್, ಪ್ರಾಜೆಕ್ಟ್ ರಿಪೋರ್ಟ್",
                lastDate: "2026-12-01",
                helpline: "080-22253842"
            }
        ];

        let selectedCategory = "ಎಲ್ಲವೂ";

        function updateTaluks() {
            const distSelect = document.getElementById('districtSelect').value;
            const talukSelect = document.getElementById('talukSelect');
            const villageSelect = document.getElementById('villageSelect');
            
            talukSelect.innerHTML = '<option value="">-- ತಾಲೂಕು ಆಯ್ಕೆ ಮಾಡಿ --</option>';
            villageSelect.innerHTML = '<option value="">-- ಗ್ರಾಮ ಪಂಚಾಯತಿ / ಗ್ರಾಮ ಆಯ್ಕೆ ಮಾಡಿ --</option>';

            if (distSelect && locationData[distSelect]) {
                const taluks = locationData[distSelect].taluks;
                for (let key in taluks) {
                    let opt = document.createElement('option');
                    opt.value = key;
                    opt.innerText = taluks[key].name;
                    talukSelect.appendChild(opt);
                }
            } else if (distSelect) {
                let opt = document.createElement('option');
                opt.value = "general_taluk";
                opt.innerText = "ಮುಖ್ಯ ತಾಲೂಕು (ಸಾಮಾನ್ಯ)";
                talukSelect.appendChild(opt);
            }
        }

        function updateVillages() {
            const distSelect = document.getElementById('districtSelect').value;
            const talukSelect = document.getElementById('talukSelect').value;
            const villageSelect = document.getElementById('villageSelect');

            villageSelect.innerHTML = '<option value="">-- ಗ್ರಾಮ ಪಂಚಾಯತಿ / ಗ್ರಾಮ ಆಯ್ಕೆ ಮಾಡಿ --</option>';

            if (distSelect && talukSelect && locationData[distSelect] && locationData[distSelect].taluks[talukSelect]) {
                const villages = locationData[distSelect].taluks[talukSelect].villages;
                villages.forEach(v => {
                    let opt = document.createElement('option');
                    opt.value = v;
                    opt.innerText = v;
                    villageSelect.appendChild(opt);
                });
            } else {
                let opt = document.createElement('option');
                opt.value = "general_village";
                opt.innerText = "ಎಲ್ಲಾ ಗ್ರಾಮ ಪಂಚಾಯತಿಗಳು";
                villageSelect.appendChild(opt);
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance();
                msg.text = text;
                msg.lang = 'kn-IN';
                msg.rate = 0.9;
                window.speechSynthesis.speak(msg);
            } else {
                alert("ನಿಮ್ಮ ಮೊಬೈಲ್‌ನಲ್ಲಿ ಆಡಿಯೋ ಬೆಂಬಲವಿಲ್ಲ.");
            }
        }

        function renderSchemes(data) {
            const container = document.getElementById('schemesContainer');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div class="no-results">ಯಾವುದೇ ಮಾಹಿತಿ ಕಂಡುಬಂದಿಲ್ಲ.</div>';
                return;
            }

            data.forEach(scheme => {
                const card = document.createElement('div');
                card.className = 'scheme-card';

                const waMessage = encodeURIComponent(`${scheme.title} ಯೋಜನೆಗೆ ಅರ್ಜಿ ಸಲ್ಲಿಸಲು ಸಹಾಯ ಬೇಕು.`);
                const readContent = `${scheme.title}. ಲಾಭ: ${scheme.benefit}. ಅರ್ಹತೆ: ${scheme.eligibility}. ಕೊನೆಯ ದಿನಾಂಕ: ${scheme.lastDate}`;

                card.innerHTML = `
                    <div class="card-header-flex">
                        <span class="card-tag">${scheme.category}</span>
                        <button class="btn-audio" onclick="speakText('${readContent.replace(/'/g, "\\'")}')">🔊 ಆಡಿಯೋ ಪ್ಲೇ</button>
                    </div>
                    <h3>${scheme.title}</h3>
                    <div class="info-row"><strong>ವಿವರ/ಲಾಭ:</strong> ${scheme.benefit}</div>
                    <div class="info-row"><strong>ಅರ್ಹತೆ:</strong> ${scheme.eligibility}</div>
                    <div class="info-row"><strong>ದಾಖಲೆಗಳು:</strong> ${scheme.documents}</div>
                    <div class="info-row last-date"><strong>ಕೊನೆಯ ದಿನಾಂಕ:</strong> ${scheme.lastDate}</div>
                    
                    <div class="action-box">
                        <a href="https://wa.me/${MY_CONTACT_NUMBER}?text=${waMessage}" target="_blank" class="btn-wa">
                            💬 ಅರ್ಜಿ ಹಾಕಲು WhatsApp ಮಾಡಿ
                        </a>
                        <a href="tel:${scheme.helpline}" class="btn-helpline">📞 ಹೆಲ್ಪ್‌ಲೈನ್: ${scheme.helpline}</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCategory(category, element) {
            selectedCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = schemesData.filter(scheme => {
                const matchesCategory = (selectedCategory === "ಎಲ್ಲವೂ") || (scheme.category === selectedCategory);
                const matchesSearch = scheme.title.toLowerCase().includes(searchVal) || 
                                      scheme.benefit.toLowerCase().includes(searchVal) ||
                                      scheme.category.toLowerCase().includes(searchVal);
                return matchesCategory && matchesSearch;
            });

            renderSchemes(filtered);
        }

        window.onload = () => {
            renderSchemes(schemesData);
        };
    </script>
</body>
</html>
